<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CAMCARE - Enterprise Management System</title>
  
  <!-- Libraries -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  
  <style>
    body { 
      font-family: 'Prompt', sans-serif; 
      background-color: #f8fafc; 
      overflow-x: hidden; 
      scroll-behavior: smooth; 
      -webkit-overflow-scrolling: touch;
      -webkit-tap-highlight-color: transparent;
    }
    
    .fade-in { animation: fadeIn 0.2s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .touch-friendly { transition: all 0.1s ease; cursor: pointer; touch-action: manipulation; }
    .touch-friendly:active { transform: scale(0.96); opacity: 0.8; }
    
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    
    #leaflet-map { width: 100%; height: 100%; z-index: 0; }
    .cctv-marker { display: flex; justify-content: center; align-items: center; border-radius: 50%; color: white; font-size: 14px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border: 2px solid white; transition: all 0.2s; cursor: pointer; }
    .marker-normal { background-color: #10B981; }
    .marker-stream { background-color: #3B82F6; }
    .marker-external { background-color: #EAB308; }
    .marker-abnormal { background-color: #EF4444; }
    .custom-popup .leaflet-popup-content-wrapper { padding: 0 !important; border-radius: 16px !important; overflow: hidden !important; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3) !important; }
    .custom-popup .leaflet-popup-content { margin: 0 !important; width: 280px !important; max-width: 80vw !important; }
    
    table thead th { position: sticky; top: 0; z-index: 10; background-color: #f8fafc; box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); }

     /* ==============================================================
       Perfect Multi-Page Print CSS (Export PDF & Official Report)
       ============================================================== */
    @media print {
      @page { size: A4 portrait; margin: 10mm; }
      
      html, body, #root, #root > div, main, aside, section, .flex-1, .print-container, 
      .print-table-area, .overflow-y-auto, .overflow-x-auto, .custom-scrollbar {
        display: block !important;
        height: auto !important;
        min-height: 0 !important;
        max-height: none !important;
        overflow: visible !important;
        position: static !important;
        width: 100% !important;
      }
      
      aside, header, button, .no-print, .print-hide, .leaflet-control-container {
        display: none !important;
      }
      
      /* --- 1. SETTINGS FOR "EXPORT PDF" --- */
      body:not(.printing-report) table { page-break-inside: auto; width: 100% !important; border-collapse: collapse !important; }
      body:not(.printing-report) tr { page-break-inside: avoid; page-break-after: auto; }
      body:not(.printing-report) thead { display: table-header-group; position: static !important; }
      body:not(.printing-report) th, body:not(.printing-report) td { border: 1px solid #ccc !important; padding: 8px !important; color: black !important; font-size: 12px !important; white-space: normal !important; }
      body:not(.printing-report) th { background-color: #f3f4f6 !important; -webkit-print-color-adjust: exact; color: #374151 !important; font-weight: bold !important; }

      /* --- 2. SETTINGS FOR "PRINT REPORT" --- */
      body.printing-report main { display: none !important; }
      body.printing-report .fixed.inset-0 { position: static !important; background: white !important; padding: 0 !important; display: block !important; }
      body.printing-report .modal-print-wrapper { display: none !important; }
      body.printing-report #print-report-container { display: block !important; width: 100% !important; visibility: visible !important; position: relative !important; }
      
      .print-table { width: 100%; border-collapse: collapse; font-size: 14px; margin-bottom: 8px; }
      .print-table th, .print-table td { border: 1px solid #d1d5db !important; padding: 12px 16px !important; color: black !important; }
      .print-table th { background-color: #f9fafb !important; width: 30%; font-weight: bold; color: #4b5563 !important; text-align: left; }
      .break-inside-avoid { page-break-inside: avoid; break-inside: avoid; }
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }

      html, body, #root, .fixed.inset-0, .bg-slate-50, .bg-gray-50, div[class*="bg-slate-900"] {
        background-color: #ffffff !important;
        background: none !important;
      }
    }
    
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    let mockDb = { cctv: [], inventory: [], repairs: [], claims: [], borrows: [], installations: [], users: [], pendingUsers: [], notifications: [] };
    const deviceCategories = ['กล้อง', 'เครื่องบันทึกและจัดเก็บ', 'สายสัญญาณและตัวแปลง', 'ระบบจ่ายไฟ', 'อุปกรณ์เครือข่ายและการแสดงผล', 'อุปกรณ์ติดตั้งและป้องกัน'];

    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { hasError: false, error: null }; }
      static getDerivedStateFromError(error) { return { hasError: true, error }; }
      componentDidCatch(error, errorInfo) { console.error("App Crash Avoided:", error, errorInfo); }
      render() {
        if (this.state.hasError) {
          return (
            <div className="flex flex-col items-center justify-center h-[100dvh] bg-slate-100 p-4 text-center fade-in">
              <div className="bg-white p-8 md:p-10 rounded-3xl shadow-xl max-w-lg border border-red-100">
                <i className="fa-solid fa-triangle-exclamation text-6xl md:text-7xl text-red-500 mb-6 drop-shadow-md"></i>
                <h1 className="text-xl md:text-2xl font-black text-gray-800 mb-3">ระบบทำงานผิดพลาดชั่วคราว</h1>
                <p className="text-sm md:text-base text-gray-500 mb-6 bg-red-50 p-4 rounded-xl border border-red-100 break-words font-mono text-left max-h-40 overflow-auto">{this.state.error?.message || 'Unknown Error'}</p>
                <button onClick={() => window.location.reload()} className="px-6 py-3.5 w-full bg-indigo-600 text-white rounded-xl font-bold shadow-md hover:bg-indigo-700 transition touch-friendly"><i className="fa-solid fa-rotate-right mr-2"></i> โหลดหน้าเว็บใหม่</button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // ==========================================
    // 2. UTILITY FUNCTIONS (TURBO SPEED UPLOADS & UNIVERSAL PRINT)
    // ==========================================
    // ฟังก์ชันสั่งปริ้นในหน้าเดิมโดยตรง ไม่ต้องเปิดแท็บใหม่ให้รำคาญตา
    const universalPrint = (elementId, docTitle) => {
        const el = document.getElementById(elementId);
        if (!el) {
            alert('ไม่พบข้อมูลเอกสารสำหรับปริ้น');
            return;
        }

        const originalTitle = document.title;
        document.title = docTitle; // เปลี่ยนชื่อไฟล์เวลาเซฟเป็น PDF

        // เติม Class เพื่อสั่งให้ CSS ซ่อนแอปหลัก และโชว์แค่รายงาน
        document.body.classList.add('printing-report');
        
        // หน่วงเวลาให้เบราว์เซอร์จัดหน้า CSS นิดนึง แล้วเรียกหน้าต่าง Print ทันที
        setTimeout(() => {
            try { window.print(); } catch(e) { console.error(e); }
            // หลังจากหน้าต่างปริ้นปิดลง ให้คืนค่าหน้าเว็บกลับมาเป็นปกติ
            setTimeout(() => {
                document.body.classList.remove('printing-report');
                document.title = originalTitle;
            }, 500);
        }, 300);
    };
    
    // ฟังก์ชันทะลวงบล็อก iOS Safari สำหรับ Export Excel
    const universalExcelExport = (exportData, filename) => {
        try {
            if (typeof XLSX === 'undefined') { alert('ระบบกำลังโหลดไลบรารี กรุณารอสักครู่'); return; }
            const ws = XLSX.utils.json_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Sheet1");
            
            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            
            if (isMobile) {
                // สร้าง Base64 ของไฟล์ Excel
                const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'base64' });
                const uri = 'data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64,' + wbout;
                
                // เปิดแท็บใหม่เพื่อส่งไฟล์โหลดเข้าแอปพลิเคชัน (เช่น Numbers หรือ Excel)
                const newWin = window.open('', '_blank');
                if (newWin) {
                    newWin.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>ดาวน์โหลด Excel</title></head><body style="display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;font-family:sans-serif;text-align:center;">');
                    newWin.document.write('<h2 style="color:#4F46E5;margin-bottom:10px;">ระบบกำลังเตรียมไฟล์ Excel...</h2>');
                    newWin.document.write('<p style="color:#6B7280;">หากเบราว์เซอร์ไม่เปิด/ดาวน์โหลดอัตโนมัติ กรุณากดปุ่มด้านล่างนี้</p>');
                    newWin.document.write('<a href="' + uri + '" download="' + filename + '" style="margin-top:20px;padding:12px 24px;background:#10B981;color:white;text-decoration:none;border-radius:8px;font-weight:bold;font-size:16px;">กดดาวน์โหลดไฟล์ / เปิดเอกสาร</a>');
                    newWin.document.write('<script>setTimeout(function(){ window.location.href = "' + uri + '"; }, 600);<\/script>');
                    newWin.document.write('</body></html>');
                    newWin.document.close();
                } else {
                    // หาก Pop-up โดนบล็อก ให้เปลี่ยนหน้าเว็บนี้เลย
                    window.location.href = uri;
                }
            } else {
                // สำหรับคอมพิวเตอร์ ทำการดาวน์โหลดแบบปกติ
                const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
                const blob = new Blob([wbout], { type: 'application/octet-stream' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            }
        } catch (err) { 
           alert('การสร้างไฟล์ Excel ล้มเหลว: ' + err.message);
        }
    };

    // ระบบรีดขนาดไฟล์ขั้นสูง (Turbo Compress)
    const toBase64 = (file) => new Promise((resolve, reject) => {
      if (!file) return reject(new Error("No file provided"));
      if (typeof file === 'string') return resolve(file);

      // รองรับไฟล์เอกสาร (จำกัด 5MB)
      if (!file.type.startsWith('image/')) {
        if(file.size > 5 * 1024 * 1024) return reject(new Error(`ไฟล์ ${file.name} มีขนาดใหญ่เกิน 5MB`));
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
        return;
      }

      const img = new Image();
      const objectUrl = URL.createObjectURL(file);
      
      img.onload = () => {
        URL.revokeObjectURL(objectUrl); 
        const canvas = document.createElement('canvas');
        
        // ลดความกว้างภาพเหลือ 720px และบีบ Quality เหลือ 40% (ไฟล์จะเล็กลง 90% แต่ภาพยังดูรู้เรื่อง)
        const MAX_DIM = 720; 
        let w = img.width, h = img.height;
        if (w > h) { if (w > MAX_DIM) { h *= MAX_DIM / w; w = MAX_DIM; } }
        else { if (h > MAX_DIM) { w *= MAX_DIM / h; h = MAX_DIM; } }
        
        canvas.width = w; 
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        
        resolve(canvas.toDataURL('image/jpeg', 0.4)); 
      };
      img.onerror = () => reject(new Error("โหลดรูปภาพล้มเหลว"));
      img.src = objectUrl;
    });

    const parseFilesInfo = (fileStr) => {
      if (!fileStr || fileStr === "[]" || fileStr === "" || fileStr === "null") return { images: [], docs: [] };
      try {
        let arr = [];
        if (typeof fileStr === 'string') {
          let trimmed = fileStr.trim();
          if(trimmed.startsWith('"') && trimmed.endsWith('"')) { try { trimmed = JSON.parse(trimmed); } catch(e){} }
          if (trimmed.startsWith('[') || trimmed.startsWith('{')) arr = JSON.parse(trimmed);
          else arr = [trimmed];
        } else if (Array.isArray(fileStr)) { arr = fileStr; } else arr = [fileStr];

        const validArr = Array.isArray(arr) ? arr : [arr];
        return {
          images: validArr.filter(url => typeof url === 'string' && (url.startsWith('data:image') || url.match(/\.(jpg|jpeg|png|gif|webp)/i) || url.includes('uc?id=') || url.includes('thumbnail'))),
          docs: validArr.filter(url => typeof url === 'string' && !(url.startsWith('data:image') || url.match(/\.(jpg|jpeg|png|gif|webp)/i) || url.includes('uc?id=') || url.includes('thumbnail')))
        };
      } catch (e) {
        if (typeof fileStr === 'string' && (fileStr.startsWith('data:image') || fileStr.match(/\.(jpg|jpeg|png|gif|webp)/i))) return { images: [fileStr], docs: [] };
        return { images: [], docs: [] };
      }
    };

    const generateFrontendId = (prefix) => `${prefix}-${Date.now()}-${Math.random().toString(36).substr(2,4).toUpperCase()}`;
    const getFileIcon = (url) => { if(typeof url !== 'string') return 'fa-file text-gray-500'; if(url.includes('pdf')) return 'fa-file-pdf text-red-500'; if(url.includes('doc') || url.includes('word')) return 'fa-file-word text-blue-600'; if(url.includes('xls') || url.includes('sheet') || url.includes('spreadsheetml')) return 'fa-file-excel text-green-600'; return 'fa-file text-gray-500'; };
    const getSafeText = (val) => { if (!val) return '-'; if (typeof val === 'string') { if (val.startsWith('data:') || val.startsWith('[{') || val.startsWith('["')) { return <span className="text-indigo-500 bg-indigo-50 px-2 py-1 rounded-md text-[10px] md:text-xs font-bold shadow-sm whitespace-nowrap inline-flex items-center"><i className="fa-solid fa-paperclip mr-1"></i> มีไฟล์แนบ</span>; } } return val; };

    // ==========================================
    // 3. CORE UI COMPONENTS
    // ==========================================
    const statusConfig = {
      'Inv_Available': { bg: 'bg-green-100', text: 'text-green-700', label: 'พร้อมใช้งาน', type: 'inventory' },
      'Inv_Pending': { bg: 'bg-yellow-100', text: 'text-yellow-700', label: 'รอดำเนินการ', type: 'inventory' },
      'Inv_Broken': { bg: 'bg-red-100', text: 'text-red-700', label: 'มีปัญหา', type: 'inventory' },
      'Rep_Pending': { bg: 'bg-yellow-100', text: 'text-yellow-700', label: 'รอดำเนินการ', type: 'repairs' },
      'Rep_Purchasing': { bg: 'bg-orange-100', text: 'text-orange-700', label: 'กำลังจัดซื้ออุปกรณ์', type: 'repairs' },
      'Rep_Completed': { bg: 'bg-emerald-100', text: 'text-emerald-700', label: 'ซ่อมสำเร็จ', type: 'repairs' },
      'Clm_Pending': { bg: 'bg-yellow-100', text: 'text-yellow-700', label: 'รอดำเนินการ', type: 'claims' },
      'Clm_Reviewing': { bg: 'bg-blue-100', text: 'text-blue-700', label: 'รอพิจารณา', type: 'claims' },
      'Clm_Approved': { bg: 'bg-emerald-100', text: 'text-emerald-700', label: 'อนุมัติ', type: 'claims' },
      'Clm_Rejected': { bg: 'bg-red-100', text: 'text-red-700', label: 'ไม่อนุมัติ', type: 'claims' },
      'Brw_Pending': { bg: 'bg-yellow-100', text: 'text-yellow-700', label: 'รอดำเนินการ', type: 'borrows' },
      'Brw_Reviewing': { bg: 'bg-blue-100', text: 'text-blue-700', label: 'พิจารณา', type: 'borrows' },
      'Brw_Borrowed': { bg: 'bg-indigo-100', text: 'text-indigo-700', label: 'ยืม', type: 'borrows' },
      'Brw_Returned': { bg: 'bg-emerald-100', text: 'text-emerald-700', label: 'คืน', type: 'borrows' },
      'Inst_Pending': { bg: 'bg-yellow-100', text: 'text-yellow-700', label: 'รอดำเนินการ', type: 'installations' },
      'Inst_InProgress': { bg: 'bg-blue-100', text: 'text-blue-700', label: 'กำลังติดตั้ง', type: 'installations' },
      'Inst_Completed': { bg: 'bg-emerald-100', text: 'text-emerald-700', label: 'ติดตั้งสำเร็จ', type: 'installations' },
      'normal': { bg: 'bg-green-100', text: 'text-green-700', label: 'ปกติ', type: 'cctv' },
      'abnormal': { bg: 'bg-red-100', text: 'text-red-700', label: 'ขัดข้อง', type: 'cctv' },
      'stream': { bg: 'bg-blue-100', text: 'text-blue-700', label: 'STREAMING', type: 'cctv' },
      'external': { bg: 'bg-yellow-100', text: 'text-yellow-700', label: 'ภายนอก', type: 'cctv' },
      'active': { bg: 'bg-green-100', text: 'text-green-700', label: 'ใช้งานปกติ', type: 'users' },
      'pending': { bg: 'bg-yellow-100', text: 'text-yellow-700', label: 'รอพิจารณา', type: 'users' }
    };

    const StatusBadge = ({ status }) => {
      if(typeof status === 'string' && status.length > 50) return <span className="text-gray-500">-</span>;
      const conf = statusConfig[status] || { bg: 'bg-gray-100', text: 'text-gray-600', label: status };
      return <span className={`px-3 py-1 rounded-full text-[10px] md:text-xs font-bold border border-transparent ${conf.bg} ${conf.text} whitespace-nowrap inline-block shadow-sm`}>{conf.label}</span>;
    };

    const ProcessingOverlay = () => (
      <div className="absolute inset-0 bg-white/80 backdrop-blur-sm z-[9999] flex flex-col items-center justify-center rounded-3xl print-hide">
        <div className="w-16 h-16 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin mb-4 shadow-lg"></div>
        <p className="font-bold text-indigo-800 text-lg">กำลังประมวลผล...</p>
      </div>
    );

    const SystemPopup = ({ type, message, onClose }) => (
      <div className="fixed inset-0 bg-slate-900/60 z-[9999] flex items-center justify-center p-4 fade-in backdrop-blur-sm print-hide">
        <div className="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl transform scale-100 animate-[fadeIn_0.1s_ease-out]">
          <div className={`w-20 h-20 mx-auto rounded-full flex items-center justify-center mb-5 shadow-inner ${type === 'success' ? 'bg-green-100 text-green-500' : 'bg-red-100 text-red-500'}`}>
            <i className={`fa-solid ${type === 'success' ? 'fa-check text-4xl' : 'fa-times text-4xl'}`}></i>
          </div>
          <h3 className={`text-2xl font-black mb-2 ${type === 'success' ? 'text-green-600' : 'text-red-600'}`}>{type === 'success' ? 'สำเร็จ!' : 'ข้อผิดพลาด'}</h3>
          <p className="text-gray-600 mb-8 font-medium whitespace-pre-wrap break-words">{message}</p>
          <button onClick={onClose} className={`w-full py-3.5 rounded-xl font-bold text-white shadow-md transition touch-friendly active:scale-95 ${type === 'success' ? 'bg-green-500 hover:bg-green-600' : 'bg-red-500 hover:bg-red-600'}`}>ตกลง</button>
        </div>
      </div>
    );

    const ConfirmDialog = ({ message, onConfirm, onCancel }) => (
      <div className="fixed inset-0 bg-slate-900/60 z-[9999] flex items-center justify-center p-4 fade-in backdrop-blur-sm print-hide">
        <div className="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl">
          <div className="w-20 h-20 mx-auto rounded-full bg-yellow-100 text-yellow-500 flex items-center justify-center mb-5 shadow-inner"><i className="fa-solid fa-question text-4xl"></i></div>
          <h3 className="text-xl font-black text-gray-800 mb-2">ยืนยันการดำเนินการ</h3>
          <p className="text-gray-600 mb-8 font-medium whitespace-pre-wrap break-words">{message}</p>
          <div className="flex gap-3">

    const AdvancedFileUploader = ({ label, accept, multiple, maxFiles = 50, onChange, disabled=false, showPopup }) => {
      const [files, setFiles] = useState([]); const [uploading, setUploading] = useState(false); const [progress, setProgress] = useState(0); const fileInputRef = useRef(null);
      
      const handleFiles = async (newFiles) => {
        if(disabled) return; const validFiles = [];
        for (let i = 0; i < newFiles.length; i++) { 
          const f = newFiles[i]; 
          // ปรับเป็น 5MB (ภาพจะถูกบีบอัดอัตโนมัติอยู่แล้ว แต่กันเอกสารใหญ่เกิน)
          if (f.size > 10 * 1024 * 1024) { 
            if(showPopup) showPopup('error', `ไฟล์ ${f.name} มีขนาดใหญ่เกิน 10MB (เพื่อความรวดเร็วในการบันทึก)`); 
            continue; 
          } 
          validFiles.push(f); 
        }
        const totalFiles = [...files, ...validFiles].slice(0, maxFiles);
        
        setUploading(true); setProgress(30); 
        setFiles(totalFiles); 
        setProgress(100);
        setTimeout(() => { setUploading(false); setProgress(0); }, 100);
        onChange(totalFiles);
      };

      const removeFile = (idx) => { if(disabled) return; const newFiles = files.filter((_, i) => i !== idx); setFiles(newFiles); onChange(newFiles); };
      return (
        <div className="w-full">
          <label className="block text-xs font-bold mb-2 text-gray-600">{label} (สูงสุด {maxFiles} ไฟล์, <span className="text-indigo-500">รองรับไฟล์ละ 50MB</span>)</label>

            <i className="fa-solid fa-cloud-arrow-up text-4xl text-indigo-300 mb-3"></i>
            <p className="text-sm font-bold text-indigo-900">คลิกหรือลากไฟล์มาวางที่นี่</p>
            <p className="text-xs text-gray-400 mt-1">รองรับ: {accept}</p>
            <input type="file" ref={fileInputRef} className="hidden" accept={accept} multiple={multiple} onChange={(e) => handleFiles(e.target.files)} disabled={disabled} />
          </div>
          {uploading && ( <div className="w-full bg-indigo-100 rounded-full h-2 mt-3 overflow-hidden"><div className="bg-indigo-600 h-2 rounded-full transition-all duration-200" style={{ width: `${progress}%` }}></div></div> )}
          {files.length > 0 && ( <div className="mt-3 space-y-2 max-h-40 overflow-y-auto custom-scrollbar pr-1">{files.map((file, idx) => ( <div key={idx} className="flex items-center justify-between bg-white border border-gray-200 p-2.5 rounded-xl text-sm shadow-sm"><div className="flex items-center gap-3 overflow-hidden"><i className={`fa-solid ${file.type.includes('image') ? 'fa-file-image text-blue-500' : 'fa-file text-gray-500'} text-lg shrink-0`}></i><span className="truncate font-medium text-gray-700">{file.name}</span></div><button type="button" onClick={(e) => { e.stopPropagation(); removeFile(idx); }} className="text-red-400 hover:text-white bg-red-50 hover:bg-red-500 w-8 h-8 rounded-lg flex items-center justify-center transition touch-friendly"><i className="fa-solid fa-trash-can"></i></button></div> ))}</div> )}

        return [
          ...(db.repairs || []).map(t => ({...t, _type: 'repairs', _label: 'แจ้งซ่อม', _detail: t.problem})).filter(t => t.username === uName || t.customerName === fullName),
          ...(db.installations || []).map(t => ({...t, _type: 'installations', _label: 'งานติดตั้ง', _detail: t.project})).filter(t => t.username === uName || t.customerName === fullName),
          ...(db.claims || []).map(t => ({...t, _type: 'claims', _label: 'เคลม', _detail: t.itemName})).filter(t => t.username === uName || t.customerName === fullName),
          ...(db.borrows || []).map(t => ({...t, _type: 'borrows', _label: 'ยืมคืน', _detail: t.borrowName})).filter(t => t.username === uName || t.borrowerName === fullName || t.adminName === fullName)
        ].sort((a,b) => new Date(b.date || b.borrowDate || b.createdAt || 0).getTime() - new Date(a.date || a.borrowDate || a.createdAt || 0).getTime());
      }, [db, user.username, user.name, role]);

      const handleAction = (action) => {
        setSubmitting(true);
        const payload = { ...user, role, permissions: perms, status: action === 'approve' ? 'active' : user.status };
        
        if (typeof google !== 'undefined' && google.script?.run?.updateUser) {
          google.script.run.withSuccessHandler(() => {
            onSync(payload, isPending ? 'pendingUsers' : 'users', action === 'approve' ? 'approve_user' : 'update');
            showPopup('success', action === 'approve' ? 'อนุมัติผู้ใช้สำเร็จ' : 'บันทึกข้อมูลสำเร็จ');
            onClose();
          }).withFailureHandler((err) => {
            setSubmitting(false);
            showPopup('error', err.message);
          }).updateUser(payload);
        } else {
          setTimeout(() => {
            onSync(payload, isPending ? 'pendingUsers' : 'users', action === 'approve' ? 'approve_user' : 'update');
            showPopup('success', 'บันทึกสำเร็จ (Mock Mode)');
            onClose();
          }, 50);
        }
      };

      return (
        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[3000] flex items-center justify-center p-4 md:p-6 fade-in">
          {/* จัดให้อยู่กึ่งกลางหน้าจอเสมอ และจำกัดความสูงไม่ให้ชนขอบ */}
          <div className="bg-white rounded-3xl w-full max-w-md overflow-hidden shadow-2xl relative flex flex-col max-h-[85vh] md:max-h-[90vh]">
            {submitting && <ProcessingOverlay />}
            
            {/* Header */}
            <div className={`p-5 md:p-6 text-white flex justify-between items-center shrink-0 ${isPending ? 'bg-yellow-500' : 'bg-indigo-600'}`}>
              <h3 className="font-bold text-lg"><i className={`fa-solid ${isPending ? 'fa-user-clock' : 'fa-user-shield'} mr-2`}></i>{isPending ? 'พิจารณาอนุมัติผู้ใช้' : 'จัดการสิทธิ์ผู้ใช้'}</h3>
              <button onClick={onClose} disabled={submitting} className="hover:text-white/70 touch-friendly"><i className="fa-solid fa-times text-xl"></i></button>
            </div>
            
            {/* Content (ส่วนนี้จะเลื่อนได้เมื่อข้อมูลยาวเกินจอ) */}
            <div className="p-5 md:p-6 space-y-5 overflow-y-auto custom-scrollbar flex-1">
              <div className="bg-gray-50 p-4 rounded-2xl border border-gray-100 flex items-center gap-4">
                <div className="w-12 h-12 bg-gray-200 rounded-full flex items-center justify-center text-gray-500 text-xl shrink-0"><i className="fa-solid fa-user"></i></div>
                <div className="overflow-hidden"><h4 className="font-black text-gray-800 text-lg truncate">{user.name}</h4><p className="text-sm text-gray-500 font-mono truncate">@{user.username}</p></div>
              </div>

              <div>
                <label className="text-xs font-bold text-gray-600 block mb-2">ระดับสิทธิ์ (Role)</label>
                <select value={role} onChange={e => {setRole(e.target.value); setPerms([]);}} className="w-full border border-gray-300 p-3 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                  <option value="user">User (ผู้ใช้งานทั่วไป / ลูกค้า)</option>
                  <option value="employee">Employee (พนักงาน / ช่าง)</option>
                  <option value="admin">Admin (ผู้ดูแลระบบ)</option>
                  {window.currentUserRole === 'superadmin' && <option value="superadmin">Super Admin</option>}
                </select>
              </div>

              {role === 'user' && (
                <div className="space-y-4">
                  <div className="pt-2 border-t border-gray-100">
                    <label className="text-xs font-bold text-gray-600 block mb-3">สิทธิ์การเข้าถึงเมนูย่อย (สำหรับ User)</label>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                      {[{id:'repairs', label:'ระบบแจ้งซ่อม'}, {id:'claims', label:'เคลมสินค้า'}, {id:'borrows', label:'ยืม-คืนอุปกรณ์'}, {id:'installations', label:'งานติดตั้ง'}, {id:'inventory', label:'จัดการคลัง'}].map(item => (
                        <label key={item.id} className="flex items-center gap-3 p-2 bg-gray-50 border border-gray-200 rounded-xl cursor-pointer hover:bg-gray-100 transition active:scale-95 touch-friendly">
                          <input type="checkbox" checked={perms.includes(item.id)} onChange={() => togglePerm(item.id)} className="w-4 h-4 accent-indigo-600" />
                          <span className="text-sm font-medium text-gray-700">{item.label}</span>
                        </label>
                      ))}
                    </div>
                  </div>

                  {/* ส่วนแสดงประวัติงานของ User */}
                  <div className="pt-2 border-t border-gray-100">
                    <label className="text-xs font-bold text-gray-600 block mb-2"><i className="fa-solid fa-clock-rotate-left text-indigo-500 mr-1"></i> ประวัติการทำรายการของ User ({userHistoryTasks.length})</label>
                    <div className="space-y-2">
                      {userHistoryTasks.length === 0 ? (
                        <p className="text-xs text-gray-400 text-center py-4 bg-gray-50 rounded-xl border border-dashed border-gray-200">ยังไม่มีประวัติการทำรายการ</p>
                      ) : (
                        userHistoryTasks.map((t, idx) => (
                          <div key={idx} onClick={() => onOpenTask && onOpenTask(t, t._type)} className="bg-white border border-gray-200 p-2.5 rounded-xl flex items-center justify-between cursor-pointer hover:bg-indigo-50 hover:border-indigo-200 transition shadow-sm touch-friendly active:scale-95">
                            <div className="min-w-0 flex-1">
                              <div className="flex items-center gap-2 mb-1">
                                <span className="text-[10px] font-black bg-gray-100 px-1.5 py-0.5 rounded border text-gray-600 shadow-sm">{t._label}</span>
                                <span className="text-xs font-bold text-gray-800 truncate">{t.id}</span>
                              </div>
                              <p className="text-[11px] text-gray-500 truncate">{getSafeText(t._detail)}</p>
                            </div>
                            <div className="shrink-0 ml-2"><StatusBadge status={t.status} /></div>
                          </div>
                        ))
                      )}
                    </div>
                  </div>
                </div>
              )}
              
              {role !== 'user' && (
                 <div className="space-y-4">
                   <p className="text-xs text-indigo-600 bg-indigo-50 p-3 rounded-xl font-medium border border-indigo-100"><i className="fa-solid fa-circle-info mr-1"></i> ผู้ใช้ระดับ Employee ขึ้นไปจะสามารถเข้าถึงได้ทุกเมนูโดยอัตโนมัติ</p>
                   {role === 'employee' && (
                      <div className="pt-2 border-t border-gray-100">
                        <label className="text-xs font-bold text-gray-600 block mb-2"><i className="fa-solid fa-list-check text-indigo-500 mr-1"></i> งานที่รับผิดชอบ ({assignedTasks.length})</label>
                        <div className="space-y-2">
                          {assignedTasks.length === 0 ? (
                            <p className="text-xs text-gray-400 text-center py-4 bg-gray-50 rounded-xl border border-dashed border-gray-200">ยังไม่มีงานที่รับผิดชอบ</p>
                          ) : (
                            assignedTasks.map((t, idx) => (
                              <div key={idx} onClick={() => onOpenTask && onOpenTask(t, t._type)} className="bg-white border border-gray-200 p-2.5 rounded-xl flex items-center justify-between cursor-pointer hover:bg-indigo-50 hover:border-indigo-200 transition shadow-sm touch-friendly active:scale-95">
                                <div className="min-w-0 flex-1">
                                  <div className="flex items-center gap-2 mb-1">
                                    <span className="text-[10px] font-black bg-gray-100 px-1.5 py-0.5 rounded border text-gray-600 shadow-sm">{t._label}</span>
                                    <span className="text-xs font-bold text-gray-800 truncate">{t.id}</span>
                                  </div>
                                  <p className="text-[11px] text-gray-500 truncate">{getSafeText(t._detail)}</p>
                                </div>
                                <div className="shrink-0 ml-2"><StatusBadge status={t.status} /></div>
                              </div>
                            ))
                          )}
                        </div>
                      </div>
                   )}
                 </div>
              )}
            </div>

            {/* Footer */}
            <div className="p-4 md:p-5 bg-gray-50 border-t flex justify-end gap-3 shrink-0">
              <button onClick={onClose} disabled={submitting} className="px-5 py-2.5 bg-white border rounded-xl font-bold text-gray-600 shadow-sm hover:bg-gray-100 touch-friendly">ยกเลิก</button>
              {isPending ? (
                <button onClick={() => handleAction('approve')} disabled={submitting || (role==='user' && perms.length===0)} className="px-6 py-2.5 bg-green-600 text-white rounded-xl font-bold shadow-md hover:bg-green-700 disabled:opacity-50 disabled:cursor-not-allowed touch-friendly active:scale-95">
                  อนุมัติการใช้งาน
                </button>
              ) : (
                <button onClick={() => handleAction('update')} disabled={submitting || (role==='user' && perms.length===0)} className="px-6 py-2.5 bg-indigo-600 text-white rounded-xl font-bold shadow-md hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed touch-friendly active:scale-95">
                  บันทึกการแก้ไข
                </button>
              )}
            </div>
          </div>
        </div>
      );
    };

    const UserManagement = ({ db, onAddUser, onSync, refreshData, showPopup, showConfirm, onOpenTask }) => {
      const [managingUser, setManagingUser] = useState(null);
      const [isPendingMode, setIsPendingMode] = useState(false);
      const [isRefreshing, setIsRefreshing] = useState(false);
      const [searchTerm, setSearchTerm] = useState('');
      const [roleFilter, setRoleFilter] = useState('all');
      const [selectedUsers, setSelectedUsers] = useState([]);

      const handleManualRefresh = () => { setIsRefreshing(true); if (refreshData) { refreshData(); setTimeout(() => setIsRefreshing(false), 500); } else setIsRefreshing(false); };
      
      const handleRejectPending = (username) => {
         showConfirm(`ปฏิเสธคำขอจาก ${username}?`, () => {
             if(onSync) onSync([username], 'pendingUsers', 'delete');
             if (typeof google !== 'undefined' && google.script?.run?.deleteItems) { try { google.script.run.deleteItems('pendingUsers', [username]); } catch(e){} }
             showPopup('success', 'ปฏิเสธคำขอสำเร็จ');
         });
      };
      
      const handleDeleteUser = (username) => { 
        showConfirm(`ยืนยันการลบผู้ใช้งาน: ${username} ถาวรใช่หรือไม่?`, () => { 
          if (onSync) onSync([username], 'users', 'delete'); 
          if (typeof google !== 'undefined' && google.script?.run?.deleteItems) { try { google.script.run.deleteItems('users', [username]); } catch(e){} }
          showPopup('success', 'ลบผู้ใช้งานสำเร็จ'); 
        }); 
      };

      const handleBulkDelete = () => {
         if (selectedUsers.length === 0) return;
         showConfirm(`ยืนยันการลบผู้ใช้งาน ${selectedUsers.length} รายการ ถาวรใช่หรือไม่?`, () => {
            if (onSync) onSync(selectedUsers, 'users', 'delete');
            if (typeof google !== 'undefined' && google.script?.run?.deleteItems) { try { google.script.run.deleteItems('users', selectedUsers); } catch(e){} }
            setSelectedUsers([]);
            showPopup('success', 'ลบผู้ใช้งานหลายรายการสำเร็จ');
         });
      };
      
      const filteredUsers = useMemo(() => {
        let result = [...(db.users || [])];
        if (searchTerm) { const lower = searchTerm.toLowerCase(); result = result.filter(u => (u.name && u.name.toLowerCase().includes(lower)) || (u.username && u.username.toLowerCase().includes(lower))); }
        if (roleFilter !== 'all') { result = result.filter(u => u.role === roleFilter); }
        return result.reverse();
      }, [db.users, searchTerm, roleFilter]);

      const handleSelectAll = (e) => setSelectedUsers(e.target.checked ? filteredUsers.map(u => u.username) : []);
      const handleSelect = (username) => setSelectedUsers(prev => prev.includes(username) ? prev.filter(x => x !== username) : [...prev, username]);

      return (
        <div className="space-y-6 fade-in print-hide">
          <div className="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4">
            <div><h2 className="text-2xl md:text-3xl font-black text-gray-800">จัดการสิทธิ์ผู้ใช้งาน</h2><p className="text-gray-500 text-xs md:text-sm mt-1">ตรวจสอบคำขอและจัดการบุคลากรในระบบ</p></div>
            <div className="flex flex-wrap gap-2 w-full sm:w-auto">
              <button onClick={handleManualRefresh} disabled={isRefreshing} className={`flex-1 sm:flex-none justify-center bg-white border text-gray-700 px-4 py-2.5 rounded-xl shadow-sm font-bold text-sm flex items-center transition touch-friendly ${isRefreshing ? 'opacity-50' : 'hover:bg-gray-50'}`}><i className={`fa-solid fa-rotate-right mr-2 ${isRefreshing ? 'animate-spin text-indigo-500' : ''}`}></i>รีเฟรช</button>
              <button onClick={onAddUser} className="flex-1 sm:flex-none justify-center bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl shadow-md font-bold text-sm flex items-center transition touch-friendly active:scale-95"><i className="fa-solid fa-user-plus mr-2"></i> เพิ่มผู้ใช้</button>
            </div>
          </div>

          <div className="bg-yellow-50 border border-yellow-200 rounded-2xl md:rounded-3xl overflow-hidden shadow-sm mb-6">
            <div className="p-4 md:p-5 border-b border-yellow-200"><h3 className="font-bold text-yellow-800"><i className="fa-solid fa-user-clock mr-2"></i> ผู้ใช้งานรออนุมัติ ({db.pendingUsers?.length || 0})</h3>{window.currentUserRole !== 'superadmin' && <p className="text-[10px] text-red-500 mt-1">* สิทธิ์การกดอนุมัติเฉพาะ Super Admin เท่านั้น</p>}</div>
            <div className="overflow-x-auto w-full custom-scrollbar"><table className="w-full text-left whitespace-nowrap"><thead className="text-[11px] text-yellow-700 font-bold uppercase border-b border-yellow-200"><tr><th className="p-4 w-12 text-center">ลำดับ</th><th className="p-4">ชื่อ-สกุล / Username</th><th className="p-4 text-right">จัดการ</th></tr></thead>
            <tbody className="text-sm bg-white divide-y divide-gray-100">
              {db.pendingUsers?.map((u, i) => ( <tr key={i} className="hover:bg-yellow-50/30 transition"><td className="p-4 text-center font-bold text-gray-500">{i + 1}</td><td className="p-4 font-bold text-gray-800">{getSafeText(u.name || 'ไม่มีชื่อ')} <span className="text-[10px] text-gray-500 font-mono font-normal">@{u.username}</span></td><td className="p-4 text-right"><button onClick={()=> {setManagingUser(u); setIsPendingMode(true);}} className="bg-white border hover:border-yellow-500 text-yellow-700 px-3 py-1.5 rounded-lg text-xs font-bold shadow-sm transition mr-2 touch-friendly active:scale-95">พิจารณา</button><button onClick={()=> handleRejectPending(u.username)} className="bg-red-50 hover:bg-red-100 text-red-600 px-3 py-1.5 rounded-lg text-xs font-bold shadow-sm transition touch-friendly active:scale-95">ปฏิเสธ</button></td></tr> ))}
              {(!db.pendingUsers || db.pendingUsers.length === 0) && <tr><td colSpan="3" className="p-8 text-center text-gray-400">ไม่มีผู้ใช้งานรออนุมัติ</td></tr>}
            </tbody></table></div>
          </div>

          <div className="bg-white border border-gray-100 rounded-2xl md:rounded-3xl overflow-hidden shadow-sm flex flex-col">
            <div className="p-4 md:p-5 border-b flex flex-col lg:flex-row lg:items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                 <h3 className="font-bold text-gray-800 flex items-center"><i className="fa-solid fa-users mr-2 text-indigo-500"></i> รายชื่อผู้ใช้ ({filteredUsers.length})</h3>
                 {selectedUsers.length > 0 && (
                    <button onClick={handleBulkDelete} className="bg-red-50 hover:bg-red-100 text-red-600 px-3 py-1.5 rounded-lg text-xs font-bold shadow-sm transition flex items-center border border-red-100 touch-friendly active:scale-95">
                       <i className="fa-solid fa-trash-can mr-1.5"></i> ลบ ({selectedUsers.length})
                    </button>
                 )}
              </div>
              <div className="flex flex-col sm:flex-row flex-wrap gap-3 w-full lg:w-auto">
                <div className="relative group w-full sm:w-auto"><i className="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i><input type="text" placeholder="ค้นหาชื่อ หรือ Username..." className="pl-9 pr-4 py-2 bg-gray-50 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 w-full outline-none" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} /></div>
                <select className="bg-gray-50 border p-2 rounded-xl text-sm focus:outline-none font-medium text-gray-600 w-full sm:w-auto" value={roleFilter} onChange={(e) => setRoleFilter(e.target.value)}><option value="all">สิทธิ์ทั้งหมด</option><option value="admin">Admin</option><option value="employee">Employee (พนักงาน)</option><option value="user">User</option></select>
              </div>
            </div>
            
            <div className="overflow-x-auto w-full overflow-y-auto max-h-[60vh] relative custom-scrollbar">
               <table className="w-full text-left whitespace-nowrap"><thead className="bg-gray-50 text-[11px] text-gray-500 font-bold uppercase border-b sticky top-0 z-10 shadow-sm"><tr>
                  <th className="p-4 w-10 text-center"><input type="checkbox" checked={selectedUsers.length > 0 && selectedUsers.length === filteredUsers.length} onChange={handleSelectAll} className="w-4 h-4 rounded cursor-pointer accent-indigo-600" /></th>
                  <th className="p-4">ชื่อ-นามสกุล / Username</th><th className="p-4">สิทธิ์ / หมวดหมู่</th><th className="p-4 text-center">จัดการ</th>
               </tr></thead>
               <tbody className="text-sm divide-y divide-gray-50">
                  {filteredUsers.map((u, i) => {
                     const permsArray = Array.isArray(u.permissions) ? u.permissions : [];
                     return ( 
                     <tr key={i} onClick={() => {setManagingUser(u); setIsPendingMode(false);}} className="hover:bg-gray-50 transition cursor-pointer">
                        <td className="p-4 text-center" onClick={(e)=>e.stopPropagation()}><input type="checkbox" checked={selectedUsers.includes(u.username)} onChange={() => handleSelect(u.username)} className="w-4 h-4 rounded cursor-pointer accent-indigo-600" /></td>
                        <td className="p-4"><div className="flex flex-col min-w-0"><span className="font-bold text-gray-800 truncate">{getSafeText(u.name || u.fullName || u.username || 'ไม่มีชื่อ')}</span><span className="text-[10px] text-gray-400 truncate font-mono">@{u.username}</span></div></td>
                        <td className="p-4">{u.role === 'admin' || u.role === 'superadmin' ? (<span className="text-[10px] font-black bg-blue-50 text-blue-600 px-2 py-1 rounded uppercase tracking-wider border border-blue-100">{u.role}</span>) : u.role === 'employee' ? (<span className="text-[10px] font-bold bg-teal-50 text-teal-700 px-2 py-1 rounded uppercase border border-teal-100">พนักงาน (Assignee)</span>) : (<span className="text-[10px] font-bold bg-gray-100 text-gray-600 px-2 py-1 rounded uppercase border border-gray-200">{permsArray.join(', ') || 'ไม่มีสิทธิ์'}</span>)}</td>
                        <td className="p-4 text-center"><button onClick={(e) => { e.stopPropagation(); handleDeleteUser(u.username); }} className="relative z-20 bg-red-50 hover:bg-red-100 text-red-600 w-8 h-8 rounded-lg font-bold shadow-sm transition inline-flex items-center justify-center border border-red-100 touch-friendly"><i className="fa-solid fa-trash-can"></i></button></td>
                     </tr> 
                  )})} 
                  {(!filteredUsers || filteredUsers.length === 0) && <tr><td colSpan="4" className="p-8 text-center text-gray-400">ไม่พบรายชื่อผู้ใช้งาน</td></tr>}
               </tbody></table>
            </div>
          </div>
          {managingUser && <ManageUserModal db={db} user={managingUser} isPending={isPendingMode} onClose={()=>setManagingUser(null)} onSync={onSync} showPopup={showPopup} showConfirm={showConfirm} onOpenTask={onOpenTask} />}
        </div>
      );
    };


    // ==========================================
    // 5. DASHBOARDS
    // ==========================================
    const DataDashboard = ({ title, iconClass, colorConfig, data, type, columns, onAdd, onManage, onSync, filterOptions, showPopup, showConfirm, user }) => {
      const [search, setSearch] = useState('');
      const [statusFilter, setStatusFilter] = useState('all');
      const [selected, setSelected] = useState([]);

      const filteredData = useMemo(() => {
        return (data || []).filter(item => {
          const searchStr = Object.values(item).map(v => String(v || '')).join(' ').toLowerCase();
          const matchSearch = searchStr.includes(search.toLowerCase());
          const matchStatus = statusFilter === 'all' || item.status === statusFilter;
          return matchSearch && matchStatus;
        }).reverse();
      }, [data, search, statusFilter]);

      const handleSelectAll = (e) => setSelected(e.target.checked ? filteredData.map(i => i.id) : []);
      const handleSelect = (id) => setSelected(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);

      const handleDelete = () => {
        if(selected.length === 0) return showPopup('error', 'กรุณาเลือกรายการที่ต้องการลบ');
        showConfirm(`ยืนยันการลบ ${selected.length} รายการที่เลือกอย่างถาวร?`, () => {
          const currentSelected = [...selected];
          if (onSync) onSync(currentSelected, type, 'delete');
          setSelected([]);
          if(typeof google !== 'undefined') { try { google.script.run.deleteItems(type, currentSelected); } catch(e){} }
          showPopup('success', 'ลบข้อมูลสำเร็จ');
        });
      };

      const handleExportExcel = () => {
          let exportData = filteredData.map(item => {
              let row = {};

          list.sort((a, b) => {
             if (a.status === 'abnormal' && b.status !== 'abnormal') return -1;
             if (a.status !== 'abnormal' && b.status === 'abnormal') return 1;
             return 0; 
          });
        }
        return list;
      }, [db.cctv, search, statusFilter, sortFilter]);

      const handleExportExcel = () => {
        const exportData = filteredCctv.map(c => ({
           "รหัสกล้อง": c.id, "ชื่อสถานที่ / จุดติดตั้ง": c.name, "Lat": c.lat, "Lng": c.lng, "สถานะระบบ": statusConfig[c.status]?.label || c.status
        }));
        universalExcelExport(exportData, `CCTV_Export_${new Date().getTime()}.xlsx`);
      };

      const handleExportPDF = () => { universalPrint('cctv-export-area', 'CCTV_Dashboard'); };

      return (
        <div className="space-y-6 fade-in print-container">
          <div className="flex flex-col xl:flex-row xl:justify-between xl:items-center gap-4 no-print">
            <div><h2 className="text-2xl md:text-3xl font-black text-gray-800">{title}</h2><p className="text-gray-500 text-xs md:text-sm mt-1">ค้นหา กรอง และจัดการข้อมูลในระบบ</p></div>
            <div className="flex flex-wrap gap-2 w-full xl:w-auto">
              <button onClick={handleExportExcel} className="flex-1 sm:flex-none justify-center bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 px-4 py-2.5 rounded-2xl shadow-sm font-bold text-sm flex items-center transition touch-friendly"><i className="fa-solid fa-file-excel mr-2 text-green-600"></i> <span className="inline">Export Excel</span></button>
              {['admin', 'superadmin'].includes(window.currentUserRole) && ( <button onClick={handleExportPDF} className="flex-1 sm:flex-none justify-center bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 px-4 py-2.5 rounded-2xl shadow-sm font-bold text-sm flex items-center transition touch-friendly"><i className="fa-solid fa-file-pdf mr-2 text-red-500"></i> <span className="inline">Export PDF</span></button> )}
              {onAdd && ( <button onClick={() => onAdd('add_camera')} className={`flex-1 sm:flex-none justify-center bg-blue-600 hover:bg-blue-700 text-white px-5 md:px-6 py-2.5 md:py-3 rounded-2xl shadow-lg font-bold text-sm flex items-center transition w-full md:w-auto touch-friendly active:scale-95`}><i className="fa-solid fa-plus mr-2"></i> สร้างรายการใหม่</button> )}
            </div>
          </div>
          
          <div className="grid grid-cols-2 lg:grid-cols-5 gap-3 md:gap-6 no-print">
            <div className="bg-white p-4 md:p-6 rounded-2xl md:rounded-3xl border shadow-sm"><p className="text-gray-400 text-[10px] md:text-xs font-bold uppercase tracking-wider mb-1 md:mb-2">ทั้งหมด</p><h3 className="text-2xl md:text-4xl font-black text-gray-700">{(db.cctv||[]).length}</h3></div>
            <div className="bg-white p-4 md:p-6 rounded-2xl md:rounded-3xl border shadow-sm border-l-4 border-l-green-500"><p className="text-green-500 text-[10px] md:text-xs font-bold uppercase tracking-wider mb-1 md:mb-2">ปกติ</p><h3 className="text-2xl md:text-4xl font-black text-green-600">{(db.cctv||[]).filter(c=>c.status==='normal').length}</h3></div>
            <div className="bg-white p-4 md:p-6 rounded-2xl md:rounded-3xl border shadow-sm border-l-4 border-l-yellow-500"><p className="text-yellow-500 text-[10px] md:text-xs font-bold uppercase tracking-wider mb-1 md:mb-2 truncate">ภายนอก</p><h3 className="text-2xl md:text-4xl font-black text-yellow-600">{(db.cctv||[]).filter(c=>c.status==='external').length}</h3></div>
            <div className="bg-white p-4 md:p-6 rounded-2xl md:rounded-3xl border shadow-sm border-l-4 border-l-blue-500"><p className="text-blue-500 text-[10px] md:text-xs font-bold uppercase tracking-wider mb-1 md:mb-2 truncate">STREAMING</p><h3 className="text-2xl md:text-4xl font-black text-blue-600">{(db.cctv||[]).filter(c=>c.status==='stream').length}</h3></div>
            <div className="bg-white p-4 md:p-6 rounded-2xl md:rounded-3xl border shadow-sm border-l-4 border-l-red-500"><p className="text-red-500 text-[10px] md:text-xs font-bold uppercase tracking-wider mb-1 md:mb-2">ขัดข้อง</p><h3 className="text-2xl md:text-4xl font-black text-red-600">{(db.cctv||[]).filter(c=>c.status==='abnormal').length}</h3></div>
          </div>
          <div className="bg-white rounded-2xl md:rounded-3xl shadow-sm border border-gray-100 overflow-hidden print-table-area">
            <div className="p-4 md:p-6 border-b border-gray-50 bg-slate-50/50 flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 no-print">
              <h3 className="font-bold text-gray-700 flex items-center text-sm md:text-base w-full lg:w-auto"><i className="fa-solid fa-list-check text-indigo-500 mr-2"></i> รายการกล้องในระบบ</h3>
              <div className="flex flex-col sm:flex-row flex-wrap gap-2 md:gap-3 w-full lg:w-auto">
                <div className="relative w-full sm:w-auto"><i className="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-gray-400 text-sm"></i><input type="text" placeholder="ค้นหาชื่อหรือรหัสกล้อง..." value={search} onChange={e=>setSearch(e.target.value)} className="pl-9 pr-4 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none w-full sm:w-64 bg-white"/></div>
                <div className="flex gap-2 w-full sm:w-auto">
                  <select value={statusFilter} onChange={e=>setStatusFilter(e.target.value)} className="flex-1 sm:flex-none px-3 py-2 border rounded-xl text-xs md:text-sm outline-none font-medium text-gray-600 bg-white">
                    <option value="all">สถานะ: ทั้งหมด</option><option value="normal">ปกติ</option><option value="external">หน่วยงานภายนอก</option><option value="stream">Streaming</option><option value="abnormal">ขัดข้อง</option>
                  </select>
                  <select value={sortFilter} onChange={e=>setSortFilter(e.target.value)} className="flex-1 sm:flex-none px-3 py-2 border rounded-xl text-xs md:text-sm outline-none font-medium text-gray-600 bg-white"><option value="latest">เรียงจาก: ล่าสุด</option><option value="abnormal_first">เรียงจาก: ขัดข้องก่อน</option></select>
                </div>

            <div id="cctv-export-area" className="overflow-x-auto w-full overflow-y-auto max-h-[60vh] relative custom-scrollbar print-table-area">
              <table className="w-full text-left whitespace-nowrap"><thead className="bg-slate-50 text-[11px] text-slate-500 font-black uppercase tracking-widest border-b sticky top-0 z-10 shadow-sm"><tr><th className="px-4 md:px-8 py-4 md:py-5">รหัสกล้อง</th><th className="px-4 md:px-6 py-4 md:py-5">ชื่อสถานที่ / จุดติดตั้ง</th><th className="px-4 md:px-6 py-4 md:py-5 text-center">สถานะระบบ</th></tr></thead>
              <tbody className="text-sm divide-y divide-gray-50">
                {filteredCctv.map((c, i) => (
                  <tr key={i} onClick={()=>onManage(c, 'cctv')} className="hover:bg-slate-50/80 transition cursor-pointer touch-friendly">
                    <td className="px-4 md:px-8 py-3 md:py-4 font-mono font-bold text-indigo-600">{c.id}</td><td className="px-4 md:px-6 py-3 md:py-4 font-bold text-gray-700">{getSafeText(c.name)} <br/><span className="text-[10px] font-normal text-gray-400">{getSafeText(c.lat)}, {getSafeText(c.lng)}</span></td>
                    <td className="px-4 md:px-6 py-3 md:py-4 text-center"><StatusBadge status={c.status} /></td>
                  </tr>
                ))}
                {filteredCctv.length === 0 && <tr><td colSpan="3" className="text-center py-10 text-gray-400 font-medium">ไม่พบข้อมูล</td></tr>}
              </tbody></table>
            </div>
          </div>
        </div>
      );
    };

    const NotificationsView = ({ notifications, user, onNotificationClick, onSync, showPopup }) => {
      const targetLabel = user?.role === 'admin' || user?.role === 'superadmin' ? 'admin' : user?.username;
      const [statusFilter, setStatusFilter] = useState('all');
      const [typeFilter, setTypeFilter] = useState('all'); 
      const [startDate, setStartDate] = useState('');
      const [endDate, setEndDate] = useState('');
      const [isSelectMode, setIsSelectMode] = useState(false);
      const [selectedIds, setSelectedIds] = useState([]);

      const myNotifs = useMemo(() => {
        return (notifications || [])
          .filter(n => n.target === targetLabel)
          .filter(n => statusFilter === 'all' || n.status === statusFilter)
          .filter(n => {
              if (typeFilter === 'all') return true;
              const t = String(n.type || '').toLowerCase();
              if (typeFilter === 'repairs') return t.includes('repair');
              if (typeFilter === 'claims') return t.includes('claim');
              if (typeFilter === 'borrows') return t.includes('borrow');
              if (typeFilter === 'installations') return t.includes('install');
              if (typeFilter === 'inventory') return t.includes('inventory');
              if (typeFilter === 'system') return t.includes('user') || t.includes('system') || t.includes('info') || t.includes('update');
              return true;
          })
          .filter(n => {
              if (!startDate && !endDate) return true;
              const notifDate = new Date(n.createdAt || n.timestamp || 0);
              if (startDate && notifDate < new Date(startDate)) return false;
              if (endDate) { const end = new Date(endDate); end.setHours(23, 59, 59, 999); if (notifDate > end) return false; }
              return true;
          })
          .sort((a,b) => new Date(b.createdAt || b.timestamp || 0).getTime() - new Date(a.createdAt || a.timestamp || 0).getTime());
      }, [notifications, targetLabel, statusFilter, typeFilter, startDate, endDate]);

      const handleSelectAll = (e) => setSelectedIds(e.target.checked ? myNotifs.map(n => n.id) : []);
      const toggleSelect = (id) => setSelectedIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
      
      const handleDeleteSelected = () => {
        if (selectedIds.length === 0) return showPopup("error", "กรุณาเลือกรายการที่ต้องการลบ");
        if (confirm(`ยืนยันการลบการแจ้งเตือน ${selectedIds.length} รายการถาวร?`)) {
            if(onSync) onSync(selectedIds, 'notifications', 'delete');
            if (typeof google !== 'undefined' && google.script?.run?.deleteItems) { 
                google.script.run.deleteItems('notifications', selectedIds); 
            }
            setSelectedIds([]); setIsSelectMode(false);
            showPopup("success", "ลบการแจ้งเตือนสำเร็จ");
        }
      };

      return (
        <div className="space-y-4 md:space-y-6 fade-in print-container">
          <div className="flex flex-col md:flex-row md:justify-between md:items-center gap-4">
            <div><h2 className="text-2xl md:text-3xl font-black text-gray-800">การแจ้งเตือน</h2><p className="text-gray-500 text-xs md:text-sm mt-1">จัดการและตรวจสอบความเคลื่อนไหวของงาน</p></div>
            <div className="flex items-center gap-2">
                {isSelectMode ? (
                  <div className="flex gap-2 w-full md:w-auto"><button onClick={handleDeleteSelected} className="bg-red-50 text-red-600 px-4 py-2.5 rounded-xl text-xs md:text-sm font-bold hover:bg-red-100 transition shadow-sm border border-red-100 touch-friendly"><i className="fa-solid fa-trash-can mr-2"></i>ลบที่เลือก ({selectedIds.length})</button><button onClick={() => { setIsSelectMode(false); setSelectedIds([]); }} className="bg-gray-100 text-gray-600 px-4 py-2.5 rounded-xl text-xs md:text-sm font-bold hover:bg-gray-200 transition shadow-sm touch-friendly">ยกเลิก</button></div>
                ) : (
                  <button onClick={() => setIsSelectMode(true)} className="px-4 py-2 bg-white border border-gray-200 rounded-xl flex items-center justify-center text-sm font-bold text-gray-600 hover:bg-gray-50 transition shadow-sm touch-friendly active:scale-95"><i className="fa-solid fa-check-double mr-2 text-indigo-500"></i> จัดการหลายรายการ</button>
                )}
            </div>
          </div>
          <div className="bg-white p-4 md:p-5 rounded-2xl shadow-sm border border-gray-100 flex flex-col md:flex-row gap-3 md:items-center flex-wrap">
            <div className="flex items-center gap-2 text-sm font-bold text-gray-500 shrink-0"><i className="fa-solid fa-filter text-indigo-400"></i> ตัวกรอง:</div>
            <select value={statusFilter} onChange={e => setStatusFilter(e.target.value)} className="p-2.5 border border-gray-200 rounded-xl text-xs md:text-sm outline-none font-medium text-gray-600 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 transition"><option value="all">สถานะ: ทั้งหมด</option><option value="unread">ยังไม่ได้อ่าน</option><option value="read">เปิดอ่านแล้ว</option></select>
            <select value={typeFilter} onChange={e => setTypeFilter(e.target.value)} className="p-2.5 border border-gray-200 rounded-xl text-xs md:text-sm outline-none font-medium text-gray-600 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 transition"><option value="all">หมวดหมู่: ทั้งหมด</option><option value="repairs">แจ้งซ่อม</option><option value="claims">เคลมสินค้า</option><option value="borrows">ยืม-คืนอุปกรณ์</option><option value="installations">งานติดตั้ง</option><option value="inventory">คลังสินค้า</option><option value="system">ระบบ/อัปเดต</option></select>
            <div className="flex items-center gap-2 flex-1 min-w-[250px]"><input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} className="p-2.5 border border-gray-200 rounded-xl text-xs md:text-sm outline-none text-gray-600 w-full bg-gray-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 transition" title="ตั้งแต่วันที่" /><span className="text-gray-400 font-bold">-</span><input type="date" value={endDate} onChange={e => setEndDate(e.target.value)} className="p-2.5 border border-gray-200 rounded-xl text-xs md:text-sm outline-none text-gray-600 w-full bg-gray-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 transition" title="ถึงวันที่" /></div>
            {(startDate || endDate || statusFilter !== 'all' || typeFilter !== 'all') && ( <button onClick={() => { setStartDate(''); setEndDate(''); setStatusFilter('all'); setTypeFilter('all'); }} className="text-xs font-bold text-indigo-600 hover:underline px-2 py-1 shrink-0 touch-friendly"><i className="fa-solid fa-rotate-left mr-1"></i>ล้างตัวกรอง</button> )}
          </div>
          <div className="bg-white rounded-2xl md:rounded-3xl shadow-sm border border-gray-100 overflow-hidden w-full">
            {isSelectMode && myNotifs.length > 0 && ( <div className="p-4 border-b bg-indigo-50/50 flex items-center gap-3"><input type="checkbox" checked={selectedIds.length === myNotifs.length && myNotifs.length > 0} onChange={handleSelectAll} className="w-5 h-5 cursor-pointer accent-indigo-600 rounded" /><span className="text-sm font-bold text-indigo-900">เลือกทั้งหมด ({myNotifs.length} รายการ)</span></div> )}
            <div className="divide-y divide-gray-50 w-full overflow-y-auto max-h-[60vh] custom-scrollbar">
              {myNotifs.length === 0 && <p className="p-10 text-center text-gray-400 font-medium">ไม่พบการแจ้งเตือน</p>}
              {myNotifs.map(n => (
                <div key={n.id} onClick={() => { if(isSelectMode) toggleSelect(n.id); else if(onNotificationClick) onNotificationClick(n); }} 
                     className={`p-4 md:p-5 transition flex items-start gap-4 cursor-pointer touch-friendly border-l-4 ${n.status === 'unread' ? 'bg-indigo-50/70 border-indigo-500 hover:bg-indigo-100/60' : 'bg-white border-transparent hover:bg-slate-50 opacity-80 hover:opacity-100'}`}>
                    
                    {isSelectMode && ( <div className="flex items-center mt-2 shrink-0"><input type="checkbox" checked={selectedIds.includes(n.id)} readOnly className="w-5 h-5 cursor-pointer accent-indigo-600 pointer-events-none rounded" /></div> )}
                    
                    <div className={`w-10 h-10 md:w-12 md:h-12 rounded-full flex items-center justify-center shrink-0 ${n.status === 'unread' ? 'bg-indigo-600 text-white shadow-md ring-4 ring-indigo-600/20' : 'bg-gray-100 text-gray-400'}`}><i className={`fa-solid ${n.type === 'repair' ? 'fa-wrench' : n.type === 'claim' ? 'fa-shield-halved' : n.type === 'borrow' ? 'fa-handshake' : n.type === 'install' ? 'fa-tools' : 'fa-bell'} ${n.status === 'unread' ? 'animate-bounce' : ''} text-sm md:text-base`}></i></div>
                    
                    <div className="flex-1 min-w-0 pr-4 w-full">
                       <p className={`text-sm md:text-base whitespace-pre-wrap break-words ${n.status === 'unread' ? 'font-black text-indigo-900' : 'font-bold text-gray-600'}`}>
                          {n.status === 'unread' && <span className="text-[10px] bg-red-500 text-white px-2 py-0.5 rounded-full mr-2 uppercase tracking-widest shadow-sm">ใหม่</span>}
                          {getSafeText(n.message)}
                       </p>
                       <p className={`text-[10px] md:text-xs mt-1.5 font-mono flex items-center ${n.status === 'unread' ? 'text-indigo-500 font-bold' : 'text-gray-400'}`}><i className="fa-regular fa-clock mr-1.5"></i>{n.createdAt || n.timestamp ? new Date(n.createdAt || n.timestamp).toLocaleString('th-TH') : '-'}</p>
                    </div>
                    {n.status === 'unread' && !isSelectMode && ( <div className="shrink-0 mt-3 ml-auto"><div className="w-3 h-3 bg-red-500 rounded-full shadow-sm animate-pulse"></div></div> )}
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    };

    const CCTVMap = ({ cctvData }) => {
      const mapRef = useRef(null);
      const mapElementRef = useRef(null); 
      const markersLayerRef = useRef(null);
      const mapMarkersRef = useRef({}); 
      const [search, setSearch] = useState('');
      const [filters, setFilters] = useState({ normal: false, stream: false, external: false, abnormal: false });
      const [searchResults, setSearchResults] = useState([]);
      const [isZoomed, setIsZoomed] = useState(false);
      const [showMobilePanel, setShowMobilePanel] = useState(false);

      useEffect(() => {
        if (!mapRef.current && mapElementRef.current) {
          mapRef.current = L.map(mapElementRef.current, { zoomControl: false }).setView([13.7461, 100.5298], 12);
          L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(mapRef.current);
          L.control.zoom({ position: 'bottomright' }).addTo(mapRef.current);
          markersLayerRef.current = L.layerGroup().addTo(mapRef.current);
        }
        setTimeout(() => { if(mapRef.current) mapRef.current.invalidateSize(); }, 300);
        return () => { if (mapRef.current) { mapRef.current.remove(); mapRef.current = null; } };
      }, []);

      useEffect(() => {
        if (!markersLayerRef.current || !cctvData) return;
        const map = mapRef.current;
        markersLayerRef.current.clearLayers();
        mapMarkersRef.current = {}; 
        const noFilterActive = !Object.values(filters).some(Boolean);

        cctvData.forEach(camera => {
          if (!camera.lat || !camera.lng) return;
          if (!noFilterActive && !filters[camera.status]) return;
          
          let iconClass = '';
          if(camera.status==='normal') iconClass='marker-normal text-white';
          if(camera.status==='stream') iconClass='marker-stream text-white';
          if(camera.status==='abnormal') iconClass='marker-abnormal text-white animate-pulse';
          if(camera.status==='external') iconClass='marker-external text-white';

          const iconHtml = `<div class="cctv-marker ${iconClass} w-10 h-10 shadow-lg border-2 border-white"><i class="fa-solid fa-video"></i></div>`;
          const customIcon = L.divIcon({ className: 'bg-transparent', html: iconHtml, iconSize: [40, 40], iconAnchor: [20, 20] });
          
          let mediaContent = `<div class="bg-gray-200 w-full h-24 md:h-32 flex flex-col items-center justify-center text-gray-400"><i class="fa-regular fa-image fa-2x mb-1"></i><span class="text-xs">ไม่มีภาพ / ไม่มีสตรีม</span></div>`;
          let sUrl = camera.streamUrl || camera.imgUrl; 
          
          if (sUrl && typeof sUrl === 'string' && sUrl.startsWith('[')) {
             try { let parsed = JSON.parse(sUrl); if(parsed.length>0) sUrl = parsed[0]; } catch(e){}
          }
          if (sUrl && typeof sUrl === 'string') { 
             if (sUrl.includes('watch?v=')) sUrl = sUrl.replace('watch?v=', 'embed/').split('&')[0];
             if (sUrl.includes('http') || sUrl.includes('embed')) {
                mediaContent = `<iframe class="w-full h-24 md:h-36 rounded" src="${sUrl}" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
             } else if (sUrl.startsWith('data:image')) {
                mediaContent = `<img src="${sUrl}" class="w-full h-24 md:h-36 object-cover rounded" />`;
             }
          }

          const popupContent = `
            <div class="rounded-xl overflow-hidden shadow-lg bg-white pointer-events-auto">
              ${mediaContent}
              <div class="p-3 md:p-4">
                <p class="font-black text-gray-800 text-base md:text-lg leading-tight mb-1">${getSafeText(camera.name)}</p>
                <span class="text-[10px] font-mono text-gray-500 bg-gray-100 px-2 py-1 rounded">ID: ${camera.id}</span>
                ${camera.assignee ? `<p class="text-xs text-indigo-600 mt-1 font-bold"><i class="fa-solid fa-user-gear"></i> ${camera.assignee}</p>` : ''}
                <div class="mt-3 md:mt-4 flex gap-2">
                  <a href="https://www.google.com/maps?layer=c&cbll=${camera.lat},${camera.lng}" target="_blank" class="flex-1 bg-indigo-50 text-indigo-600 text-center py-2 rounded-lg text-[10px] md:text-xs font-bold hover:bg-indigo-100 pointer-events-auto touch-friendly active:scale-95"><i class="fa-solid fa-street-view"></i> Street View</a>
                  <a href="https://www.google.com/maps/search/?api=1&query=${camera.lat},${camera.lng}" target="_blank" class="flex-1 bg-green-50 text-green-600 text-center py-2 rounded-lg text-[10px] md:text-xs font-bold hover:bg-green-100 pointer-events-auto touch-friendly active:scale-95"><i class="fa-solid fa-map-location-dot"></i> Maps</a>
                </div>
              </div>
            </div>`;
          
          const marker = L.marker([camera.lat, camera.lng], { icon: customIcon });
          marker.bindPopup(popupContent, { maxWidth: 300, minWidth: 260, className: 'custom-popup' });
          marker.addTo(markersLayerRef.current);
          mapMarkersRef.current[camera.id] = marker;
        });

        if (search.trim()) {
          const noFilterActiveForSearch = !Object.values(filters).some(Boolean);
          setSearchResults(cctvData.filter(c => 
             (c.name?.toLowerCase().includes(search.toLowerCase()) || (c.id && c.id.toLowerCase().includes(search.toLowerCase()))) && 
             (noFilterActiveForSearch || filters[c.status])
          ));
        } else {
          setSearchResults([]);
        }
      }, [cctvData, filters, search]);

      const flyToCamera = (cam) => {
        if(mapRef.current && cam.lat && cam.lng) {
          mapRef.current.flyTo([cam.lat, cam.lng], 17, { duration: 1.5 });
          if(mapMarkersRef.current[cam.id]) { mapMarkersRef.current[cam.id].openPopup(); }
          setIsZoomed(true);
          setShowMobilePanel(false); 
        }
      };

      const handleSearchEnter = () => {
        if (isZoomed) {
          if(mapRef.current) { mapRef.current.setView([13.7461, 100.5298], 12, { duration: 1.5 }); mapRef.current.closePopup(); }
          setIsZoomed(false); setSearch(''); setSearchResults([]);
        } else {

      return (

    const ManageItemModal = ({ user, db, item, type, onClose, onSave, showPopup, showConfirm, autoPrint }) => {

      const [isSubmitting, setIsSubmitting] = useState(false); 
      const [isSendingChat, setIsSendingChat] = useState(false);

      const parsedImg = parseFilesInfo(formData.imgUrl); 
      const parsedDoc = parseFilesInfo(formData.attachedFile);

      const [newImages, setNewImages] = useState([]); 
      const [newDocs, setNewDocs] = useState([]);

      const [existingComments, setExistingComments] = useState(() => {
        try { return formData.comments ? (typeof formData.comments === 'string' ? JSON.parse(formData.comments) : formData.comments) : []; } catch(e){ return []; }
      });

      useEffect(() => {
          try {
              if (!item.comments) return;
              const freshComments = typeof item.comments === 'string' ? JSON.parse(item.comments) : item.comments;
              if (freshComments.length > existingComments.length) {
                  setExistingComments(freshComments);
                  setFormData(prev => ({...prev, comments: item.comments}));
              }
          } catch(e) {}
      }, [item.comments]);

      const handleTriggerPrint = () => { 
          universalPrint('print-report-container', `Report_${item.id}`);
      };

      const handleChange = (e) => setFormData({ ...formData, [e.target.name]: e.target.value });
      const handleRemoveExistingImage = (idx) => { setExistingImages(prev => prev.filter((_, i) => i !== idx)); };
      const handleRemoveExistingDoc = (idx) => { setExistingDocs(prev => prev.filter((_, i) => i !== idx)); };

      const handleSaveEdit = async () => {
        if (isSubmitting) return; setIsSubmitting(true);
        try {
          let payload = { ...formData };
          
          // บีบอัดไฟล์แบบ Parallel พร้อมกัน
          const [b64Images, b64Docs] = await Promise.all([
              Promise.all(newImages.map(img => toBase64(img))),
              Promise.all(newDocs.map(doc => toBase64(doc)))
          ]);

          payload.imgUrl = JSON.stringify([...existingImages, ...b64Images]);
          payload.attachedFile = JSON.stringify([...existingDocs, ...b64Docs]);
          
          if (typeof google !== 'undefined' && google.script?.run?.updateItemStatus) {
            google.script.run.withSuccessHandler(()=>{ 
                onSave(payload, type, 'update'); 
                setFormData(payload); 
                setExistingImages([...existingImages, ...b64Images]); 
                setExistingDocs([...existingDocs, ...b64Docs]); 
                setNewImages([]); 
                setNewDocs([]); 
                setIsSubmitting(false); 
                setIsEditMode(false); 
                showPopup('success', 'บันทึกข้อมูลและไฟล์แนบสำเร็จ'); 
            }).withFailureHandler((err)=>{ setIsSubmitting(false); showPopup('error', err.message); }).updateItemStatus({...payload, type: type});
          } else { 
            onSave(payload, type, 'update'); 
            setFormData(payload); 
            setExistingImages([...existingImages, ...b64Images]); 
            setExistingDocs([...existingDocs, ...b64Docs]); 
            setNewImages([]); 
            setNewDocs([]); 
            setIsSubmitting(false); 
            setIsEditMode(false); 
            showPopup('success', 'บันทึกข้อมูลสำเร็จ (Mock)'); 
          }
        } catch(error) { showPopup('error', error.message); setIsSubmitting(false); }
      };

      const handleTakeTask = () => {
         if (isSubmitting) return;
         showConfirm(`คุณต้องการรับผิดชอบงาน ID: ${item.id} ใช่หรือไม่?`, () => {
             setIsSubmitting(true); 
             const payload = { ...formData, assignee: user.username };
             if (typeof google !== 'undefined' && google.script?.run?.updateItemStatus) { 
                google.script.run.withSuccessHandler(()=>{ 
                    onSave(payload, type, 'update'); 
                    setFormData(payload); 
                    setIsSubmitting(false); 
                    showPopup('success', 'คุณรับผิดชอบงานนี้แล้ว'); 
                }).withFailureHandler((err)=>{ setIsSubmitting(false); showPopup('error', err.message); }).updateItemStatus({...payload, type: type}); 
             } else { 
                onSave(payload, type, 'update'); setFormData(payload); setIsSubmitting(false); showPopup('success', 'รับงานสำเร็จ (Mock)');
             }
         });
      };

      const handleSendChat = () => {
        if (!chatMessage.trim() || isSubmitting || isSendingChat) return; 
        setIsSendingChat(true); // ล็อคปุ่มแชท
        
        const newMsg = { senderRole: user.role, senderName: user.name, text: chatMessage.trim(), timestamp: new Date().toISOString() };
        const updatedComments = [...existingComments, newMsg]; 
        const payload = { ...formData, comments: JSON.stringify(updatedComments) };
        
        if (typeof google !== 'undefined' && google.script?.run?.updateItemStatus) { 
            google.script.run
              .withSuccessHandler(() => {
                  setExistingComments(updatedComments);
                  setFormData(payload);
                  setChatMessage(''); 
                  onSave(payload, type, 'update'); 
                  setIsSendingChat(false); // ปลดล็อคปุ่มแชท

              .updateItemStatus({...payload, type: type}); 
        } else {
            setExistingComments(updatedComments); setFormData(payload); setChatMessage(''); 
            onSave(payload, type, 'update'); setIsSendingChat(false);
        }
      };

      const confirmDeleteAction = () => {
        if (isSubmitting) return; setIsSubmitting(true);
        if (typeof google !== 'undefined' && google.script?.run?.deleteItems) { 
            google.script.run.withSuccessHandler(()=>{

                setIsSubmitting(false);

                onClose(); 
            }).withFailureHandler((err)=>{ setIsSubmitting(false); showPopup('error', err.message); }).deleteItems(type, [item.id]); 
        } else { 
            onSave([item.id], type, 'delete'); setIsSubmitting(false); showPopup('success', 'ลบรายการสำเร็จ (Mock)'); onClose();

      const typeStatusMap = { 'installations': ['Inst_Pending', 'Inst_InProgress', 'Inst_Completed'], 'repairs': ['Rep_Pending', 'Rep_Purchasing', 'Rep_Completed'], 'claims': ['Clm_Pending', 'Clm_Reviewing', 'Clm_Approved', 'Clm_Rejected'], 'borrows': ['Brw_Pending', 'Brw_Reviewing', 'Brw_Borrowed', 'Brw_Returned'], 'inventory': ['Inv_Available', 'Inv_Pending', 'Inv_Broken'], 'cctv': ['normal', 'abnormal', 'stream', 'external'] };

          <div className="p-4 rounded-xl mb-6 border border-gray-200 break-inside-avoid">
             <table className="w-full text-sm">
                 <tbody>
                     <tr>
                         <td className="w-1/3 py-2 border-none"><span className="font-bold text-gray-500">รหัสอ้างอิง (ID):</span> <span className="font-black text-gray-900">{item.id}</span></td>
                         <td className="w-1/3 py-2 text-center border-none"><span className="font-bold text-gray-500">วันที่รายการ:</span> <span className="font-black text-gray-900">{formData.date || formData.borrowDate || '-'}</span></td>
                         <td className="w-1/3 py-2 text-right border-none"><span className="font-bold text-gray-500">สถานะปัจจุบัน:</span> <span className="font-black text-indigo-700">{statusConfig[getSafeText(formData.status)]?.label || getSafeText(formData.status)}</span></td>
                     </tr>
                 </tbody>

          {/* Section 1 */}

             <table className="print-table">

        const config = fieldConfig[type] || [];
        const readOnlyFields = ['customerName', 'adminName', 'phone', 'itemName', 'borrowName', 'name', 'project', 'location', 'date', 'time', 'serial', 'category'];
        
        return config.map((f, i) => {

                   <select name={f.name} value={formData[f.name] || ''} onChange={handleChange} disabled={isReadOnlyForThisUser} className={`w-full border border-gray-300 p-2.5 rounded-xl text-sm outline-none transition ${isReadOnlyForThisUser ? 'bg-gray-100 cursor-not-allowed text-gray-500 font-medium' : 'focus:ring-2 focus:ring-indigo-500 bg-white'}`}>
