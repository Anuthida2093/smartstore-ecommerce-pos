                        <div key={item.id} className="flex items-center gap-4 py-4 pt-4 first:pt-0">
                          <img src={parseFilesInfo(item.imgUrl).images[0]} className="w-16 h-16 rounded-xl object-cover border" onError={(e) => { e.target.src = 'https://placehold.co/400x400?text=No+Image'; }} />
                          <div className="flex-1">
                            <p className="font-bold text-sm text-gray-800 line-clamp-1">{item.name}</p>
                            <p className="text-[10px] text-gray-500">สี:{item.color} ไซส์:{item.size}</p>
                            <p className="text-orange-600 font-bold text-sm">{formatMoney(item.price)} x {item.qty}</p>
                          </div>
                          <button onClick={() => removeFromCart(item.id)} className="w-8 h-8 rounded-full bg-red-50 text-red-500 hover:bg-red-100 flex items-center justify-center transition shrink-0"><i className="fa-solid fa-trash-can text-xs"></i></button>
                        </div>
                      ))}
                    </div>
                    <div className="border-t mt-4 pt-4">
                       <div className="flex justify-between text-sm mb-2 text-gray-600"><p>ค่าสินค้า</p><p>{formatMoney(cartTotal)}</p></div>
                       <div className="flex justify-between text-sm mb-4 text-gray-600"><p>ค่าจัดส่ง</p><p>{formatMoney(40)}</p></div>
                       <div className="flex justify-between text-lg font-black text-gray-800"><p>ยอดสุทธิ</p><p className="text-orange-600">{formatMoney(cartTotal + 40)}</p></div>
                    </div>
                    <button onClick={() => setView('checkout')} className="w-full mt-6 py-3.5 bg-gray-900 text-white rounded-2xl font-bold hover:bg-black transition shadow-lg">ดำเนินการชำระเงิน</button>
                  </div>
                )}
              </div>
            )}
            {view === 'checkout' && (
              <div className="fade-in max-w-2xl mx-auto">
                 <button onClick={() => setView('cart')} className="text-gray-400 mb-4 hover:text-gray-800 font-bold text-sm"><i className="fa-solid fa-arrow-left mr-2"></i>กลับไปตะกร้า</button>
                 <CheckoutForm cart={cart} total={cartTotal + 40} onSync={onSync} onComplete={(orderData) => { setCart([]); setCompletedOrder(orderData); setView('success'); }} />
              </div>
            )}
            {view === 'success' && completedOrder && (
              <div className="fade-in max-w-lg mx-auto py-10">
                 <div className="bg-white rounded-3xl shadow-lg border border-gray-100 overflow-hidden">
                     <div className="bg-green-500 p-6 text-center text-white">
                        <div className="w-16 h-16 bg-white text-green-500 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl shadow-md"><i className="fa-solid fa-check"></i></div>
                        <h2 className="text-2xl font-black mb-1">สั่งซื้อสำเร็จ!</h2>
                        <p className="text-green-100 text-sm">ระบบได้รับออเดอร์ของคุณเรียบร้อยแล้ว</p>
                     </div>
                     
                     <div className="p-6">
                        <div className="bg-yellow-50 border border-yellow-200 p-4 rounded-xl text-center mb-6 shadow-sm">
                           <p className="text-yellow-800 font-bold text-sm"><i className="fa-solid fa-camera mr-2"></i>โปรดแคปหน้าจอ หรือ บันทึกรูปบิลนี้ไว้</p>
                           <p className="text-xs text-yellow-600 mt-1">เพื่อใช้เป็นหลักฐานและติดตามสถานะคำสั่งซื้อ</p>
                        </div>

                        <div id="printable-receipt" className="border-2 border-dashed border-gray-200 rounded-2xl p-5 mb-6 relative bg-white">
                           <div className="text-center mb-4 border-b pb-4">
                              <h3 className="font-black text-lg text-gray-800">ใบเสร็จรับเงิน / สลิปสั่งซื้อ</h3>
                              <p className="text-xs text-gray-500 mt-1">Order ID: <span className="font-mono font-bold text-blue-600">{completedOrder.id}</span></p>
                              <p className="text-xs text-gray-500 mt-0.5">วันที่: {completedOrder.date}</p>
                           </div>
                           
                           <div className="space-y-3 mb-4 text-sm">
                              <p><span className="text-gray-500">ชื่อลูกค้า:</span> <span className="font-bold text-gray-800">{completedOrder.customerName}</span></p>
                              <p><span className="text-gray-500">เบอร์โทร:</span> <span className="font-bold text-gray-800">{completedOrder.phone}</span></p>
                              <p><span className="text-gray-500">ที่อยู่จัดส่ง:</span> <span className="font-bold text-gray-800">{completedOrder.address}</span></p>
                           </div>

                           <div className="border-t border-b py-3 my-3 space-y-2">
                              <p className="text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">รายการสินค้า</p>
                              {JSON.parse(completedOrder.items).map((item, idx) => (
                                 <div key={idx} className="flex justify-between text-sm">
                                    <span className="text-gray-700">{item.name} <span className="text-[10px] text-gray-400">({item.color}/{item.size}) x{item.qty}</span></span>
                                    <span className="font-bold text-gray-800">{formatMoney(item.price * item.qty)}</span>
                                 </div>
                              ))}
                           </div>
                           
                           <div className="flex justify-between text-sm text-gray-500 mb-1"><p>ค่าจัดส่ง</p><p>{formatMoney(completedOrder.shippingFee)}</p></div>
                           <div className="flex justify-between text-lg font-black text-gray-800 mt-2"><p>ยอดชำระสุทธิ</p><p className="text-orange-600">{formatMoney(completedOrder.grandTotal)}</p></div>
                        </div>

                        <div className="flex gap-3 no-print">
                           <button onClick={()=>window.print()} className="flex-1 py-3 bg-gray-100 text-gray-700 rounded-xl font-bold hover:bg-gray-200 transition"><i className="fa-solid fa-print mr-2"></i>พิมพ์บิล</button>
                           <button onClick={()=>{setView('home'); setCompletedOrder(null);}} className="flex-1 py-3 bg-orange-500 text-white rounded-xl font-bold hover:bg-orange-600 shadow-md transition">กลับหน้าหลัก</button>
                        </div>
                     </div>
                 </div>
              </div>
            )}
            {view === 'tracking' && (
              <div className="fade-in max-w-md mx-auto bg-white rounded-3xl shadow-sm border p-6 md:p-8 mt-10">
                 <button onClick={() => setView('home')} className="text-gray-400 mb-4 hover:text-gray-800 font-bold text-sm"><i className="fa-solid fa-arrow-left mr-2"></i>ย้อนกลับ</button>
                 <h2 className="text-2xl font-black text-gray-800 mb-6 text-center"><i className="fa-solid fa-box-open text-orange-500 mr-2"></i> ติดตามสถานะพัสดุ</h2>
                 <OrderTracking db={db} />
              </div>
            )}
          </main>
          <div className="md:hidden text-center p-4 border-t bg-white">
            <button onClick={onSwitchToAdmin} className="text-xs font-bold text-gray-400 hover:text-orange-500"><i className="fa-solid fa-user-tie mr-1"></i> ล็อกอินสำหรับพนักงาน/แอดมิน</button>
          </div>
        </div>
      );
    };

    // ==========================================
    // 6. POS SYSTEM (พนักงาน/แอดมินใช้ตอนขายหน้าร้าน)
    // ==========================================
    const POSSystem = ({ user, db, onSync }) => {
      const [scanMode, setScanMode] = useState(false);
      const [posCart, setPosCart] = useState([]); 
      const [paymentMethod, setPaymentMethod] = useState('cash');
      const [globalDiscount, setGlobalDiscount] = useState(0);
      const [loading, setLoading] = useState(false);
      const [searchTerm, setSearchTerm] = useState('');
      const [catFilter, setCatFilter] = useState('all');
      const [activeGroupToBuy, setActiveGroupToBuy] = useState(null); 
      const [aiResults, setAiResults] = useState([]); 
      const [receivedCash, setReceivedCash] = useState('');
      const [qrStatus, setQrStatus] = useState('pending');
      const [customerPhone, setCustomerPhone] = useState('');
      const [foundCustomer, setFoundCustomer] = useState(null);

      const products = db.products.filter(p => p.status === 'active');
      const categories = ['all', ...PRODUCT_CATEGORIES];
      
      const mySales = db.sales.filter(s => s.seller === user.username && s.status !== 'cancelled');
      const todayStr = new Date().toISOString().split('T')[0];
      const todaySales = mySales.filter(s => s.date && s.date.startsWith(todayStr));
      const cashTotal = todaySales.filter(s => s.paymentMethod === 'cash').reduce((sum, s) => sum + s.total, 0);
      const scanTotal = todaySales.filter(s => s.paymentMethod === 'qr').reduce((sum, s) => sum + s.total, 0);
      const todayItemsTotal = todaySales.reduce((sum, s) => sum + JSON.parse(s.items||'[]').reduce((a,b)=>a+(b.qty||b.cartQty||1), 0), 0);

      const groupedProducts = useMemo(() => {
        const groups = {};
        products.filter(p => {
           const mSearch = searchTerm.toLowerCase();
           const matchName = (p.name || '').toLowerCase().includes(mSearch) || (p.id || '').toLowerCase().includes(mSearch) || (p.color || '').toLowerCase().includes(mSearch) || (p.size || '').toLowerCase().includes(mSearch);
           const matchCat = catFilter === 'all' || p.category === catFilter;
           return matchName && matchCat;
        }).forEach(p => {
           const key = p.name.trim();
           if(!groups[key]) groups[key] = { ...p, totalStock: 0, items: [] };
           groups[key].totalStock += Number(p.stock);
           groups[key].items.push(p);
        });
        return Object.values(groups);
      }, [products, searchTerm, catFilter]);

      useEffect(() => {
        if(paymentMethod === 'qr' && posCart.length > 0) {
           setQrStatus('pending');
           const timer = setTimeout(() => { setQrStatus('success'); }, 3000); 
           return () => clearTimeout(timer);
        }
      }, [paymentMethod, posCart.length]);

      const handleImageScan = (e) => {
        if(!e.target.files[0]) return;
        setScanMode('scanning');
        setTimeout(() => {
           const match = groupedProducts.length > 0 ? [groupedProducts[Math.floor(Math.random() * groupedProducts.length)]] : [];
           setAiResults(match);
           setScanMode('results');
        }, 1500);
      };

      const handleOpenVariantSelect = (group) => {
         if(group.totalStock <= 0) return alert('สินค้านี้หมดสต็อกทุกรายการ!');
         setActiveGroupToBuy(group);
      };

      const handleConfirmAddCart = (variant, qty) => {
         setPosCart(prev => {
            const existing = prev.find(item => item.id === variant.id);
            if (existing) {
               return prev.map(item => item.id === variant.id ? { ...item, cartQty: Number(item.cartQty) + Number(qty) } : item);
            }
            return [...prev, { ...variant, cartQty: Number(qty) }];
         });
         setActiveGroupToBuy(null);
         setScanMode(false);
         setSearchTerm('');
         setReceivedCash('');
      };

      const updateCartItem = (id, field, value) => {
         setPosCart(prev => prev.map(item => item.id === id ? { ...item, [field]: Number(value) } : item));
      };

      const removeCartItem = (id) => setPosCart(prev => prev.filter(item => item.id !== id));

      const searchCustomer = (phone) => {
         setCustomerPhone(phone);
         if(phone.length >= 9) {
            const c = (db.customers || []).find(x => x.phone === phone);
            setFoundCustomer(c || null);
         } else { setFoundCustomer(null); }
      };

      const cartTotalNormal = posCart.reduce((sum, item) => sum + (item.price * item.cartQty), 0);
      const cartGrandTotal = Math.max(0, cartTotalNormal - globalDiscount);
      const change = (paymentMethod === 'cash' && Number(receivedCash) >= cartGrandTotal) ? Number(receivedCash) - cartGrandTotal : 0;
      const maxGlobalDiscount = posCart.reduce((sum, item) => sum + ((item.price - item.floorPrice) * item.cartQty), 0);

      const handleConfirmSale = (e) => {
        e.preventDefault();
        if(posCart.length === 0) return;
        
        let hasError = false;
        posCart.forEach(item => {
           if(item.cartQty > item.stock) { alert(`⚠️ สต็อก ${item.name} (${item.color}) ไม่พอ (มีแค่ ${item.stock} ชิ้น)`); hasError = true; }
        });
        if(globalDiscount > maxGlobalDiscount) {
           alert(`⚠️ ส่วนลดเกินขีดจำกัด! (ลดได้สูงสุด ${formatMoney(maxGlobalDiscount)} บาทต่อบิล เพื่อไม่ให้ขาดทุน)`); hasError = true;
        }
        if(hasError) return;

        if(paymentMethod === 'cash' && Number(receivedCash) < cartGrandTotal) return alert('กรุณากรอกยอดรับเงินให้ครบถ้วน');
        if(paymentMethod === 'qr' && qrStatus !== 'success') return alert('กรุณารอระบบตรวจสอบยอดโอนให้เสร็จสิ้น');

        setLoading(true);
        const saleItems = posCart.map(item => ({ id: item.id, name: item.name, price: item.price, qty: Number(item.cartQty), color: item.color, size: item.size, cost: item.cost }));
        const totalCost = posCart.reduce((sum, item) => sum + (item.cost * item.cartQty), 0);

        const saleData = {
           id: generateId('SAL'), date: formatDateStr(new Date()), seller: user.username,
           customerPhone: foundCustomer ? foundCustomer.phone : '',
           items: JSON.stringify(saleItems),
           amount: cartTotalNormal, 
           total: cartGrandTotal, 
           discount: Number(globalDiscount),
           profit: cartGrandTotal - totalCost,
           paymentMethod: paymentMethod,
           status: 'completed'
        };

        if(onSync) onSync(saleData, 'sales', 'add');
        
        posCart.forEach(item => {
           if(onSync) onSync({ ...item, stock: Number(item.stock) - Number(item.cartQty) }, 'products', 'update');
        });

        if(foundCustomer && onSync) {
            const pointsEarned = Math.floor(cartGrandTotal / 100); 
            const updatedCustomer = { ...foundCustomer, points: Number(foundCustomer.points || 0) + pointsEarned, totalSpent: Number(foundCustomer.totalSpent || 0) + cartGrandTotal };
            onSync(updatedCustomer, 'customers', 'update');
        }

        if(typeof google !== 'undefined') {
          google.script.run.withSuccessHandler(()=>{
            setPosCart([]); setLoading(false); setReceivedCash(''); setCustomerPhone(''); setFoundCustomer(null); setGlobalDiscount(0); alert('ชำระเงินสำเร็จ ขอบคุณค่ะ');
          }).withFailureHandler((e)=>{ alert(e); setLoading(false); }).addSale(saleData);
        } else {
            setTimeout(()=>{ setPosCart([]); setLoading(false); setReceivedCash(''); setCustomerPhone(''); setFoundCustomer(null); setGlobalDiscount(0); alert('ชำระเงินสำเร็จ ขอบคุณค่ะ'); }, 500);
        }
      };

      return (
        <div className="flex flex-col lg:flex-row gap-6 h-full min-h-screen lg:min-h-[600px] fade-in pb-8">
           <div className="flex-1 flex flex-col gap-4 min-w-0">
              <div className="bg-white rounded-3xl p-6 shadow-sm border border-gray-100 flex flex-col md:flex-row gap-6">
                <div className="flex-1">
                  <h2 className="text-gray-500 text-xs font-bold uppercase mb-3">สรุปยอดขาย ของคุณวันนี้</h2>
                  <div className="flex gap-2 mb-4"><span className="px-3 py-1 bg-orange-100 text-orange-700 rounded-full text-[10px] font-bold">วันนี้</span></div>
                  <div className="grid grid-cols-3 gap-4">
                    <div className="pos-bg p-3 rounded-2xl border border-orange-50"><p className="text-[10px] text-orange-800 font-bold"><i className="fa-solid fa-chart-line"></i> ยอดขายรวม</p><p className="text-xl font-black text-orange-900 mt-1">{formatMoney(cashTotal + scanTotal)}</p></div>
                    <div className="pos-bg p-3 rounded-2xl border border-orange-50"><p className="text-[10px] text-orange-800 font-bold"><i className="fa-solid fa-receipt"></i> จำนวนบิล</p><p className="text-xl font-black text-orange-900 mt-1">{todaySales.length}</p></div>
                    <div className="pos-bg p-3 rounded-2xl border border-orange-50"><p className="text-[10px] text-orange-800 font-bold"><i className="fa-solid fa-box"></i> จำนวนชิ้น</p><p className="text-xl font-black text-orange-900 mt-1">{todayItemsTotal}</p></div>
                  </div>
                </div>
                <div className="w-px bg-gray-100 hidden md:block"></div>
                <div className="md:w-48 flex flex-col justify-center gap-3">
                   <div className="bg-green-50 p-3 rounded-xl border border-green-100 flex justify-between items-center"><span className="text-[10px] font-bold text-green-700"><i className="fa-solid fa-money-bill"></i> เงินสด</span><span className="font-black text-green-800">{formatMoney(cashTotal)}</span></div>
                   <div className="bg-blue-50 p-3 rounded-xl border border-blue-100 flex justify-between items-center"><span className="text-[10px] font-bold text-blue-700"><i className="fa-solid fa-qrcode"></i> สแกนจ่าย</span><span className="font-black text-blue-800">{formatMoney(scanTotal)}</span></div>
                </div>
              </div>

              <div className="bg-white rounded-3xl shadow-sm border border-gray-100 p-4 flex flex-col flex-1 min-h-[400px]">
                 <div className="flex gap-2 mb-4">
                    <div className="w-12 h-12 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center text-xl cursor-pointer relative hover:bg-blue-100 transition shrink-0" title="สแกนด้วยกล้อง">
                       <i className="fa-solid fa-camera"></i><input type="file" accept="image/*" capture="environment" onChange={handleImageScan} className="absolute inset-0 opacity-0 cursor-pointer" />
                    </div>
                    <div className="relative flex-1">
                       <i className="fa-solid fa-search absolute left-4 top-3.5 text-gray-400"></i>
                       <input type="text" placeholder="พิมพ์ค้นหาสินค้า (ชื่อ/รหัส/สี/ไซส์)..." value={searchTerm} onChange={e=>setSearchTerm(e.target.value)} className="w-full bg-gray-50 border border-gray-200 text-gray-800 text-sm rounded-xl focus:ring-2 focus:ring-orange-500 outline-none font-medium transition h-12 pl-10" />
                    </div>
                    <select value={catFilter} onChange={e=>setCatFilter(e.target.value)} className="bg-gray-50 border border-gray-200 text-gray-800 text-sm rounded-xl outline-none font-medium px-3 h-12 shrink-0">
                       <option value="all">ทุกหมวดหมู่</option>
                       {PRODUCT_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                    </select>
                 </div>

                 {scanMode === 'scanning' && <div className="flex-1 flex flex-col items-center justify-center text-gray-400"><i className="fa-solid fa-spinner fa-spin text-4xl text-blue-500 mb-4"></i><p className="font-bold animate-pulse">AI กำลังค้นหาสินค้าที่ใกล้เคียง...</p></div>}
                 
                 {scanMode === 'results' && (
                    <div className="flex-1 bg-blue-50/50 rounded-2xl border border-blue-100 p-4 slide-up relative overflow-y-auto">
                      <button onClick={()=>setScanMode(false)} className="absolute top-4 right-4 text-gray-400 hover:text-gray-800"><i className="fa-solid fa-times"></i></button>
                      <h3 className="font-bold text-gray-800 mb-4"><i className="fa-solid fa-wand-magic-sparkles text-orange-500 mr-2"></i> สินค้าที่สแกนตรงกัน</h3>
                      <div className="grid grid-cols-1 gap-3">
                        {aiResults.map(p => (
                           <div key={p.name} onClick={()=>handleOpenVariantSelect(p)} className="flex items-center gap-4 p-3 bg-white border border-gray-100 rounded-xl hover:border-orange-500 cursor-pointer transition shadow-sm">
                               <img src={parseFilesInfo(p.imgUrl).images[0]} className="w-16 h-16 rounded-lg object-cover border" onError={(e) => { e.target.src = 'https://placehold.co/400x400?text=No+Image'; }} />
                               <div className="flex-1"><p className="font-bold text-sm text-gray-800 line-clamp-1">{p.name}</p><p className="text-[10px] text-gray-500 mt-1">จำนวนตัวเลือก: {p.items.length} | สต็อกรวม: {p.totalStock}</p></div>
                               <p className="font-black text-orange-600">{formatMoney(p.price)}</p>
                           </div>
                        ))}
                      </div>
                    </div>
                 )}

                 {!scanMode && (
                   <div className="flex-1 overflow-y-auto pr-2">
                     <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                       {groupedProducts.map(p => (
                         <div key={p.name} onClick={()=>handleOpenVariantSelect(p)} className={`bg-white rounded-2xl p-3 border transition cursor-pointer flex flex-col ${p.totalStock<=0 ? 'opacity-50 pointer-events-none' : 'hover:shadow-md hover:border-orange-300 border-gray-100'}`}>
                           <div className="aspect-square bg-gray-50 rounded-xl overflow-hidden mb-3 relative"><img src={parseFilesInfo(p.imgUrl).images[0]} className="w-full h-full object-cover" onError={(e) => { e.target.src = 'https://placehold.co/400x400?text=No+Image'; }}/><div className="absolute top-1 right-1 bg-white/90 backdrop-blur text-[10px] font-bold px-1.5 py-0.5 rounded text-gray-600 border shadow-sm">สต็อก {p.totalStock}</div></div>
                           <p className="text-xs font-bold text-gray-800 line-clamp-2 leading-tight flex-1">{p.name}</p>
                           <p className="text-sm font-black text-orange-600 mt-1">{formatMoney(p.price)}</p>
                         </div>
                       ))}
                       {groupedProducts.length === 0 && <div className="col-span-full text-center py-10 text-gray-400 font-bold text-sm">ไม่พบสินค้า</div>}
                     </div>
                   </div>
                 )}
              </div>
           </div>

           <div className="w-full lg:w-[450px] xl:w-[500px] shrink-0 pos-bg rounded-3xl shadow-sm border border-[#E8DCD5] flex flex-col overflow-hidden relative h-[600px] lg:h-auto">
              <div className="p-4 border-b border-[#E8DCD5] bg-white shrink-0 flex justify-between items-center">
                 <h3 className="font-bold text-gray-800"><i className="fa-solid fa-receipt text-orange-500 mr-2"></i> ทำรายการขาย ({posCart.reduce((a,b)=>a+b.cartQty,0)} ชิ้น)</h3>
                 {posCart.length > 0 && <button onClick={()=>{setPosCart([]); setReceivedCash(''); setGlobalDiscount(0);}} className="text-[10px] text-gray-400 hover:text-red-500 font-bold"><i className="fa-solid fa-trash mr-1"></i> ล้างตะกร้า</button>}
              </div>
              
              <div className="p-3 border-b border-[#E8DCD5] bg-orange-50/50">
                 <div className="relative">
                    <i className="fa-solid fa-user absolute left-3 top-2.5 text-orange-400 text-xs"></i>
                    <input type="tel" placeholder="ค้นหาสมาชิก (เบอร์โทร)..." value={customerPhone} onChange={e=>searchCustomer(e.target.value)} className="w-full bg-white border border-orange-200 text-[11px] font-bold rounded-lg px-8 py-2 outline-none focus:ring-1 focus:ring-orange-400" />
                 </div>
                 {foundCustomer && (
                    <div className="mt-2 text-[10px] font-bold flex justify-between items-center text-orange-800">
                       <span><i className="fa-solid fa-check-circle text-green-500 mr-1"></i> {foundCustomer.name}</span>
                       <span className="bg-orange-200 px-1.5 py-0.5 rounded text-orange-800">{foundCustomer.points} แต้ม</span>
                    </div>
                 )}
              </div>
              
              {posCart.length === 0 ? (
                 <div className="flex-1 flex flex-col items-center justify-center text-gray-400 p-6 text-center">

                       {paymentMethod === 'cash' && (

                       <div className="bg-gray-50 p-3 rounded-xl mb-4">
                         <div className="flex justify-between text-[11px] text-gray-500 mb-1"><p>ราคาปกติ</p><p>{formatMoney(cartTotalNormal)}</p></div>

                         <div className="flex justify-between text-lg font-black text-gray-800 border-t border-dashed pt-2"><p>ยอดสุทธิ</p><p className="text-green-600">{formatMoney(cartGrandTotal)}</p></div>
                         {paymentMethod === 'cash' && Number(receivedCash) >= cartGrandTotal && (

           {activeGroupToBuy && <POSVariantModal productGroup={activeGroupToBuy} onClose={()=>setActiveGroupToBuy(null)} onAddToCart={handleConfirmAddCart} />}

    };

    const SalesHistory = ({ user, db, onSync }) => {
      const [selectedBill, setSelectedBill] = useState(null);
      const [showPinModal, setShowPinModal] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [pendingVoidTx, setPendingVoidTx] = useState(null);
      const OWNER_PIN = "9999"; // เปลี่ยนรหัสได้

      // 🔥 NEW: state สำหรับ search + filter
      const [searchTerm, setSearchTerm] = useState('');
      const [filter, setFilter] = useState('today'); // today | cancelled | all

      const mySales = db.sales.filter(s => user.role === 'admin' || s.seller === user.username);

      const todayStr = new Date().toISOString().split('T')[0];

      // 🔥 NEW: filter logic
      const filteredSales = mySales.filter(s => {
        const isToday = s.date && s.date.startsWith(todayStr);
        const isCancelled = s.status === 'cancelled';

        // filter เงื่อนไข
        if (filter === 'today' && (!isToday || isCancelled)) return false;
        if (filter === 'cancelled' && !isCancelled) return false;

        // 🔥 search จากชื่อสินค้า
        if (searchTerm.trim() !== '') {
          const items = JSON.parse(s.items || '[]');
          const found = items.some(i =>
            i.name.toLowerCase().includes(searchTerm.toLowerCase())
          );
          return found;
        }

        return true;
      });

      // 🔥 ยอดรวม (ใช้เฉพาะบิลวันนี้)
      const todaySales = mySales.filter(s => s.date && s.date.startsWith(todayStr) && s.status !== 'cancelled');
      const cashTotal = todaySales.filter(s => s.paymentMethod === 'cash').reduce((sum, s) => sum + s.total, 0);
      const scanTotal = todaySales.filter(s => s.paymentMethod === 'qr').reduce((sum, s) => sum + s.total, 0);

      // ================= VOID LOGIC (เหมือนเดิม)
      const handlePartialVoid = (tx, itemToReturn, returnQty, itemIdx) => {
        const items = JSON.parse(tx.items || '[]');
        if(items[itemIdx].qty !== undefined) items[itemIdx].qty -= returnQty;
        if(items[itemIdx].cartQty !== undefined) items[itemIdx].cartQty -= returnQty;

        const newItems = items.filter(i => (i.qty || i.cartQty || 0) > 0);
        const newAmount = newItems.reduce((sum, i) => sum + (i.price * (i.qty || i.cartQty || 1)), 0);
        const newDiscount = Math.min(tx.discount || 0, newAmount);
        const newTotal = newAmount - newDiscount;
        const isFullVoid = newItems.length === 0;

        const updatedTx = {
          ...tx,
          items: JSON.stringify(newItems),
          amount: newAmount,
          total: newTotal,
          discount: newDiscount,
          status: isFullVoid ? 'cancelled' : tx.status
        };

        if(onSync) onSync({ updatedTx, returnedItem: { ...itemToReturn, returnQty }, isFullVoid }, 'transactions', 'partial_void');

        if (isFullVoid) setSelectedBill(null);
        else setSelectedBill(updatedTx);
      };
      
      const handleFullVoid = (tx) => {

        // เก็บบิลไว้ก่อน
        setPendingVoidTx(tx);

        // เปิด popup ใส่รหัส
        setShowPinModal(true);

      };

      // ================= UI =================
      return (
        <div className="fade-in space-y-4 max-w-xl mx-auto">

          {/* 🔥 SEARCH */}
          <div className="bg-white p-3 rounded-xl shadow-sm border">
            <input
              type="text"
              placeholder="ค้นหาชื่อสินค้า..."
              value={searchTerm}
              onChange={(e)=>setSearchTerm(e.target.value)}
              className="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
            />
          </div>

          {/* 🔥 FILTER */}
          <div className="flex gap-2">
            {[
              { key:'today', label:'บิลวันนี้' },
              { key:'cancelled', label:'ยกเลิก' },
              { key:'all', label:'ทั้งหมด' }
            ].map(f => (
              <button
                key={f.key}
                onClick={()=>setFilter(f.key)}
                className={`flex-1 py-2 rounded-xl text-sm font-bold transition ${
                  filter===f.key
                    ? 'bg-blue-500 text-white'
                    : 'bg-gray-100 text-gray-500'
                }`}
              >
                {f.label}
              </button>
            ))}
          </div>

          {/* HEADER */}
          <div className="bg-white p-4 rounded-2xl shadow-sm border flex justify-between items-center">
            <h3 className="font-black text-gray-800">
              รายการบิล ({filteredSales.length})
            </h3>
            <div className="text-right text-xs font-bold text-gray-500">
              <p>สด: <span className="text-green-600">{formatMoney(cashTotal)}</span></p>
              <p>สแกน: <span className="text-blue-600">{formatMoney(scanTotal)}</span></p>
            </div>
          </div>

          {/* LIST */}
          {filteredSales.length === 0 ? (
            <p className="text-center py-10 text-gray-400 text-sm">ไม่พบรายการ</p>
          ) : (
            filteredSales.map(s => {
              const isCancelled = s.status === 'cancelled';
              const items = JSON.parse(s.items || '[]');

              return (
                <div
                  key={s.id}
                  onClick={() => setSelectedBill(s)}
                  className={`bg-white p-4 rounded-2xl shadow-sm border cursor-pointer hover:border-orange-300 transition flex flex-col ${
                    isCancelled ? 'border-red-200 opacity-60' : 'border-gray-100'
                  }`}
                >
                  <div className="flex justify-between items-center mb-2">
                    <span className="text-[10px] text-gray-400 font-mono">{s.id}</span>
                    <span className="text-[10px] font-bold text-gray-500">
                      <i className="fa-regular fa-clock mr-1"></i>
                      {s.date.split(' ')[1]}
                    </span>
                  </div>

                  {/* 🔥 แสดงชื่อสินค้า */}
                  <div className="text-xs text-gray-500 line-clamp-2">
                    {items.map(i => i.name).join(', ')}
                  </div>

                  <div className="border-t pt-2 mt-2 flex justify-between items-center text-sm">
                    {isCancelled ? (
                      <span className="text-[10px] px-2 py-0.5 rounded font-bold bg-red-100 text-red-600">
                        ยกเลิกแล้ว
                      </span>
                    ) : (
                      <span className={`text-[10px] px-2 py-0.5 rounded font-bold ${
                        s.paymentMethod==='qr'
                          ? 'bg-blue-50 text-blue-600'
                          : 'bg-green-50 text-green-600'
                      }`}>
                        {s.paymentMethod==='qr'?'สแกน':'เงินสด'}
                      </span>
                    )}
                    <p className={`font-black ${
                      isCancelled ? 'text-gray-400 line-through' : 'text-gray-800'
                    }`}>
                      {formatMoney(s.total)}
                    </p>
                  </div>
                </div>
              );
            })
          )}

          {/* MODAL */}
          {selectedBill && (
            <BillDetailModal
              tx={{
                ...selectedBill,
                amount: selectedBill.total + (selectedBill.discount||0),
                source: 'POS หน้าร้าน',
                person: selectedBill.seller,
                txType: 'offline'
              }}
              onClose={() => setSelectedBill(null)}
              onFullVoid={() => handleFullVoid(selectedBill)}
              onPartialVoid={handlePartialVoid}
            />
          )}

        </div>
      );
    };

    // ==========================================
    // 7. ADMIN DASHBOARDS & COMPONENTS
    // ==========================================
    const AdminDashboard = ({ db }) => {
      const [filter, setFilter] = useState('today'); 
      const [chartYear, setChartYear] = useState(new Date().getFullYear()); 

      const years = useMemo(() => {
        const y = new Set();
        db.sales.forEach(s => { if(s.date) y.add(new Date(s.date.replace(' ','T')).getFullYear()) });
        db.orders.forEach(o => { if(o.date) y.add(new Date(o.date.replace(' ','T')).getFullYear()) });
        y.add(new Date().getFullYear());
        return Array.from(y).sort((a,b)=>b-a); 
      }, [db.sales, db.orders]);

      const filteredData = useMemo(() => {
        const now = new Date();
        const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
        const startOfWeek = startOfToday - (now.getDay() * 24 * 60 * 60 * 1000);
        const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
        const startOfYear = new Date(now.getFullYear(), 0, 1).getTime();

        const isMatch = (dateStr) => {
           if(!dateStr) return false;
           const d = new Date(dateStr.replace(' ', 'T')).getTime();
           if(filter === 'today') return d >= startOfToday;
           if(filter === 'week') return d >= startOfWeek;
           if(filter === 'month') return d >= startOfMonth;
           if(filter === 'year') return d >= startOfYear;
           return true;
        };

        const fSales = db.sales.filter(s => s.status !== 'cancelled' && isMatch(s.date));
        const fOrders = db.orders.filter(o => o.status === 'completed' && isMatch(o.date));

        const sTotal = fSales.reduce((a,b)=>a+b.total, 0);
        const sProfit = fSales.reduce((a,b)=>a+b.profit, 0);
        const oTotal = fOrders.reduce((a,b)=>a+b.grandTotal, 0);

        let prodStats = {};
        [...fSales, ...fOrders].forEach(record => {
           try {
             const items = JSON.parse(record.items || '[]');
             items.forEach(i => {
               
                if(!prodStats[i.name]) prodStats[i.name] = { name: i.name, qty: 0, revenue: 0 };
                prodStats[i.name].qty += Number(i.qty || i.cartQty || 1);
                prodStats[i.name].revenue += Number(i.price * (i.qty || i.cartQty || 1));
             });
           } catch(e){}
        });
        const top5Prods = Object.values(prodStats).sort((a,b)=>b.qty - a.qty).slice(0,5);

        let empStats = {};
        fSales.forEach(s => {
           if(!empStats[s.seller]) empStats[s.seller] = { count: 0, total: 0 };
           empStats[s.seller].count += 1;
           empStats[s.seller].total += s.total;
        });
        const top5Emps = Object.entries(empStats).map(([name, d]) => ({name, ...d})).sort((a,b)=>b.total - a.total).slice(0,5);

        let monthlyRevenue = Array(12).fill(0);
        db.sales.filter(s => s.status !== 'cancelled').forEach(s => {
            if(s.date && new Date(s.date.replace(' ', 'T')).getFullYear() === Number(chartYear)) {
               monthlyRevenue[new Date(s.date.replace(' ', 'T')).getMonth()] += s.total;
            }
        });
        db.orders.filter(o=>o.status==='completed').forEach(o => {
            if(o.date && new Date(o.date.replace(' ', 'T')).getFullYear() === Number(chartYear)) {
               monthlyRevenue[new Date(o.date.replace(' ', 'T')).getMonth()] += o.grandTotal;
            }
        });
        const maxRev = Math.max(...monthlyRevenue, 1);

        return { sTotal, sCount: fSales.length, sProfit, oTotal, oCount: fOrders.length, top5Prods, top5Emps, monthlyRevenue, maxRev };
      }, [db.sales, db.orders, filter, chartYear]);

      const lowStock = db.products.filter(p => p.stock < 8);
      const months = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

      return (
        <div className="fade-in space-y-6">
           <div className="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
              <h3 className="font-bold text-gray-800"><i className="fa-solid fa-filter text-orange-500 mr-2"></i> ตัวกรองข้อมูลภาพรวม</h3>
              <select value={filter} onChange={e=>setFilter(e.target.value)} className="bg-gray-50 border p-2 rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-orange-500">
                 <option value="today">วันนี้</option>
                 <option value="week">สัปดาห์นี้</option>
                 <option value="month">เดือนนี้</option>
                 <option value="year">ปีนี้</option>
              </select>
           </div>
           <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              <div className="bg-white p-6 rounded-3xl shadow-sm border-l-4 border-l-green-500"><p className="text-gray-500 text-xs font-bold uppercase mb-1">รายได้หน้าร้าน</p><h3 className="text-3xl font-black text-gray-800">{formatMoney(filteredData.sTotal)}</h3><p className="text-[10px] text-gray-400 mt-2">{filteredData.sCount} บิล</p></div>
              <div className="bg-white p-6 rounded-3xl shadow-sm border-l-4 border-l-blue-500"><p className="text-gray-500 text-xs font-bold uppercase mb-1">กำไรหน้าร้าน (หักทุน)</p><h3 className="text-3xl font-black text-gray-800">{formatMoney(filteredData.sProfit)}</h3></div>
              <div className="bg-white p-6 rounded-3xl shadow-sm border-l-4 border-l-orange-500"><p className="text-gray-500 text-xs font-bold uppercase mb-1">รายได้ออนไลน์</p><h3 className="text-3xl font-black text-gray-800">{formatMoney(filteredData.oTotal)}</h3><p className="text-[10px] text-gray-400 mt-2">{filteredData.oCount} ออเดอร์สำเร็จ</p></div>
           </div>
           <div className="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
             <div className="flex justify-between items-center mb-6 border-b pb-2">
                <h3 className="font-bold text-gray-800"><i className="fa-solid fa-chart-simple text-blue-500 mr-2"></i> กราฟรายได้ (ม.ค. - ธ.ค.)</h3>
                <select value={chartYear} onChange={e=>setChartYear(e.target.value)} className="bg-gray-50 border p-1.5 rounded-lg text-xs font-bold outline-none">
                   {years.map(y => <option key={y} value={y}>ปี {y}</option>)}
                </select>
             </div>
             <div className="flex items-end gap-2 h-40 mt-4">
                {filteredData.monthlyRevenue.map((rev, i) => {
                   const hPercent = (rev / filteredData.maxRev) * 100;
                   return (
                     <div key={i} className="flex-1 flex flex-col items-center gap-2 group">
                        <div className="w-full bg-blue-100 rounded-t-sm relative flex items-end justify-center h-full">
                           <div className="w-full bg-blue-500 rounded-t-sm transition-all duration-1000" style={{height: `${hPercent}%`}}></div>
                           <span className="absolute -top-6 text-[8px] font-bold text-gray-500 opacity-0 group-hover:opacity-100 transition">{formatMoney(rev)}</span>
                        </div>
                        <span className="text-[10px] font-bold text-gray-400">{months[i]}</span>
                     </div>
                   );
                })}
             </div>
           </div>
           <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
              <div className="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
                <h3 className="font-bold text-gray-800 mb-4 border-b pb-2"><i className="fa-solid fa-crown text-yellow-500 mr-2"></i> สินค้าขายดี 5 อันดับ</h3>
                <div className="space-y-4">
                  {filteredData.top5Prods.map((p, i) => (
                    <div key={i} className="flex flex-col gap-1 relative">
                       <div className="flex justify-between text-xs font-bold text-gray-700"><span>{i+1}. {p.name}</span><span>{p.qty} ชิ้น</span></div>
                       <div className="h-1.5 w-full bg-gray-100 rounded-full overflow-hidden"><div className="h-full bg-yellow-400" style={{width: `${(p.qty/filteredData.top5Prods[0]?.qty)*100}%`}}></div></div>
                    </div>
                  ))}
                  {filteredData.top5Prods.length === 0 && <p className="text-xs text-center text-gray-400">ไม่มีข้อมูลในช่วงเวลานี้</p>}
                </div>
              </div>
              <div className="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
                <h3 className="font-bold text-gray-800 mb-4 border-b pb-2"><i className="fa-solid fa-user-tie text-blue-500 mr-2"></i> ยอดขายพนักงาน 5 อันดับ</h3>
                <div className="space-y-4">
                  {filteredData.top5Emps.map((emp, i) => (
                    <div key={i} className="flex flex-col gap-1 relative">
                       <div className="flex justify-between text-xs font-bold text-gray-700"><span>{i+1}. {emp.name} <span className="text-[10px] text-gray-400 font-normal">({emp.count} บิล)</span></span><span className="text-green-600">{formatMoney(emp.total)}</span></div>
                       <div className="h-1.5 w-full bg-gray-100 rounded-full overflow-hidden"><div className="h-full bg-blue-500" style={{width: `${(emp.total/filteredData.top5Emps[0]?.total)*100}%`}}></div></div>
                    </div>
                  ))}
                  {filteredData.top5Emps.length === 0 && <p className="text-xs text-center text-gray-400">ไม่มีข้อมูลในช่วงเวลานี้</p>}
                </div>
              </div>
              <div className="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
                <h3 className="font-bold text-gray-800 mb-4 border-b pb-2"><i className="fa-solid fa-triangle-exclamation text-red-500 mr-2"></i> สินค้าใกล้หมดสต็อก (&lt;8)</h3>
                <div className="space-y-3 max-h-48 overflow-y-auto pr-2">
                  {lowStock.map(p => (
                    <div key={p.id} className="flex justify-between items-center p-2 bg-red-50 rounded-lg border border-red-100">
                      <span className="text-xs font-bold text-gray-800 line-clamp-1 flex-1">{p.name}</span>
                      <span className="text-[10px] bg-red-500 text-white px-2 py-0.5 rounded-md font-bold whitespace-nowrap ml-2">เหลือ {p.stock}</span>
                    </div>
                  ))}
                  {lowStock.length === 0 && <p className="text-sm text-gray-400 text-center py-4">สต็อกปกติ</p>}
                </div>
              </div>
           </div>
        </div>
      );
    };

    const AdminRevenue = ({ db, onSync }) => {
      const [timeFilter, setTimeFilter] = useState('today'); 
      const [typeFilter, setTypeFilter] = useState('all'); 
      const [searchQuery, setSearchQuery] = useState('');
      const [startDate, setStartDate] = useState('');
      const [endDate, setEndDate] = useState('');
      const [selectedBill, setSelectedBill] = useState(null);
      
      const allTx = useMemo(() => {
         return [
           ...db.sales.map(s => ({ id: s.id, date: s.date, txType: 'offline', source: 'POS หน้าร้าน', person: s.seller, amount: s.amount || s.total, total: s.total, profit: s.profit, discount: s.discount, items: s.items, paymentMethod: s.paymentMethod, status: s.status || 'completed', rawData: s })),
           ...db.orders.map(o => ({ id: o.id, date: o.date, txType: 'online', source: 'ออนไลน์', person: o.customerName, amount: o.grandTotal, total: o.grandTotal, profit: 0, discount: 0, items: o.items, paymentMethod: 'online', status: o.status || 'pending', rawData: o }))
         ].sort((a,b) => new Date(b.date.replace(' ','T')).getTime() - new Date(a.date.replace(' ','T')).getTime());
      }, [db.sales, db.orders]);

      const getStats = (filterType) => {
         const now = new Date();
         const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
         const startOfWeek = startOfToday - (now.getDay() * 24 * 60 * 60 * 1000);
         const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
         const startOfYear = new Date(now.getFullYear(), 0, 1).getTime();

         let targetTx = allTx.filter(tx => {
            if(tx.status === 'cancelled') return false; 
            if(!tx.date) return false;
            const t = new Date(tx.date.replace(' ', 'T')).getTime();
            if(filterType === 'today') return t >= startOfToday;
            if(filterType === 'week') return t >= startOfWeek;
            if(filterType === 'month') return t >= startOfMonth;
            if(filterType === 'year') return t >= startOfYear;
            return true;
         });

         const total = targetTx.reduce((sum, tx) => sum + tx.total, 0);
         const offline = targetTx.filter(tx=>tx.txType==='offline').reduce((sum, tx) => sum + tx.total, 0);
         const online = targetTx.filter(tx=>tx.txType==='online').reduce((sum, tx) => sum + tx.total, 0);
         const cashTotal = targetTx.filter(tx=>tx.paymentMethod==='cash').reduce((sum, tx) => sum + tx.total, 0);
         const scanTotal = targetTx.filter(tx=>tx.paymentMethod==='qr').reduce((sum, tx) => sum + tx.total, 0);
         const profit = targetTx.reduce((sum, tx) => sum + Number(tx.profit || 0), 0);
         const discount = targetTx.reduce((sum, tx) => sum + Number(tx.discount || 0), 0);

         return { total, offline, online, count: targetTx.length, cashTotal, scanTotal, profit, discount };
      };

      const stats = getStats(timeFilter);

      const filteredTx = allTx.filter(tx => {
          const matchType = typeFilter === 'all' || tx.txType === typeFilter;
          const lowerQ = searchQuery.toLowerCase();
          
          let matchItem = false;
          try {
              const items = JSON.parse(tx.items || '[]');
              matchItem = items.some(i => (i.name || '').toLowerCase().includes(lowerQ));
          } catch(e) {}
          
          const matchSearch = tx.id.toLowerCase().includes(lowerQ) || matchItem || (tx.person || '').toLowerCase().includes(lowerQ);
          
          let matchDate = true;
          if (startDate || endDate) {
              const txDate = new Date(tx.date.split(' ')[0]);
              txDate.setHours(0,0,0,0);
              const sDate = startDate ? new Date(startDate) : new Date('2000-01-01');
              const eDate = endDate ? new Date(endDate) : new Date('2100-01-01');
              sDate.setHours(0,0,0,0);
              eDate.setHours(23,59,59,999);
              matchDate = txDate >= sDate && txDate <= eDate;
          }
          return matchType && matchSearch && matchDate;
      });

      const filterLabel = { 'today': 'วันนี้', 'week': 'สัปดาห์นี้', 'month': 'เดือนนี้', 'year': 'ปีนี้', 'all': 'ตั้งแต่เริ่ม' }[timeFilter];

      const handlePartialVoid = (tx, itemToReturn, returnQty, itemIdx) => {
         const items = JSON.parse(tx.items || '[]');
         if(items[itemIdx].qty !== undefined) items[itemIdx].qty -= returnQty;
         if(items[itemIdx].cartQty !== undefined) items[itemIdx].cartQty -= returnQty;
         const newItems = items.filter(i => (i.qty || i.cartQty || 0) > 0);
         
         const newAmount = newItems.reduce((sum, i) => sum + (i.price * (i.qty || i.cartQty || 1)), 0);
         const newDiscount = Math.min(tx.discount || 0, newAmount);
         const newTotal = newAmount - newDiscount;
         const isFullVoid = newItems.length === 0;
         
         const updatedTx = { ...tx, items: JSON.stringify(newItems), amount: newAmount, total: newTotal, discount: newDiscount, status: isFullVoid ? 'cancelled' : tx.status };
         
         if(onSync) onSync({ updatedTx, returnedItem: { ...itemToReturn, returnQty }, isFullVoid }, 'transactions', 'partial_void');
         if(typeof google !== 'undefined') {
             if (updatedTx.id.startsWith('ORD')) google.script.run.withSuccessHandler(()=>{}).updateOrderStatus(updatedTx);
             else if (google.script.run.updateSale) google.script.run.withSuccessHandler(()=>{}).updateSale(updatedTx);
             
             const product = db.products.find(p => p.id === itemToReturn.id);
             if (product) google.script.run.withSuccessHandler(()=>{}).updateProduct({...product, stock: Number(product.stock) + returnQty});
         }
         if (isFullVoid) setSelectedBill(null); else setSelectedBill(updatedTx);
      };

      const handleFullVoid = (tx) => {
         if(confirm(`ยืนยันการยกเลิกบิล ${tx.id} ทั้งบิล?\nเมื่อยกเลิก สินค้าทั้งหมดในบิลนี้จะถูกคืนเข้าสต็อกโดยอัตโนมัติ`)){
            const items = JSON.parse(tx.items || '[]');
            const updatedTx = { ...tx, status: 'cancelled' };
            if(onSync) onSync({ updatedTx, returnedItems: items, isFullVoid: true }, 'transactions', 'full_void');
            
            if(typeof google !== 'undefined') {
               if (updatedTx.id.startsWith('ORD')) google.script.run.withSuccessHandler(()=>{}).updateOrderStatus({id: updatedTx.id, status: 'cancelled'});
               else if (google.script.run.voidTransaction) google.script.run.withSuccessHandler(()=>{}).voidTransaction(updatedTx);
               else if (google.script.run.updateSale) google.script.run.withSuccessHandler(()=>{}).updateSale(updatedTx);

               items.forEach(item => {
                   const product = db.products.find(p => p.id === item.id);
                   if (product) google.script.run.withSuccessHandler(()=>{}).updateProduct({...product, stock: Number(product.stock) + Number(item.qty || item.cartQty || 1)});
               });
            }
            setSelectedBill(null);
         }
      };

      return (
        <div className="fade-in space-y-6">
           <div className="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
              <h3 className="font-bold text-gray-800"><i className="fa-solid fa-calculator text-blue-500 mr-2"></i> สรุปบัญชีรายได้</h3>
              <select value={timeFilter} onChange={e=>setTimeFilter(e.target.value)} className="bg-gray-50 border p-2 rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-blue-500">
                 <option value="today">รายได้วันนี้</option>
                 <option value="week">รายได้สัปดาห์นี้</option>
                 <option value="month">รายได้เดือนนี้</option>
                 <option value="year">รายได้ปีนี้</option>
                 <option value="all">ตั้งแต่เริ่มต้น</option>
              </select>
           </div>
           <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
              <div className="bg-gradient-to-br from-blue-600 to-blue-800 p-6 rounded-3xl shadow-lg text-white md:col-span-2">
                 <p className="text-blue-200 text-xs font-bold uppercase mb-1">รวมรายได้ทั้งหมด ({filterLabel})</p>
                 <h3 className="text-4xl font-black mb-3">{formatMoney(stats.total)}</h3>
                 <div className="flex gap-4 border-t border-blue-500 pt-3">
                    <div className="flex-1"><p className="text-[10px] uppercase text-blue-300">รับเงินสดหน้าร้าน</p><p className="font-bold">{formatMoney(stats.cashTotal)}</p></div>
                    <div className="flex-1"><p className="text-[10px] uppercase text-blue-300">สแกนจ่าย QR หน้าร้าน</p><p className="font-bold">{formatMoney(stats.scanTotal)}</p></div>
                 </div>
              </div>
              <div className="bg-white p-6 rounded-3xl shadow-sm border-l-4 border-l-emerald-500 flex flex-col justify-center">
                 <p className="text-gray-500 text-xs font-bold uppercase mb-1">กำไรสุทธิ ({filterLabel})</p>
                 <h3 className="text-3xl font-black text-gray-800">{formatMoney(stats.profit)}</h3>
              </div>
              <div className="bg-white p-6 rounded-3xl shadow-sm border-l-4 border-l-red-500 flex flex-col justify-center">
                 <p className="text-gray-500 text-xs font-bold uppercase mb-1">ส่วนลดท้ายบิลที่ให้ไป ({filterLabel})</p>
                 <h3 className="text-3xl font-black text-gray-800">{formatMoney(stats.discount)}</h3>
              </div>
           </div>
           <div className="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
             <div className="p-5 border-b bg-slate-50 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
               <h3 className="font-bold text-gray-800">ประวัติรายการธุรกรรม (Bills)</h3>
               <div className="flex flex-wrap gap-2">
                  <div className="flex items-center gap-2 border bg-white rounded-lg p-1">
                     <input type="date" value={startDate} onChange={e=>setStartDate(e.target.value)} className="text-xs outline-none p-1 text-gray-600" />
                     <span className="text-xs text-gray-400">-</span>
                     <input type="date" value={endDate} onChange={e=>setEndDate(e.target.value)} className="text-xs outline-none p-1 text-gray-600" />
                  </div>
                  <div className="relative">
                     <i className="fa-solid fa-search absolute left-3 top-2 text-gray-400 text-xs"></i>
                     <input type="text" placeholder="ค้นหารหัสบิล/ลูกค้า/สินค้า..." value={searchQuery} onChange={e=>setSearchQuery(e.target.value)} className="pl-8 pr-3 py-1.5 border rounded-lg text-xs outline-none focus:ring-1 focus:ring-blue-500 w-48"/>
                  </div>
                  <select value={typeFilter} onChange={e=>setTypeFilter(e.target.value)} className="border rounded-lg text-xs px-2 py-1.5 outline-none font-medium">
                     <option value="all">ทั้งหมด</option>
                     <option value="offline">หน้าร้าน POS</option>
                     <option value="online">ออนไลน์เว็บ</option>
                  </select>
               </div>
             </div>
             <div className="overflow-x-auto max-h-96">
               <table className="w-full text-left whitespace-nowrap">
                 <thead className="bg-gray-50 text-[11px] text-gray-500 font-black uppercase border-b sticky top-0"><tr>
                    <th className="p-4">วันที่ / เวลา</th><th className="p-4">รหัสบิล</th><th className="p-4">สถานะ / ช่องทาง</th><th className="p-4">พนักงาน/ลูกค้า</th><th className="p-4 text-right">ยอดรวมสุทธิ</th>
                 </tr></thead>
                 <tbody className="text-sm divide-y divide-gray-50">
                    {filteredTx.map(tx => (
                      <tr key={tx.id} onClick={() => setSelectedBill(tx)} className={`hover:bg-slate-50 transition cursor-pointer ${tx.status === 'cancelled' ? 'opacity-50 bg-gray-50' : ''}`}>
                        <td className="p-4 font-bold text-gray-700">{tx.date}</td>
                        <td className="p-4 font-mono text-xs text-gray-500">{tx.id}</td>
                        <td className="p-4">
                          {tx.status === 'cancelled' ? <span className="text-[10px] px-2 py-1 rounded font-bold mr-2 bg-red-100 text-red-600">ยกเลิกแล้ว</span> : <span className={`text-[10px] px-2 py-1 rounded-md font-bold mr-2 ${tx.txType === 'online' ? 'bg-orange-100 text-orange-700' : 'bg-green-100 text-green-700'}`}>{tx.source}</span>}
                        </td>
                        <td className="p-4 text-gray-600">{tx.person}</td>
                        <td className={`p-4 text-right font-black ${tx.status === 'cancelled' ? 'text-gray-400 line-through' : 'text-blue-600'}`}>{formatMoney(tx.total)}</td>
                      </tr>
                    ))}
                 </tbody>
               </table>
               {filteredTx.length === 0 && <div className="text-center py-10 text-gray-400">ไม่มีรายการในช่วงเวลานี้</div>}
             </div>
           </div>

           {selectedBill && <BillDetailModal tx={selectedBill} onClose={() => setSelectedBill(null)} onFullVoid={() => handleFullVoid(selectedBill)} onPartialVoid={handlePartialVoid} />}
        </div>
      );
    };

    const AdminOrderKanban = ({ db, onSync }) => {
        const updateStatus = (id, newStatus) => {
           const updatedOrder = { ...db.orders.find(o=>o.id===id), status: newStatus };
           if(onSync) onSync(updatedOrder, 'orders', 'update');
           if(typeof google !== 'undefined') google.script.run.withSuccessHandler(()=>{}).updateOrderStatus({id, status: newStatus});
        };

        const renderCol = (status, title, bg, icon, actionBtn) => (
          <div className="flex-1 min-w-[320px] bg-gray-50 rounded-2xl p-4 flex flex-col h-full border border-gray-100">
            <h3 className={`font-black text-sm uppercase tracking-wider mb-4 flex items-center ${bg} p-3 rounded-xl`}><i className={`fa-solid ${icon} mr-2`}></i> {title} <span className="ml-auto bg-white text-gray-800 px-2 py-0.5 rounded-md text-[10px]">{db.orders.filter(o=>o.status===status).length}</span></h3>
            <div className="space-y-3 overflow-y-auto flex-1 hide-scrollbar">
               {db.orders.filter(o=>o.status===status).map(o => {
                  const items = JSON.parse(o.items || '[]');
                  return (
                    <div key={o.id} className="bg-white p-4 rounded-xl shadow-sm border border-gray-200 cursor-pointer hover:border-orange-300 transition group relative">
                      <div className="flex justify-between items-start mb-2">
                        <span className="text-[10px] font-mono text-gray-400">{o.id}</span>
                        <span className="text-[10px] font-bold text-gray-500">{o.date}</span>
                      </div>
                      <p className="font-bold text-sm text-gray-800 mb-1">{o.customerName}</p>
                      <p className="text-xs text-gray-500 mb-1 line-clamp-1"><i className="fa-solid fa-phone mr-1"></i>{o.phone}</p>
                      <div className="bg-gray-50 p-2 rounded mb-3 max-h-20 overflow-y-auto text-xs text-gray-600">
                         {items.map((i,idx)=><div key={idx} className="flex justify-between border-b last:border-0 border-gray-200 pb-1 mb-1"><span>{i.name} <span className="text-[9px] text-gray-400">({i.color}/{i.size}) x{i.qty}</span></span><span>{formatMoney(i.price*i.qty)}</span></div>)}
                      </div>
                      {o.slipUrl && o.slipUrl !== 'mock' && (
                        <button onClick={()=>window.open(o.slipUrl)} className="text-[10px] bg-blue-50 text-blue-600 px-2 py-1 rounded font-bold mb-3 hover:bg-blue-100"><i className="fa-solid fa-image"></i> ดูสลิปโอนเงิน</button>
                      )}
                      <div className="flex justify-between items-center border-t pt-3 mt-2">
                        <p className="text-orange-600 font-black text-sm">{formatMoney(o.grandTotal)}</p>
                        <div className="flex gap-2">
                           {status === 'pending' && <button onClick={()=>{if(confirm('ยืนยันยกเลิกออเดอร์นี้? ลูกค้าจะสามารถติดตามสถานะเห็นได้ทันทีว่าถูกยกเลิก')) updateStatus(o.id, 'cancelled')}} className="text-[10px] bg-red-100 text-red-600 px-2 py-1.5 rounded-lg font-bold hover:bg-red-200">ยกเลิก</button>}
                           {actionBtn && actionBtn(o.id)}
                        </div>
                      </div>
                    </div>
                  );
               })}
               {db.orders.filter(o=>o.status===status).length === 0 && <p className="text-xs text-center text-gray-400 py-10">ไม่มีรายการ</p>}
            </div>
          </div>
        );

        return (
          <div className="fade-in h-[calc(100vh-140px)] flex gap-6 overflow-x-auto pb-4">
             {renderCol('pending', 'รอตรวจสอบสลิป', 'bg-yellow-100 text-yellow-800', 'fa-receipt', (id) => <button onClick={()=>updateStatus(id, 'preparing')} className="text-[10px] bg-blue-500 text-white px-3 py-1.5 rounded-lg font-bold hover:bg-blue-600">รับออเดอร์</button>)}
             {renderCol('preparing', 'กำลังจัดเตรียมพัสดุ', 'bg-blue-100 text-blue-800', 'fa-box', (id) => <button onClick={()=>{const track = prompt("กรอกเลขพัสดุ (ถ้ามี)"); updateStatus(id, 'shipped');}} className="text-[10px] bg-green-500 text-white px-3 py-1.5 rounded-lg font-bold hover:bg-green-600">จัดส่งแล้ว</button>)}
             {renderCol('shipped', 'จัดส่งสำเร็จ', 'bg-green-100 text-green-800', 'fa-check-circle', null)}
             {renderCol('cancelled', 'ยกเลิกแล้ว', 'bg-red-100 text-red-800', 'fa-times-circle', null)}
          </div>
        );
    };

    const AdminInventory = ({ db, onSync, onAddProduct, onEditProduct, filterOnlineOnly }) => {
      const [search, setSearch] = useState('');
      const [catFilter, setCatFilter] = useState('all');
      const [stockFilter, setStockFilter] = useState('all'); 
      const [selected, setSelected] = useState([]);

      let baseProducts = db.products;
      if (filterOnlineOnly) {
         baseProducts = baseProducts.filter(p => p.visibility === 'online');
      }

      const groupedFiltered = useMemo(() => {
        const groups = {};
        baseProducts.filter(p => {
           const mSearch = search.toLowerCase();
           const mNameId = (p.name||'').toLowerCase().includes(mSearch) || (p.id||'').toLowerCase().includes(mSearch) || (p.color||'').toLowerCase().includes(mSearch) || (p.size||'').toLowerCase().includes(mSearch);
           const mCat = catFilter === 'all' || p.category === catFilter;
           const mStock = stockFilter === 'all' || (stockFilter === 'low' ? p.stock < 8 : true);
           return mNameId && mCat && mStock;
        }).forEach(p => {
           const groupKey = p.name.trim();
           if(!groups[groupKey]) {
              groups[groupKey] = { ...p, totalStock: 0, colors: new Set(), sizes: new Set(), items: [] };
           }
           groups[groupKey].totalStock += Number(p.stock);
           if(p.color && p.color !== '-') groups[groupKey].colors.add(p.color);
           if(p.size && p.size !== '-') groups[groupKey].sizes.add(p.size);
           groups[groupKey].items.push(p);
        });
        return Object.values(groups);
      }, [baseProducts, search, catFilter, stockFilter]);

      const handleDelete = () => {
        if(selected.length === 0) return alert('กรุณาเลือกรายการที่ต้องการลบ');
        if(confirm(`ยืนยันการลบกลุ่มสินค้าที่เลือกอย่างถาวร (รวมทุกสี/ไซส์ในกลุ่ม)?`)) {
          const idsToDelete = [];
          groupedFiltered.filter(g => selected.includes(g.name)).forEach(g => {
             g.items.forEach(i => idsToDelete.push(i.id));
          });
          
          if (onSync) onSync(idsToDelete, 'products', 'delete');
          if(typeof google !== 'undefined') google.script.run.withSuccessHandler(()=>{}).deleteItem('PRODUCTS', idsToDelete);
          setSelected([]);
        }
      };

      return (
        <div className="fade-in bg-white rounded-3xl shadow-sm border overflow-hidden">
           <div className="p-6 border-b flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-slate-50">
             <div>
               <h3 className="font-black text-xl text-gray-800"><i className={`fa-solid ${filterOnlineOnly ? 'fa-globe text-blue-500' : 'fa-boxes-stacked text-orange-500'} mr-2`}></i>{filterOnlineOnly ? 'จัดการสินค้าออนไลน์' : 'สต็อกสินค้าทั้งหมด'}</h3>

    const AdminOnlineStore = ({ db, onSync, onEditProduct }) => {
      const [showAddModal, setShowAddModal] = useState(false);

      const [modalCat, setModalCat] = useState('all');

      const onlineProducts = db.products.filter(p => p.status === 'active' && p.visibility === 'online');
      const offlineProducts = db.products.filter(p => p.status === 'active' && p.visibility !== 'online');

      const [searchOnline, setSearchOnline] = useState('');
      const [catOnline, setCatOnline] = useState('all');

      const groupedOnline = useMemo(() => {
        const groups = {};
        onlineProducts.filter(p => {
           const mSearch = searchOnline.toLowerCase();
           const matchSearch = p.name.toLowerCase().includes(mSearch) || p.id.toLowerCase().includes(mSearch);
           const matchCat = catOnline === 'all' || p.category === catOnline;
           return matchSearch && matchCat;
        }).forEach(p => {
           const key = p.name.trim();
           if(!groups[key]) groups[key] = { ...p, items: [] };
           groups[key].items.push(p);
        });
        return Object.values(groups);
      }, [onlineProducts, searchOnline, catOnline]);

      const groupedOffline = useMemo(() => {
        const groups = {};
        offlineProducts.filter(p => {
           const mSearch = modalSearch.toLowerCase();
           const matchSearch = p.name.toLowerCase().includes(mSearch) || p.id.toLowerCase().includes(mSearch);
           const matchCat = modalCat === 'all' || p.category === modalCat;
           return matchSearch && matchCat;
        }).forEach(p => {
           const key = p.name.trim();
           if(!groups[key]) groups[key] = { ...p, items: [] };
           groups[key].items.push(p);
        });
        return Object.values(groups);

        groupItems.forEach(product => {
           const updated = { ...product, visibility: 'online' };

                  <div className="p-4 flex flex-col flex-1">
                    <p className="text-[10px] font-bold text-orange-500 mb-0.5">{g.category}</p>
                    <p className="text-sm font-bold text-gray-800 line-clamp-2 leading-tight mb-1">{g.name}</p>
                    <p className="text-xs text-gray-400 mb-3">{g.items.length} ตัวเลือก</p>
                    <div className="mt-auto flex justify-between items-center">
                      <p className="text-orange-600 font-black text-lg">{formatMoney(g.price)}</p>

            {groupedOnline.length === 0 && <div className="col-span-full text-center py-20 text-gray-400 font-bold bg-white rounded-3xl border border-dashed">ไม่พบสินค้าในหมวดหมู่ที่ค้นหา</div>}

              <div className="space-y-3 max-h-96 overflow-y-auto">
                <p className="text-xs font-bold text-gray-500 mb-2">แสดงเฉพาะสินค้าในสต็อกที่ยังไม่แสดงบนเว็บ</p>
                <div className="flex gap-2 mb-4">
                    <div className="relative flex-1">
                      <i className="fa-solid fa-search absolute left-3 top-3 text-gray-400 text-sm"></i>
                      <input type="text" placeholder="ค้นหาสินค้าจากสต็อก..." className="border p-2.5 pl-9 rounded-xl text-sm w-full outline-none focus:ring-2 focus:ring-orange-500" value={modalSearch} onChange={e=>setModalSearch(e.target.value)} />
                    </div>
                    <select className="border p-2.5 rounded-xl text-sm outline-none focus:ring-2 focus:ring-orange-500" value={modalCat} onChange={e=>setModalCat(e.target.value)}>
                        <option value="all">ทุกหมวดหมู่</option>
                        {PRODUCT_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                    </select>
                </div>
                {groupedOffline.map(g => {
                   const firstImg = parseFilesInfo(g.imgUrl).images[0] || 'https://placehold.co/40x40?text=IMG';
                   return (
                     <div key={g.name} className="flex items-center gap-3 p-3 border rounded-xl hover:bg-orange-50 transition border-gray-100">
                       <img src={firstImg} className="w-12 h-12 rounded-lg object-cover" onError={(e) => { e.target.src = 'https://placehold.co/400x400?text=No+Image'; }} />
                       <div className="flex-1">
                         <p className="font-bold text-sm text-gray-800">{g.name}</p>
                         <p className="text-[10px] text-gray-500">หมวด: {g.category} | {g.items.length} ตัวเลือกย่อย</p>
                       </div>
                       <button onClick={() => handlePublish(g.items)} className="bg-green-500 text-white px-4 py-2 rounded-lg text-xs font-bold hover:bg-green-600 shadow-sm transition">
                         นำขึ้นขายทั้งหมด
                       </button>

              </div>
            </Modal>

             <div className="p-5 border-b border-slate-800 bg-slate-800/50">
               <p className="text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1">ยินดีต้อนรับ</p>
               <p className="text-white font-bold truncate">{user?.name}</p><p className="text-xs text-orange-400 uppercase mt-0.5">{user?.role}</p>
             </div>
             <nav className="flex-1 p-4 space-y-1.5 overflow-y-auto hide-scrollbar">
               <NavItem icon="fa-chart-pie" label="Dashboard ภาพรวม" active={view==='dashboard'} onClick={()=>navTo('dashboard')} />
               <NavItem icon="fa-calculator" label="บัญชีและรายได้" active={view==='revenue'} onClick={()=>navTo('revenue')} />
               <NavItem icon="fa-cash-register" label="POS หน้าร้าน" active={view==='pos'} onClick={()=>navTo('pos')} />
               <NavItem icon="fa-truck-fast" label="ออเดอร์ออนไลน์" active={view==='orders'} onClick={()=>navTo('orders')} />
               <NavItem icon="fa-boxes-stacked" label="คลังสต็อกทั้งหมด" active={view==='inventory'} onClick={()=>navTo('inventory')} />
               <NavItem icon="fa-globe" label="จัดการสินค้าออนไลน์" active={view==='online_store'} onClick={()=>navTo('online_store')} />
               <NavItem icon="fa-users" label="จัดการข้อมูลลูกค้า" active={view==='customers'} onClick={()=>navTo('customers')} />
               <NavItem icon="fa-users-gear" label="จัดการพนักงาน" active={view==='users'} onClick={()=>navTo('users')} />
             </nav>
             <div className="p-4 border-t border-slate-800"><button onClick={onLogout} className="w-full flex items-center justify-center px-4 py-2.5 rounded-xl text-sm font-bold text-red-400 hover:bg-red-500/10 transition border border-slate-700 hover:border-red-500/20"><i className="fa-solid fa-right-from-bracket mr-2"></i> ออกสู่หน้าร้านสาธารณะ</button></div>
          </aside>

          <main className="flex-1 overflow-y-auto relative flex flex-col min-w-0">
            <header className="h-16 bg-white shadow-sm border-b flex items-center justify-between px-4 md:px-8 z-10 shrink-0 sticky top-0">
               <div className="flex items-center gap-3">
                 <button onClick={() => setIsMobileMenuOpen(true)} className="md:hidden text-gray-600 hover:text-orange-500"><i className="fa-solid fa-bars text-xl"></i></button>
                 <h2 className="text-lg md:text-xl font-bold text-gray-800 truncate">
                    {view === 'dashboard' && 'ภาพรวมธุรกิจ'} {view === 'revenue' && 'บัญชีและสถิติรายได้'} {view === 'pos' && 'ระบบขายหน้าร้าน'}
                    {view === 'orders' && 'จัดการออเดอร์ออนไลน์'} {view === 'inventory' && 'จัดการสต็อกรวม'}
                    {view === 'online_store' && 'สินค้าที่แสดงหน้าร้านเว็บ'} {view === 'users' && 'จัดการบุคลากร'}
                    {view === 'customers' && 'จัดการข้อมูลลูกค้า (CRM)'}
                 </h2>
               </div>
               <button onClick={onLogout} className="hidden md:flex items-center bg-gray-100 text-gray-600 px-3 py-1.5 rounded-lg font-bold text-xs"><i className="fa-solid fa-arrow-left mr-2"></i> หน้าร้าน</button>
            </header>
            
            <div className="p-4 md:p-6 lg:p-8 max-w-7xl mx-auto w-full">
               {view === 'dashboard' && <AdminDashboard db={db} />}
               {view === 'revenue' && <AdminRevenue db={db} onSync={onSync} />}
               {view === 'orders' && <AdminOrderKanban db={db} onSync={onSync} />}
               {view === 'pos' && <POSSystem user={user} db={db} onSync={onSync} />}
               {view === 'inventory' && <AdminInventory db={db} onSync={onSync} onAddProduct={()=>setEditingProduct([])} onEditProduct={setEditingProduct} filterOnlineOnly={false} />}
               {view === 'online_store' && <AdminOnlineStore db={db} onSync={onSync} onEditProduct={setEditingProduct} />}
               {view === 'users' && <AdminUsers db={db} onSync={onSync} />}
               {view === 'customers' && <AdminCustomers db={db} onSync={onSync} />}
            </div>
            
            {editingProduct && <ProductModal productGroup={editingProduct} onClose={()=>setEditingProduct(null)} onSync={onSync} />}
          </main>
        </div>
      );
    };

    // ==========================================
    // 9. MAIN APP ROUTER (State Manager)
    // ==========================================
    const App = () => {
      const [db, setDb] = useState(mockDb);
      const [route, setRoute] = useState('store');
      const [user, setUser] = useState(null);

      const refreshData = () => {
        if(typeof google !== 'undefined' && google.script) {
          google.script.run.withSuccessHandler(d => {if(d && !d.error) setDb(d)}).getInitialData();
        }
      };
      useEffect(() => { refreshData(); }, []);

      const handleOptimisticSync = (data, type, action) => {
        setDb(prev => {
            const newState = { ...prev };
            if (!newState[type]) newState[type] = [];
            
            if (action === 'add') {
               newState[type] = [data, ...newState[type]];
            } 
            else if (action === 'add_multiple') {
               newState[type] = [...data, ...newState[type]];
            }
            else if (action === 'update') {
               newState[type] = newState[type].map(item => (item.id === data.id || (item.username && item.username === data.username)) ? { ...item, ...data } : item);
            } 
            else if (action === 'replace_multiple') {
               const idsToRemove = data.removeIds || [];
               const itemsToAdd = data.newItems || [];
               newState[type] = newState[type].filter(i => !idsToRemove.includes(i.id));
               newState[type] = [...itemsToAdd, ...newState[type]];
            }
            else if (action === 'delete') {
               if (Array.isArray(data)) {
                  newState[type] = newState[type].filter(item => !(data.includes(item.id) || (item.username && data.includes(item.username))));
               } else {
                  newState[type] = newState[type].filter(item => item.id !== data && item.username !== data);
               }
            }
            else if (action === 'partial_void') {
               const { updatedTx, returnedItem, isFullVoid } = data;
               const isOnline = updatedTx.id.startsWith('ORD');
               const listName = isOnline ? 'orders' : 'sales';
               
               if(newState[listName]) {
                  newState[listName] = newState[listName].map(item => item.id === updatedTx.id ? { ...item, ...updatedTx } : item);
               }

               if(newState.products && returnedItem) {
                   newState.products = newState.products.map(p => {
                       if(p.id === returnedItem.id) {
                           return { ...p, stock: Number(p.stock) + Number(returnedItem.returnQty) };
                       }
                       return p;
                   });
               }
            }
            else if (action === 'full_void') {
               const { updatedTx, returnedItems } = data;
               const isOnline = updatedTx.id.startsWith('ORD');
               const listName = isOnline ? 'orders' : 'sales';
               
               if(newState[listName]) {
                  newState[listName] = newState[listName].map(item => item.id === updatedTx.id ? { ...item, status: 'cancelled' } : item);
               }

               if(newState.products && returnedItems) {
                   const restoreMap = {};
                   returnedItems.forEach(i => {
                       restoreMap[i.id] = (restoreMap[i.id] || 0) + Number(i.qty || i.cartQty || 1);
                   });
                   newState.products = newState.products.map(p => {
                       if(restoreMap[p.id]) {
                           return { ...p, stock: Number(p.stock) + restoreMap[p.id] };
                       }
                       return p;
                   });
               }
            }
            return newState;
        });
      };

      const handleLogin = (u) => {
        setUser(u);
        const safeRole = u.role ? u.role.toLowerCase() : '';
        if(safeRole === 'admin') setRoute('admin');
        else if(safeRole === 'employee' || safeRole === 'staff') setRoute('employee');
        else setRoute('store');
      };

      if (route === 'store') return <StoreFront db={db} onSwitchToAdmin={()=>setRoute('admin_login')} onSync={handleOptimisticSync} />;
      if (route === 'admin_login') return <LoginModal onClose={()=>setRoute('store')} onLogin={handleLogin} />;
      if (route === 'admin') return <AdminApp user={user} db={db} onLogout={()=>setRoute('store')} onSync={handleOptimisticSync} />;
      if (route === 'employee') return <EmployeeApp user={user} db={db} onLogout={()=>setRoute('store')} onSync={handleOptimisticSync} />;
      
      return null;
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
