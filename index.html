                        else if(typeof url === 'string' && url.lastIndexOf('/') > -1) fileName = url.substring(url.lastIndexOf('/')+1).substring(0,20); 
                        else if(typeof url === 'object' && url.name) { fileName = url.name; url = url.url; } 
                        return ( 
                            <div key={`exist-doc-${idx}`} className="flex items-center justify-between bg-gray-50 border p-3 rounded-xl shadow-sm hover:shadow transition">
                                <div className="flex items-center gap-3 overflow-hidden">
                                    <i className={`fa-solid ${getFileIcon(url)} text-2xl`}></i>
                                    <div><p className="text-xs font-bold text-gray-800 truncate">{fileName}</p></div>
                                </div>
                                <div className="flex gap-2">
                                    <button type="button" onClick={() => setPreviewDoc(url)} className="bg-blue-100 text-blue-700 w-8 h-8 rounded-full flex items-center justify-center hover:bg-blue-600 hover:text-white transition cursor-pointer touch-friendly"><i className="fa-solid fa-download"></i></button>
                                    {isEditMode && <button type="button" onClick={() => handleRemoveExistingDoc(idx)} className="bg-red-100 text-red-600 w-8 h-8 rounded-full flex items-center justify-center hover:bg-red-600 hover:text-white transition cursor-pointer touch-friendly"><i className="fa-solid fa-trash-can"></i></button>}
                                </div>
                            </div>

                    </div>
                    {isEditMode && <div className="bg-red-50/50 p-5 rounded-2xl border border-dashed border-red-200"><AdvancedFileUploader label="อัปโหลดเอกสารใหม่" accept=".pdf,.doc,.xlsx" multiple maxFiles={10} onChange={setNewDocs} disabled={isSubmitting} showPopup={showPopup} /></div>}
                  </div> 
                )}

                <div className="bg-white p-5 md:p-8 rounded-2xl border border-gray-100 shadow-sm flex flex-col">
                  <h4 className="text-sm font-black text-gray-800 border-b pb-3 mb-4"><i className="fa-solid fa-comments text-indigo-500 mr-2"></i>ช่องสนทนา / สอบถามข้อมูล</h4>
                  <div className="flex-1 max-h-80 overflow-y-auto space-y-4 pr-2 custom-scrollbar mb-5 bg-slate-50/50 p-4 rounded-xl border border-gray-100">
                    {existingComments.length === 0 && <p className="text-center text-xs text-gray-400 font-medium my-10">ยังไม่มีข้อความสนทนา เริ่มพิมพ์เพื่อพูดคุยได้เลย</p>}
                    {existingComments.map((msg, i) => { 
                      const isMe = msg.senderRole === user.role || (msg.senderRole === 'user' && user.role === 'user'); 
                      return ( 
                        <div key={i} className={`flex flex-col ${isMe ? 'items-end' : 'items-start'}`}>
                            <span className="text-[10px] text-gray-400 font-bold mb-1 ml-1 mr-1">{msg.senderName} ({msg.senderRole}) • {new Date(msg.timestamp).toLocaleString('th-TH').substring(0,16)}</span>
                            <div className={`px-4 py-2.5 rounded-2xl max-w-[85%] text-sm shadow-sm whitespace-pre-wrap break-words leading-relaxed ${isMe ? 'bg-indigo-600 text-white rounded-tr-sm' : 'bg-white text-gray-800 rounded-tl-sm border'}`}>{msg.text}</div>

                      );

                    <input type="text" value={chatMessage} onChange={e=>setChatMessage(e.target.value)} onKeyDown={e=>e.key==='Enter' && handleSendChat()} placeholder="พิมพ์ข้อความสอบถามหรืออัปเดตงานที่นี่..." disabled={isSubmitting || isSendingChat} className="flex-1 border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 disabled:bg-gray-100 shadow-sm" />
                    <button onClick={handleSendChat} disabled={!chatMessage.trim() || isSubmitting || isSendingChat} className="bg-indigo-600 hover:bg-indigo-700 disabled:bg-gray-300 disabled:cursor-not-allowed text-white w-14 rounded-xl flex items-center justify-center transition shadow-md touch-friendly active:scale-95">
                      {isSendingChat ? <i className="fa-solid fa-circle-notch fa-spin text-lg"></i> : <i className="fa-solid fa-paper-plane text-lg"></i>}
                    </button>
                  </div>
                </div>
              </div>
            </div>
            
            <div className="bg-white p-4 md:p-5 flex flex-wrap justify-between items-center shrink-0 border-t z-10 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] gap-4">
              {(!isEditMode && canDelete && type !== 'cctv') ? ( 
                <button onClick={() => showConfirm('ยืนยันการลบข้อมูลถาวร/ยกเลิกรายการ?', confirmDeleteAction)} className="px-4 py-2.5 bg-red-50 text-red-600 rounded-xl font-bold hover:bg-red-100 border border-red-100 transition text-sm flex items-center touch-friendly"><i className="fa-solid fa-trash-can mr-2"></i> <span className="hidden sm:inline">ลบ/ยกเลิกรายการ</span></button> 
              ) : (!isEditMode && isAdmin && type === 'cctv') ? (
                <button onClick={() => showConfirm('ยืนยันการลบกล้องถาวร?', confirmDeleteAction)} className="px-4 py-2.5 bg-red-50 text-red-600 rounded-xl font-bold hover:bg-red-100 border border-red-100 transition text-sm flex items-center touch-friendly"><i className="fa-solid fa-trash-can mr-2"></i> <span className="hidden sm:inline">ลบกล้อง</span></button>
              ) : <div className="hidden sm:block"></div>}
              
              <div className="flex gap-3 w-full sm:w-auto justify-end">
                {!isEditMode && <button onClick={onClose} className="px-6 py-3 bg-slate-800 text-white rounded-xl font-bold shadow-md hover:bg-slate-700 text-sm transition flex-1 sm:flex-none justify-center touch-friendly active:scale-95">ปิดหน้าต่าง</button>}
                {isEditMode && ( <button onClick={handleSaveEdit} disabled={isSubmitting} className={`px-6 sm:px-8 py-3 text-white rounded-xl font-bold shadow-lg transition text-sm flex flex-1 sm:flex-none justify-center items-center touch-friendly active:scale-95 ${isSubmitting ? 'bg-indigo-400 cursor-not-allowed' : 'bg-indigo-600 hover:bg-indigo-700'}`}>บันทึกข้อมูลที่แก้ไข</button> )}
              </div>
            </div>
          </div>
          <OfficialReport />
          {previewData && <ImagePreviewModal images={previewData.images} initialIndex={previewData.index} onClose={() => setPreviewData(null)} />}
          {previewDoc && <DocumentPreviewModal url={previewDoc} onClose={() => setPreviewDoc(null)} />}
        </div>
      );
    };

    // ==========================================
    // 6. FORM MODALS
    // ==========================================
    const AddUserModal = ({ userRole, onClose, onSave, showPopup, db }) => {
      const [f, setF] = useState({ name: '', username: '', password: '', role: 'user', permissions: [] }); 
      const [isSubmitting, setIsSubmitting] = useState(false); 
      const handleToggle = (val) => setF(prev => ({ ...prev, permissions: prev.permissions.includes(val) ? prev.permissions.filter(p => p !== val) : [...prev.permissions, val] }));
      
      const save = (e) => { 
        e.preventDefault(); if (isSubmitting) return; 
        if (f.permissions.length === 0 && f.role === 'user') return showPopup('error', 'กรุณาเลือกสิทธิ์อย่างน้อย 1 รายการ'); 
        setIsSubmitting(true); 
        let finalPerms = f.permissions; 
        if (['admin', 'superadmin'].includes(f.role)) finalPerms = ['all']; 
        if (f.role === 'employee') finalPerms = ['repairs', 'claims', 'borrows', 'installations', 'inventory'];
        
        const payload = { id: generateFrontendId('USR'), status: 'active', ...f, permissions: finalPerms };
        
        if (typeof google !== 'undefined' && google.script?.run?.registerAdminAddedUser) { 
            google.script.run.withSuccessHandler(() => { onSave(payload, 'users', 'add'); setIsSubmitting(false); showPopup('success', 'เพิ่มผู้ใช้งานเข้าระบบสำเร็จ'); onClose(); }).withFailureHandler((err) => { setIsSubmitting(false); showPopup('error', err.message); }).registerAdminAddedUser(payload); 
        } else { onSave(payload, 'users', 'add'); setIsSubmitting(false); showPopup('success', 'เพิ่มผู้ใช้งานสำเร็จ (Mock)'); onClose(); }
      };
      
      return (
        <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-[100] p-4 fade-in backdrop-blur-sm">
            <form onSubmit={save} className="bg-white rounded-3xl w-full max-w-md overflow-hidden shadow-2xl flex flex-col max-h-[90vh] relative">
                {isSubmitting && <ProcessingOverlay />}
                <div className="p-5 md:p-6 border-b flex justify-between items-center bg-indigo-600 text-white shrink-0"><h3 className="font-bold text-lg md:text-xl"><i className="fa-solid fa-user-plus mr-2"></i>เพิ่มผู้ใช้งานใหม่</h3><button type="button" onClick={onClose} disabled={isSubmitting} className="hover:text-indigo-200 touch-friendly"><i className="fa-solid fa-times text-xl"></i></button></div>
                <div className="p-5 md:p-6 space-y-4 overflow-y-auto custom-scrollbar">
                    <InputField label="ชื่อ-นามสกุล" required onChange={e=>setF({...f, name: e.target.value})}/>
                    <InputField label="Username (Email)" required onChange={e=>setF({...f, username: e.target.value})}/>
                    <InputField label="Password" type="password" required onChange={e=>setF({...f, password: e.target.value})}/>
                    <div>
                        <label className="block text-xs font-bold mb-1.5 text-gray-600">ระดับสิทธิ์ (Role)</label>
                        <select className="w-full border p-2.5 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500 bg-white shadow-sm" onChange={e=>setF({...f, role: e.target.value, permissions: []})}>
                            <option value="user">ผู้ใช้งานทั่วไป (User)</option>
                            <option value="employee">พนักงาน (Employee)</option>
                            <option value="admin">ผู้ดูแลระบบ (Admin)</option>
                            {userRole === 'superadmin' && <option value="superadmin">Super Admin</option>}
                        </select>
                    </div>
                    {f.role === 'user' && ( 
                        <div className="pt-2 border-t border-gray-100">
                            <label className="block text-sm font-bold mb-3 text-gray-800">สิทธิ์ย่อยที่อนุญาต (เฉพาะ User) <span className="text-red-500">*</span></label>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                {[{id:'repairs', label:'ระบบแจ้งซ่อม'}, {id:'claims', label:'เคลมสินค้า'}, {id:'borrows', label:'ยืม-คืนอุปกรณ์'}, {id:'installations', label:'งานติดตั้ง'}].map(item => ( 
                                    <label key={item.id} className="flex items-center gap-2 p-2 bg-gray-50 border rounded-lg cursor-pointer transition hover:bg-gray-100 touch-friendly"><input type="checkbox" onChange={()=>handleToggle(item.id)} className="w-4 h-4 accent-indigo-600"/><span className="text-sm font-medium">{item.label}</span></label> 
                                ))}
                            </div>
                        </div> 
                    )}
                </div>
                <div className="bg-gray-50 p-4 md:p-5 border-t flex justify-end gap-3 shrink-0"><button type="button" onClick={onClose} disabled={isSubmitting} className="px-5 py-2.5 bg-white border rounded-xl font-bold text-gray-600 text-sm shadow-sm touch-friendly active:scale-95">ยกเลิก</button><button type="submit" disabled={isSubmitting} className={`px-6 py-2.5 bg-indigo-600 text-white rounded-xl font-bold shadow-md hover:bg-indigo-700 touch-friendly active:scale-95`}>บันทึกข้อมูล</button></div>
            </form>
        </div>
      );
    };

    const AddCameraModal = ({ db, onClose, onSave, showPopup }) => {
      const [images, setImages] = useState([]); 
      const [docs, setDocs] = useState([]); 
      const [assignee, setAssignee] = useState(''); 
      const [isSubmitting, setIsSubmitting] = useState(false); 
      const employees = (db?.users || []).filter(u => u.role === 'employee');

      const handleNameBlur = async (e) => {
        const query = e.target.value; if(!query || query.length < 3) return;
        try { 
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query+ ' Thailand')}`); 
            const data = await res.json();
            if(data && data.length > 0) { document.querySelector('input[name="lat"]').value = data[0].lat; document.querySelector('input[name="lng"]').value = data[0].lon; }
        } catch(err) { console.error('Geocoding failed', err); }
      };

      const save = async (e) => { 
        e.preventDefault(); if (isSubmitting) return; setIsSubmitting(true); 
        try {
          const form = new FormData(e.target); 
          
          // บีบอัดไฟล์แบบ Parallel พร้อมกัน
          const [allBase64, docBase64] = await Promise.all([
              Promise.all(images.map(img => toBase64(img))),
              Promise.all(docs.map(doc => toBase64(doc)))
          ]);
          
          const formData = { id: generateFrontendId('CAM'), name: form.get('name'), lat: form.get('lat'), lng: form.get('lng'), status: form.get('status'), streamUrl: form.get('streamUrl'), assignee: assignee, imgUrl: allBase64.length > 0 ? JSON.stringify(allBase64) : '', attachedFile: docBase64.length > 0 ? JSON.stringify(docBase64) : '' }; 
          
          if (typeof google !== 'undefined' && google.script?.run?.addCamera) { 
            google.script.run.withSuccessHandler(()=>{ if(onSave) onSave(formData, 'cctv', 'add'); setIsSubmitting(false); showPopup('success', 'ลงทะเบียนกล้องใหม่สำเร็จ'); onClose(); }).withFailureHandler((err) => { setIsSubmitting(false); showPopup('error', err.message); }).addCamera(formData); 
          } else { if(onSave) onSave(formData, 'cctv', 'add'); setIsSubmitting(false); showPopup('success', 'ลงทะเบียนกล้องสำเร็จ (Mock)'); onClose(); } 
        } catch (err) { showPopup('error', err.message); setIsSubmitting(false); }
      };

      return (
        <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-[100] p-4 fade-in backdrop-blur-sm">
            <form onSubmit={save} className="bg-white rounded-3xl w-full max-w-xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh] relative">
                {isSubmitting && <ProcessingOverlay />}
                <div className="p-5 border-b flex justify-between items-center bg-blue-600 text-white shrink-0"><h3 className="font-bold text-lg"><i className="fa-solid fa-video mr-2"></i>ลงทะเบียนกล้องใหม่</h3><button type="button" onClick={onClose} disabled={isSubmitting} className="hover:text-blue-200 touch-friendly"><i className="fa-solid fa-times text-xl"></i></button></div>

                <div className="bg-gray-50 p-4 md:p-5 flex justify-end gap-3 shrink-0 border-t"><button type="button" onClick={onClose} disabled={isSubmitting} className="px-5 py-2.5 bg-white border rounded-xl font-bold text-gray-600 text-sm shadow-sm hover:bg-gray-100 touch-friendly active:scale-95">ยกเลิก</button><button type="submit" disabled={isSubmitting} className={`px-6 py-2.5 bg-purple-600 text-white rounded-xl font-bold text-sm shadow-md hover:bg-purple-700 touch-friendly active:scale-95`}>ส่งเคลม</button></div>
            </form>
        </div>
      );
    };

    const AddBorrowModal = ({ user, db, onClose, onSave, showPopup }) => {
      const [images, setImages] = useState([]); const [docs, setDocs] = useState([]); const [isSubmitting, setIsSubmitting] = useState(false); const [assignee, setAssignee] = useState(''); const isAdmin = ['admin', 'superadmin'].includes(user?.role); const employees = (db?.users || []).filter(u => u.role === 'employee');
      const save = async (e) => { 
        e.preventDefault(); if (isSubmitting) return; setIsSubmitting(true); 
        try { 
            const form = new FormData(e.target); 
            
            const allBase64 = [];
            for(let i=0; i<images.length; i++) allBase64.push(await toBase64(images[i]));
            const docBase64 = [];
            for(let i=0; i<docs.length; i++) docBase64.push(await toBase64(docs[i]));
            
            const formData = { id: generateFrontendId('BRW'), username: user?.username, adminName: form.get('adminName'), adminNote: form.get('adminNote'), phone: form.get('phone'), borrowName: form.get('borrowName'), itemName: form.get('itemName'), category: form.get('category'), borrowDate: form.get('borrowDate'), returnDate: form.get('returnDate'), reason: form.get('reason'), assignee: assignee, imgUrl: allBase64.length > 0 ? JSON.stringify(allBase64) : '', attachedFile: docBase64.length > 0 ? JSON.stringify(docBase64) : '', status: 'Brw_Pending', createdAt: new Date().toISOString() }; 
            if (typeof google !== 'undefined' && google.script?.run?.addBorrow) { google.script.run.withSuccessHandler(()=>{ onSave(formData, 'borrows', 'add'); setIsSubmitting(false); showPopup('success', 'สำเร็จ'); onClose(); }).withFailureHandler((err)=>{ setIsSubmitting(false); showPopup('error', err.message); }).addBorrow(formData); } 
            else { onSave(formData, 'borrows', 'add'); setIsSubmitting(false); showPopup('success', 'สำเร็จ (Mock)'); onClose(); } 
        } catch(err) { showPopup('error', err.message); setIsSubmitting(false); } 
      };
      return (
        <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-[100] p-4 fade-in backdrop-blur-sm">
            <form onSubmit={save} className="bg-white rounded-3xl w-full max-w-xl overflow-hidden shadow-2xl flex flex-col max-h-[95vh] relative">
                {isSubmitting && <ProcessingOverlay />}
                <div className="bg-indigo-600 p-4 md:p-5 text-white flex justify-between items-center shrink-0"><h3 className="font-bold text-lg"><i className="fa-solid fa-handshake mr-2"></i>แบบฟอร์มขอยืมอุปกรณ์</h3><button type="button" onClick={onClose} disabled={isSubmitting} className="hover:text-indigo-200 touch-friendly"><i className="fa-solid fa-times text-xl"></i></button></div>
                <div className="p-4 md:p-6 grid grid-cols-1 lg:grid-cols-2 gap-x-6 gap-y-4 overflow-y-auto custom-scrollbar">
                    <InputField label="1. ชื่อผู้ยืม" name="adminName" defaultValue={user?.name || ''} required />
                    <InputField label="2. หน่วยงาน" name="adminNote" required />
                    <InputField label="3. สิ่งที่ต้องการยืม" name="borrowName" required />
                    <InputField label="4. รุ่น/ประเภท" name="itemName" required />
                    <div><label className="block text-xs font-bold mb-1.5 text-gray-600">5. หมวดหมู่ประเภท</label><select name="category" className="w-full border p-2.5 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500 bg-white shadow-sm" required><option value="">-- เลือกหมวดหมู่ --</option>{deviceCategories.map(c => <option key={c} value={c}>{c}</option>)}</select></div>
                    <InputField label="6. เบอร์โทรติดต่อ" name="phone" required />
                    <InputField label="7. วันที่ยืม" type="date" name="borrowDate" required />
                    <InputField label="8. วันที่คืน" type="date" name="returnDate" required />
                    <div className="col-span-1 md:col-span-2"><InputField label="9. เหตุผล" type="textarea" name="reason" required rows="2" /></div>
                    {isAdmin && ( <div className="col-span-1 md:col-span-2 border-t pt-4 border-dashed border-indigo-200"><label className="block text-xs font-bold mb-1.5 text-indigo-700">มอบหมายพนักงานรับผิดชอบ</label><select value={assignee} onChange={e=>setAssignee(e.target.value)} className="w-full border p-2.5 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500 bg-indigo-50/30 border-indigo-200"><option value="">-- ยังไม่ระบุ --</option>{employees.map(emp => <option key={emp.username} value={emp.username}>{emp.name} ({emp.role})</option>)}</select></div> )}
                    <div className="col-span-1 md:col-span-2 border-t pt-4"><AdvancedFileUploader label="แนบรูปภาพอ้างอิง" accept="image/*" multiple maxFiles={50} onChange={setImages} disabled={isSubmitting} showPopup={showPopup} /></div>
                    <div className="col-span-1 md:col-span-2 border-t pt-4"><AdvancedFileUploader label="แนบเอกสารอ้างอิง" accept=".pdf,.doc,.docx,.xls,.xlsx" multiple maxFiles={10} onChange={setDocs} disabled={isSubmitting} showPopup={showPopup} /></div>
                </div>
                <div className="bg-gray-50 p-4 md:p-5 flex justify-end gap-3 shrink-0 border-t"><button type="button" onClick={onClose} disabled={isSubmitting} className="px-5 py-2.5 bg-white border rounded-xl font-bold text-gray-600 text-sm shadow-sm hover:bg-gray-100 touch-friendly active:scale-95">ยกเลิก</button><button type="submit" disabled={isSubmitting} className={`px-6 py-2.5 bg-indigo-600 text-white rounded-xl font-bold text-sm shadow-md hover:bg-indigo-700 touch-friendly active:scale-95`}>ส่งคำขอยืม</button></div>
            </form>
        </div>
      );
    };

    // ==========================================
    // 7. APP ROOT COMPONENT
    // ==========================================
    const App = () => {
      const [db, setDb] = useState({cctv: [],inventory: [],repairs: [],claims: [],borrows: [],installations: [],users: [],pendingUsers: [],notifications: []});
      const [route, setRoute] = useState('public'); 
      const [adminView, setAdminView] = useState('dashboard'); 
      const [currentView, setCurrentView] = useState('dashboard'); 
      const [showLogin, setShowLogin] = useState(false); 
      const [user, setUser] = useState(null); 
      const [modal, setModal] = useState(null); 
      const [selectedItem, setSelectedItem] = useState(null); 
      const [manageType, setManageType] = useState(null); 
      const [adminMenuOpen, setAdminMenuOpen] = useState(false); 
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false); 
      const [popupState, setPopupState] = useState(null); 
      const [confirmState, setConfirmState] = useState(null);

      window.latestDbForAutocomplete = db; 
      window.currentUserRole = user?.role;
      
      const showPopup = (type, message) => { setPopupState({ type, message }); };
      const closePopup = () => { setPopupState(null); };
      const showConfirmDialog = (message, onConfirm) => { 
          setConfirmState({ message, onConfirm: () => { onConfirm(); setConfirmState(null); }, onCancel: () => setConfirmState(null) }); 
      };

      const unreadNotifsCount = (db.notifications || []).filter(n => n.target === (user?.role === 'admin' || user?.role === 'superadmin' ? 'admin' : user?.username) && n.status === 'unread').length;

      const refreshData = () => {
        if (typeof google !== 'undefined' && google.script?.run?.getInitialData) {
          google.script.run.withSuccessHandler(data => { 
              if (data && !data.error) { 
                  setDb({ cctv: data.cctv || [], inventory: data.inventory || [], repairs: data.repairs || [], claims: data.claims || [], borrows: data.borrows || [], installations: data.installations || [], users: data.users || [], pendingUsers: data.pendingUsers || [], notifications: data.notifications || [] }); 
              } else { showPopup('error', 'ระบบขาดการตั้งค่า: ' + (data?.message || 'โปรดรัน SETUP_SYSTEM ใน Code.gs')); } 
          }).withFailureHandler(err => { showPopup('error', 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้: ' + err.message); }).getInitialData();
        } else { 
            console.warn("Mock mode"); 
            setDb(JSON.parse(JSON.stringify(mockDb))); 
        }
      };

      const lastSubmit = useRef({}); 
      const handleOptimisticSync = (data, type, action) => {
        if (!type) { refreshData(); return; }
        const dataStr = typeof data === 'object' ? JSON.stringify(data) : data;
        const actionKey = `${action}-${type}-${dataStr}`;
        const now = Date.now();
        if (lastSubmit.current[actionKey] && now - lastSubmit.current[actionKey] < 2000) return; 
        lastSubmit.current[actionKey] = now;

        setDb(prev => {
            const newState = { ...prev };
            if (!newState[type]) newState[type] = [];
            if (!newState.notifications) newState.notifications = [];

            const pushNotif = (target, message, relId, notifType) => {
                const notif = { id: generateFrontendId('NOTIF'), target, message, status: 'unread', type: notifType, relatedId: relId, createdAt: new Date().toISOString() };
                newState.notifications = [notif, ...newState.notifications];
                if (typeof google !== 'undefined' && google.script?.run?.addNotification) { try { google.script.run.addNotification(notif); } catch(e){} }
            };

            if (action === 'add') {
                const isDuplicate = newState[type].some(item => item.id === data.id);
                if (!isDuplicate) {
                   newState[type] = [data, ...newState[type]];
                   if (type !== 'users' && type !== 'cctv' && type !== 'notifications' && ['user', 'employee'].includes(user?.role)) {
                       const typeName = type === 'repairs' ? 'แจ้งซ่อม' : type === 'claims' ? 'เคลม' : type === 'borrows' ? 'ยืม-คืน' : type === 'installations' ? 'งานติดตั้ง' : 'รายการ';
                       pushNotif('admin', `มีรายการ${typeName}ใหม่จาก ${getSafeText(data.customerName || data.adminName || user?.name)} : ${data.problem || data.itemName || data.borrowName || data.project || ''}`, data.id, type);
                   }
                }
            } else if (action === 'update') {
                const oldItem = newState[type].find(item => item.id === data.id);
                newState[type] = newState[type].map(item => item.id === data.id ? { ...item, ...data } : item);
                if (['admin', 'superadmin', 'employee'].includes(user?.role) && data.username) {
                   if(oldItem && oldItem.status !== data.status && data.username !== user.username) {
                       pushNotif(data.username.trim(), `งาน ${data.id} ของคุณอัปเดตสถานะเป็น: ${statusConfig[data.status]?.label || data.status}`, data.id, 'status_update');
                   }
                }
                if (user?.role === 'user' && data.assignee) {
                   let oldComments = []; try { oldComments = JSON.parse(oldItem.comments||'[]'); }catch(e){}
                   let newComments = []; try { newComments = JSON.parse(data.comments||'[]'); }catch(e){}
                   if(newComments.length > oldComments.length) { 
                       pushNotif(data.assignee, `User ตอบกลับข้อความในใบงาน ${data.id}`, data.id, 'chat'); 
                       pushNotif('admin', `User ตอบกลับข้อความในใบงาน ${data.id}`, data.id, 'chat'); 
                   }
                }
                if (oldItem && oldItem.assignee !== data.assignee && data.assignee) {
                   pushNotif(data.assignee, `คุณได้รับมอบหมายงานใหม่ ID: ${data.id}`, data.id, 'assign');
                   if (data.username) pushNotif(data.username.trim(), `งาน ${data.id} มีพนักงานรับผิดชอบแล้ว`, data.id, 'status_update');
                }
            } else if (action === 'delete') {
                const idsToDelete = Array.isArray(data) ? data : [data];
                if (type === 'users' || type === 'pendingUsers') newState[type] = newState[type].filter(u => !idsToDelete.includes(u.username));
                else newState[type] = newState[type].filter(item => !idsToDelete.includes(item.id));
            } else if (action === 'approve_user') {
                newState.pendingUsers = (newState.pendingUsers || []).filter(u => u.username !== data.username);
                const existingIdx = (newState.users || []).findIndex(u => u.username === data.username);
                if (existingIdx > -1) newState.users[existingIdx] = { ...newState.users[existingIdx], ...data, status: 'active' };
                else newState.users = [...(newState.users || []), { ...data, status: 'active' }];
            } else if (action === 'mark_multiple_read') {
                const ids = Array.isArray(data) ? data : [data];
                newState.notifications = newState.notifications.map(n => ids.includes(n.id) ? { ...n, status: 'read' } : n);
            } else if (action === 'register') {
                if (!newState.pendingUsers?.some(x => x.username === data.username)) newState.pendingUsers = [...(newState.pendingUsers||[]), data];
            }
            if (typeof google === 'undefined') mockDb = newState;
            return newState;
        });
      };

      const handleTaskOpenFromSearch = (taskId) => {
         if(!taskId.trim()) return showPopup('error', 'กรุณากรอก ID งาน');
         const modules = ['repairs', 'installations', 'claims', 'borrows'];
         let found = false;
         for(let mod of modules) { 
             const t = (db[mod] || []).find(x => x.id.toUpperCase() === taskId.trim().toUpperCase()); 
             if(t) { setSelectedItem(t); setManageType(mod); found = true; break; } 
         }
         if(!found) showPopup('error', 'ไม่พบงาน ID นี้ในระบบ หรือคุณไม่มีสิทธิ์เข้าถึง');
      };

      const getModulePrefix = (id) => { 
          if (!id) return ''; 
          if (id.startsWith('REP')) return 'repairs'; 
          if (id.startsWith('CLM')) return 'claims'; 
          if (id.startsWith('BRW')) return 'borrows'; 
          if (id.startsWith('INS')) return 'installations'; 
          if (id.startsWith('INV')) return 'inventory'; 
          if (id.startsWith('USR')) return 'users'; 
          return ''; 
      };

      const autoReadNotificationsByView = (view) => {
        const viewToNotifTypeMap = { 'repairs': ['repair', 'repairs'], 'claims': ['claim', 'claims'], 'borrows': ['borrow', 'borrows'], 'installations': ['install', 'installations', 'installation'], 'inventory': ['inventory'], 'users': ['users', 'new_user', 'system'] };
        const typesToRead = viewToNotifTypeMap[view]; 
        if (!typesToRead) return;
        const targetLabel = user?.role === 'admin' || user?.role === 'superadmin' ? 'admin' : user?.username;
        const unreadIdsToMark = (db.notifications || []).filter(n => n.target === targetLabel && n.status === 'unread').filter(n => typesToRead.includes(n.type) || (n.type === 'status_update' && getModulePrefix(n.relatedId) === view)).map(n => n.id);
        if (unreadIdsToMark.length > 0) { 
            if (typeof google !== 'undefined' && google.script?.run?.markNotificationsRead) { 
                google.script.run.withSuccessHandler(()=>{ handleOptimisticSync(unreadIdsToMark, 'notifications', 'mark_multiple_read'); }).markNotificationsRead(unreadIdsToMark); 
            } else { handleOptimisticSync(unreadIdsToMark, 'notifications', 'mark_multiple_read'); } 
        }
      };

      const handleNotificationClick = (notif) => {
        if (notif.status === 'unread') { 
            if (typeof google !== 'undefined' && google.script?.run?.markNotificationsRead) { 
                google.script.run.withSuccessHandler(()=>{ handleOptimisticSync([notif.id], 'notifications', 'mark_multiple_read'); }).markNotificationsRead([notif.id]); 
            } else { handleOptimisticSync([notif.id], 'notifications', 'mark_multiple_read'); } 
        }
        let targetView = 'dashboard'; 
        let targetType = null;
        const t = String(notif.type || '').toLowerCase(); 
        const relId = String(notif.relatedId || '').toUpperCase();
        
        if (t.includes('repair') || relId.startsWith('REP')) { targetView = 'repairs'; targetType = 'repairs'; }
        else if (t.includes('claim') || relId.startsWith('CLM')) { targetView = 'claims'; targetType = 'claims'; }
        else if (t.includes('borrow') || relId.startsWith('BRW')) { targetView = 'borrows'; targetType = 'borrows'; }
        else if (t.includes('install') || relId.startsWith('INS')) { targetView = 'installations'; targetType = 'installations'; }
        else if (t.includes('inventory') || relId.startsWith('INV')) { targetView = 'inventory'; targetType = 'inventory'; }
        else if (t.includes('user') || relId.startsWith('USR')) { targetView = 'users'; targetType = 'users'; }
        
        if (['admin', 'superadmin'].includes(user?.role)) setAdminView(targetView); 
        else setCurrentView(targetView);

        if (relId && targetType && targetType !== 'users') {
           setTimeout(() => {
               const itemToOpen = (db[targetType] || []).find(x =>x.id === relId);
               if (itemToOpen) {
                   setSelectedItem(itemToOpen);
                   setManageType(targetType);
               }
           }, 150);
        }
      };

      useEffect(() => { 
          window.forceRefresh = refreshData; 
          refreshData(); 
          const autoRefresh = setInterval(() => { refreshData(); }, 60000); 
          return () => clearInterval(autoRefresh); 
      }, []);

      const handleLogin = (uData) => { 
          setUser(uData); setShowLogin(false); refreshData(); 
          if(['admin', 'superadmin'].includes(uData.role)) { setRoute('admin'); setAdminView('dashboard'); } 
          else { setRoute('user'); setCurrentView('dashboard'); } 
      };
      
      const handleLogout = () => { 
          setUser(null); setRoute('public'); setAdminView('dashboard'); setCurrentView('dashboard'); setModal(null); setSelectedItem(null); setAutoPrintFlag(false); 
      };
      
      const handleAdminNav = (view) => { autoReadNotificationsByView(view); setAdminView(view); setAdminMenuOpen(false); };
      const handleUserNav = (view) => { autoReadNotificationsByView(view); setCurrentView(view); setMobileMenuOpen(false); };
      
      const handlePrintReport = (item, type) => { 
          setSelectedItem(item); 
          setManageType(type); 
          setAutoPrintFlag(false); 
      };

      const closeManageModal = () => { setSelectedItem(null); setAutoPrintFlag(false); };

      const safePerms = Array.isArray(user?.permissions) ? user.permissions : [];

      // ============================
      // RENDER PUBLIC VIEW
      // ============================
      if (route === 'public') {
        return (
          <>
            <div className="relative w-full h-[100dvh] overflow-hidden bg-gray-100 flex flex-col">
              <header className="h-16 bg-slate-900 shadow-xl px-4 md:px-8 flex items-center justify-between z-50 absolute top-0 left-0 right-0 w-full">
                  <div className="flex-1 hidden md:block"></div>
                  <div className="flex items-center justify-start md:justify-center flex-1 gap-3">
                      <i className="fa-solid fa-tower-observation text-2xl text-blue-400"></i>
                      <h1 className="text-xl md:text-2xl font-black text-white tracking-wider">CCTV <span className="text-blue-400">COMMAND</span></h1>
                  </div>
                  <div className="flex items-center justify-end flex-1 gap-2 md:gap-3">
                      <button onClick={()=>setShowLogin(true)} className="flex items-center px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-bold text-xs md:text-sm shadow-md transition touch-friendly active:scale-95">
                          <i className="fa-solid fa-lock md:mr-2"></i> <span className="hidden sm:inline">เข้าสู่ระบบ</span>
                      </button>
                  </div>
              </header>
              <div className="flex-1 relative w-full h-full pt-16">
                  <CCTVMap cctvData={db?.cctv || []} />
              </div>
            </div>
            {showLogin && <LoginModal onClose={() => setShowLogin(false)} onLogin={handleLogin} onRegisterClick={() => { setShowLogin(false); setModal('register'); }} showPopup={showPopup} />}
            {modal === 'register' && <RegisterModal onClose={() => setModal(null)} onSave={handleOptimisticSync} showPopup={showPopup} />}
            {popupState && <SystemPopup type={popupState.type} message={popupState.message} onClose={closePopup} />}
            {confirmState && <ConfirmDialog message={confirmState.message} onConfirm={confirmState.onConfirm} onCancel={confirmState.onCancel} />}
          </>
        );
      }

      // ============================
      // RENDER USER / EMPLOYEE VIEW
      // ============================
      if (route === 'user') {
          const isEmp = user.role === 'employee';
          const myRepairs = (db.repairs || []).filter(r => r.username === user.username || r.customerName === user.name || (isEmp && r.assignee === user.username));
          const myClaims = (db.claims || []).filter(c => c.username === user.username || c.customerName === user.name || (isEmp && c.assignee === user.username));
          const myBorrows = (db.borrows || []).filter(b => b.username === user.username || b.borrowerName === user.name || b.adminName === user.name || b.adminName === user.username || (isEmp && b.assignee === user.username));
          const myInstallations = (db.installations || []).filter(i => i.username === user.username || i.customerName === user.name || (isEmp && i.assignee === user.username));
          const myInventory = (db.inventory || []).filter(i => i.username === user.username || i.customerName === user.name || (isEmp && i.assignee === user.username));
          
          const myRequests = [ ...myRepairs, ...myClaims, ...myBorrows, ...myInstallations, ...myInventory ].sort((a,b) => new Date(b.date || b.borrowDate || b.createdAt || 0).getTime() - new Date(a.date || a.borrowDate || a.createdAt || 0).getTime());
          
          const empAssignedTasks = myRequests.filter(r => r.assignee === user.username);
          const empCompleted = empAssignedTasks.filter(r => String(r.status).includes('Completed') || String(r.status).includes('Approved') || String(r.status).includes('Returned') || String(r.status).includes('Available')).length;
          const empPending = empAssignedTasks.length - empCompleted;

          const repairColumns = [{ label: 'ID/วันที่', exportValue: i => `${i.id} / ${i.date}`, render: i => <><span className="font-black text-indigo-700">{getSafeText(i.id)}</span><br/><span className="text-[10px] text-gray-500 font-mono">{getSafeText(i.date)}</span></> }, { label: 'อาการเสีย', field: 'problem', exportValue: i => i.problem, render: i => <span className="text-xs font-bold text-gray-800 line-clamp-2">{getSafeText(i.problem)}</span> }, { label: 'ผู้รับผิดชอบ', exportValue: i => i.assignee || '-', render: i => <span className="text-xs text-indigo-600 font-bold">{i.assignee || '-'}</span> }, { label: 'สถานะ', field: 'status', exportValue: i => statusConfig[i.status]?.label || i.status, align: 'text-center', render: i => <StatusBadge status={i.status}/> }];
          const claimColumns = [{ label: 'ID/วันที่', exportValue: i => `${i.id} / ${i.date}`, render: i => <><span className="font-black text-purple-700">{getSafeText(i.id)}</span><br/><span className="text-[10px] text-gray-500 font-mono">{getSafeText(i.date)}</span></> }, { label: 'สินค้า', field: 'itemName', exportValue: i => i.itemName, render: i => <span className="text-xs font-bold text-gray-800">{getSafeText(i.itemName)}</span> }, { label: 'ผู้รับผิดชอบ', exportValue: i => i.assignee || '-', render: i => <span className="text-xs text-indigo-600 font-bold">{i.assignee || '-'}</span> }, { label: 'สถานะ', field: 'status', exportValue: i => statusConfig[i.status]?.label || i.status, align: 'text-center', render: i => <StatusBadge status={i.status}/> }];

          const repairColumns = [{ label: 'ID/วันที่', exportValue: i => `${i.id} / ${i.date}`, render: i => <><span className="font-black text-orange-700">{getSafeText(i.id)}</span><br/><span className="text-[10px] text-gray-500 font-mono">{getSafeText(i.date)}</span></> }, { label: 'อุปกรณ์และผู้แจ้ง', field: 'problem', exportValue: i => i.itemName, render: i => <><span className="text-xs font-bold text-gray-800">{getSafeText(i.itemName)}</span><br/><span className="text-[10px] text-gray-500">{getSafeText(i.customerName)}</span></> }, { label: 'ผู้รับผิดชอบ', exportValue: i => i.assignee || '-', render: i => <span className="text-xs text-indigo-600 font-bold">{i.assignee || '-'}</span> }, { label: 'สถานะ', field: 'status', exportValue: i => statusConfig[i.status]?.label || i.status, align: 'text-center', render: i => <StatusBadge status={i.status}/> }];
          const claimColumns = [{ label: 'ID/วันที่', exportValue: i => `${i.id} / ${i.date}`, render: i => <><span className="font-black text-purple-700">{getSafeText(i.id)}</span><br/><span className="text-[10px] text-gray-500 font-mono">{getSafeText(i.date)}</span></> }, { label: 'สินค้าและผู้แจ้ง', field: 'itemName', exportValue: i => i.itemName, render: i => <><span className="text-xs font-bold text-gray-800">{getSafeText(i.itemName)}</span><br/><span className="text-[10px] text-gray-500">{getSafeText(i.customerName)}</span></> }, { label: 'ผู้รับผิดชอบ', exportValue: i => i.assignee || '-', render: i => <span className="text-xs text-indigo-600 font-bold">{i.assignee || '-'}</span> }, { label: 'สถานะ', field: 'status', exportValue: i => statusConfig[i.status]?.label || i.status, align: 'text-center', render: i => <StatusBadge status={i.status}/> }];
          const borrowColumns = [{ label: 'ID/วันที่ยืม', exportValue: i => `${i.id} / ${i.borrowDate}`, render: i => <><span className="font-black text-indigo-700">{getSafeText(i.id)}</span><br/><span className="text-[10px] text-gray-500 font-mono">{getSafeText(i.borrowDate)}</span></> }, { label: 'อุปกรณ์และผู้ยืม', field: 'borrowName', exportValue: i => i.borrowName, render: i => <><span className="text-xs font-bold text-gray-800">{getSafeText(i.borrowName)}</span><br/><span className="text-[10px] text-gray-500">{getSafeText(i.adminName || i.borrowerName)}</span></> }, { label: 'ผู้รับผิดชอบ', exportValue: i => i.assignee || '-', render: i => <span className="text-xs text-indigo-600 font-bold">{i.assignee || '-'}</span> }, { label: 'สถานะ', field: 'status', exportValue: i => statusConfig[i.status]?.label || i.status, align: 'text-center', render: i => <StatusBadge status={i.status}/> }];
          const installColumns = [{ label: 'ID/วันที่', exportValue: i => `${i.id} / ${i.date}`, render: i => <><span className="font-black text-teal-700">{getSafeText(i.id)}</span><br/><span className="text-[10px] text-gray-500 font-mono">{getSafeText(i.date)}</span></> }, { label: 'โครงการและผู้แจ้ง', field: 'project', exportValue: i => i.project, render: i => <><span className="text-xs font-bold text-gray-800">{getSafeText(i.project)}</span><br/><span className="text-[10px] text-gray-500">{getSafeText(i.customerName)}</span></> }, { label: 'ผู้รับผิดชอบ', exportValue: i => i.assignee || '-', render: i => <span className="text-xs text-indigo-600 font-bold">{i.assignee || '-'}</span> }, { label: 'สถานะ', field: 'status', exportValue: i => statusConfig[i.status]?.label || i.status, align: 'text-center', render: i => <StatusBadge status={i.status}/> }];

          return (
            <div className="flex h-[100dvh] w-full bg-[#f3f4f6] overflow-hidden fade-in">
              {adminMenuOpen && <div className="fixed inset-0 bg-slate-900/50 z-40 lg:hidden print-hide" onClick={() => setAdminMenuOpen(false)}></div>}
              <aside className={`fixed inset-y-0 left-0 w-64 bg-slate-900 text-gray-300 flex flex-col shadow-2xl z-50 transform transition-transform duration-300 lg:relative lg:translate-x-0 ${adminMenuOpen ? 'translate-x-0' : '-translate-x-full'} print-hide`}>
                <div className="h-16 flex items-center px-6 border-b border-slate-800 font-black text-xl text-white tracking-wider shrink-0"><i className="fa-solid fa-camera-retro text-indigo-500 mr-3"></i> CAMCARE</div>
                <div className="p-4 md:p-5 border-b border-slate-800 bg-slate-800/50 shrink-0"><p className="text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1">ยินดีต้อนรับ</p><p className="text-white font-bold truncate">{user?.name}</p><p className="text-xs text-indigo-400 uppercase mt-0.5 font-bold tracking-wider">{user?.role}</p></div>
                <nav className="flex-1 p-3 md:p-4 space-y-1 md:space-y-1.5 overflow-y-auto pb-20 custom-scrollbar">
                  <NavItem icon="fa-chart-line" label="หน้าหลัก (Dashboard)" active={adminView==='dashboard'} onClick={()=>handleAdminNav('dashboard')} />
                  <NavItem icon="fa-video" label="กล้อง CCTV" active={adminView==='cctv_dashboard'} onClick={()=>handleAdminNav('cctv_dashboard')} />
                  <NavItem icon="fa-map-location-dot" label="แผนที่กล้อง CCTV" active={adminView==='map'} onClick={()=>handleAdminNav('map')} />
                  <NavItem icon="fa-bell" label="การแจ้งเตือนระบบ" active={adminView==='notifications'} onClick={()=>handleAdminNav('notifications')} badge={unreadNotifsCount} />
                  <NavItem icon="fa-tools" label="ระบบงานติดตั้ง" active={adminView==='installations'} onClick={()=>handleAdminNav('installations')} />
                  <NavItem icon="fa-box-open" label="จัดการคลังสินค้า" active={adminView==='inventory'} onClick={()=>handleAdminNav('inventory')} />
                  <NavItem icon="fa-wrench" label="ระบบแจ้งซ่อม" active={adminView==='repairs'} onClick={()=>handleAdminNav('repairs')} />
                  <NavItem icon="fa-shield-halved" label="ระบบเคลมสินค้า" active={adminView==='claims'} onClick={()=>handleAdminNav('claims')} />
                  <NavItem icon="fa-handshake" label="ระบบยืม-คืน" active={adminView==='borrows'} onClick={()=>handleAdminNav('borrows')} />
                  <NavItem icon="fa-file-pdf" label="แบบฟอร์มรายงาน" active={adminView==='reports'} onClick={()=>handleAdminNav('reports')} />
                  <NavItem icon="fa-user-shield" label="จัดการสิทธิ์ผู้ใช้งาน" active={adminView==='users'} onClick={()=>handleAdminNav('users')} badge={db.pendingUsers?.length || 0} />
                </nav>
                <div className="p-3 md:p-4 border-t border-slate-800 shrink-0 bg-slate-900 w-full"><button onClick={handleLogout} className="w-full flex items-center justify-center px-4 py-2.5 rounded-xl text-sm font-bold text-red-400 hover:bg-red-500/10 transition border border-transparent hover:border-red-500/20 touch-friendly"><i className="fa-solid fa-power-off mr-2"></i> ออกจากระบบ</button></div>
              </aside>

              <main className="flex-1 overflow-hidden relative flex flex-col w-full print-container">
                <header className="h-16 bg-white shadow-sm border-b flex items-center px-4 md:px-8 z-10 shrink-0 print-hide"><button className="mr-4 text-gray-600 hover:text-gray-900 lg:hidden touch-friendly p-2" onClick={() => setAdminMenuOpen(true)}><i className="fa-solid fa-bars text-xl"></i></button><h2 className="text-lg md:text-xl font-bold text-gray-800 truncate">ADMIN PORTAL</h2></header>
                <div className="flex-1 overflow-y-auto p-4 md:p-6 lg:p-8 bg-slate-50/50 print-container custom-scrollbar" id="main-scroll-container">
                  <div className="max-w-7xl mx-auto h-full print-container">
                    
                    {adminView === 'dashboard' && <DashboardOverview data={db} />}
                    {adminView === 'cctv_dashboard' && <AdminCCTVDashboard db={db} onAdd={(t)=>setModal(t)} onManage={(item, type) => {setSelectedItem(item); setManageType(type);}} />}
                    {adminView === 'notifications' && <NotificationsView notifications={db.notifications} user={user} onNotificationClick={handleNotificationClick} onSync={handleOptimisticSync} showPopup={showPopup} />}
                    
                    {adminView === 'map' && (
                        <div className="h-[calc(100dvh-120px)] w-full bg-white rounded-3xl shadow-sm border overflow-hidden p-1 relative fade-in">
                            <CCTVMap cctvData={db.cctv || []} />
                        </div>
                    )}
                    
                    {adminView === 'installations' && (
                      <DataDashboard title="ระบบงานติดตั้ง" iconClass="fa-solid fa-tools" colorConfig={{bg: 'bg-teal-600', hoverBg: 'hover:bg-teal-700', text: 'text-teal-600', lightBg: 'bg-teal-50'}} data={db.installations} type="installations" onAdd={()=>setModal('add_installation')} onManage={(item, type)=>{setSelectedItem(item); setManageType(type);}} onSync={handleOptimisticSync} filterOptions={[{value: 'Inst_Completed', label: 'ติดตั้งสำเร็จ'}, {value: 'Inst_InProgress', label: 'กำลังติดตั้ง'}, {value: 'Inst_Pending', label: 'รอดำเนินการ'}]} 
                      columns={installColumns} user={user} showPopup={showPopup} showConfirm={showConfirmDialog} />
                    )}

                    {adminView === 'inventory' && (
                      <DataDashboard title="คลังสินค้า" iconClass="fa-solid fa-box-open" colorConfig={{bg: 'bg-blue-600', hoverBg: 'hover:bg-blue-700', text: 'text-blue-600', lightBg: 'bg-blue-50'}} data={db.inventory} type="inventory" onAdd={()=>setModal('add_inventory')} onManage={(item, type)=>{setSelectedItem(item); setManageType(type);}} onSync={handleOptimisticSync} filterOptions={[{value: 'Inv_Available', label: 'พร้อมใช้งาน'}, {value: 'Inv_Pending', label: 'รอดำเนินการ'}, {value: 'Inv_Broken', label: 'มีปัญหา'}]} 
                      columns={invColumns} user={user} showPopup={showPopup} showConfirm={showConfirmDialog} />
                    )}

                    {adminView === 'repairs' && (
                      <DataDashboard title="ระบบแจ้งซ่อม" iconClass="fa-solid fa-wrench" colorConfig={{bg: 'bg-orange-500', hoverBg: 'hover:bg-orange-600', text: 'text-orange-600', lightBg: 'bg-orange-50'}} data={db.repairs} type="repairs" onAdd={()=>setModal('add_repair')} onManage={(item, type)=>{setSelectedItem(item); setManageType(type);}} onSync={handleOptimisticSync} filterOptions={[{value: 'Rep_Completed', label: 'ซ่อมสำเร็จ'}, {value: 'Rep_Purchasing', label: 'กำลังจัดซื้ออุปกรณ์'}, {value: 'Rep_Pending', label: 'รอดำเนินการ'}]} 
                      columns={repairColumns} user={user} showPopup={showPopup} showConfirm={showConfirmDialog} />
                    )}

                    {adminView === 'claims' && (
                      <DataDashboard title="ระบบเคลมสินค้า" iconClass="fa-solid fa-shield-halved" colorConfig={{bg: 'bg-purple-600', hoverBg: 'hover:bg-purple-700', text: 'text-purple-600', lightBg: 'bg-purple-50'}} data={db.claims} type="claims" onAdd={()=>setModal('add_claim')} onManage={(item, type)=>{setSelectedItem(item); setManageType(type);}} onSync={handleOptimisticSync} filterOptions={[{value: 'Clm_Approved', label: 'อนุมัติ'}, {value: 'Clm_Rejected', label: 'ไม่อนุมัติ'}, {value: 'Clm_Reviewing', label: 'รอพิจารณา'}, {value: 'Clm_Pending', label: 'รอดำเนินการ'}]} 
                      columns={claimColumns} user={user} showPopup={showPopup} showConfirm={showConfirmDialog} />
                    )}

                    {adminView === 'borrows' && (
                      <DataDashboard title="ระบบยืม-คืน" iconClass="fa-solid fa-handshake" colorConfig={{bg: 'bg-indigo-600', hoverBg: 'hover:bg-indigo-700', text: 'text-indigo-600', lightBg: 'bg-indigo-50'}} data={db.borrows} type="borrows" onAdd={()=>setModal('add_borrow')} onManage={(item, type)=>{setSelectedItem(item); setManageType(type);}} onSync={handleOptimisticSync} filterOptions={[{value: 'Brw_Borrowed', label: 'ยืม'}, {value: 'Brw_Returned', label: 'คืน'}, {value: 'Brw_Reviewing', label: 'พิจารณา'}, {value: 'Brw_Pending', label: 'รอดำเนินการ'}]} 
                      columns={borrowColumns} user={user} showPopup={showPopup} showConfirm={showConfirmDialog} />
                    )}

                    {adminView === 'reports' && <ReportsDashboard db={db} user={user} onPrint={handlePrintReport} />}
                    {adminView === 'users' && <UserManagement db={db} onAddUser={()=>setModal('add_user')} onSync={handleOptimisticSync} refreshData={refreshData} showPopup={showPopup} showConfirm={showConfirmDialog} onOpenTask={(item, type) => {setSelectedItem(item); setManageType(type);}} />}
                  </div>
                  <ScrollToTopButton />
                </div>
              </main>

              {modal === 'add_user' && <AddUserModal userRole={user?.role} db={db} onClose={()=>setModal(null)} onSave={handleOptimisticSync} showPopup={showPopup} />}
              {modal === 'add_camera' && <AddCameraModal db={db} onClose={()=>setModal(null)} onSave={handleOptimisticSync} showPopup={showPopup} />}
              {modal === 'add_installation' && <AddInstallationModal user={user} db={db} onClose={()=>setModal(null)} onSave={handleOptimisticSync} showPopup={showPopup} />}
              {modal === 'add_inventory' && <AddInventoryModal user={user} db={db} onClose={()=>setModal(null)} onSave={handleOptimisticSync} showPopup={showPopup} />}
              {modal === 'add_repair' && <AddRepairModal user={user} db={db} onClose={()=>setModal(null)} onSave={handleOptimisticSync} showPopup={showPopup} />}
              {modal === 'add_claim' && <AddClaimModal user={user} db={db} onClose={()=>setModal(null)} onSave={handleOptimisticSync} showPopup={showPopup} />}
              {modal === 'add_borrow' && <AddBorrowModal user={user} db={db} onClose={()=>setModal(null)} onSave={handleOptimisticSync} showPopup={showPopup} />}
              
              {selectedItem && <ManageItemModal user={user} db={db} item={selectedItem} type={manageType} onClose={closeManageModal} onSave={handleOptimisticSync} showPopup={showPopup} showConfirm={showConfirmDialog} />}
              {popupState && <SystemPopup type={popupState.type} message={popupState.message} onClose={closePopup} />}
              {confirmState && <ConfirmDialog message={confirmState.message} onConfirm={confirmState.onConfirm} onCancel={confirmState.onCancel} />}
            </div>
          );
      }
      return null;
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>
</body>
</html>
