<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartStore - E-Commerce & POS System</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Prompt', sans-serif; background-color: #f3f4f6; overflow-x: hidden; }
    .fade-in { animation: fadeIn 0.2s ease-in-out; }
    .slide-up { animation: slideUp 0.3s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .glass-effect { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .pos-bg { background-color: #FAF6F0; }
    
    /* สำหรับการพิมพ์บิลใบเสร็จ */
    @media print {
      body * { visibility: hidden; }
      #printable-receipt, #printable-receipt * { visibility: visible; }
      #printable-receipt { position: absolute; left: 0; top: 0; width: 100%; max-width: 400px; margin: 0 auto; padding: 20px; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const PRODUCT_CATEGORIES = ['เสื้อผ้าแฟชั่น', 'เสื้อผ้าพื้นเมือง', 'กระเป๋า', 'หมวก', 'รองเท้า', 'ของฝาก', 'ของเล่น', 'อื่นๆ'];

    // ==========================================
    // 1. UTILITIES & HELPERS
    // ==========================================
    const toBase64 = file => new Promise((resolve, reject) => {
      const reader = new FileReader(); reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result); reader.onerror = error => reject(error);
    });

    const generateId = (prefix) => {
      const d = new Date();
      return `${prefix}${String(d.getFullYear()).slice(-2)}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}-${String(d.getTime()).slice(-4)}`;
    };

    const formatMoney = (num) => new Intl.NumberFormat('th-TH', { style: 'currency', currency: 'THB' }).format(Number(num)||0);
    const formatDateStr = (d) => d.toISOString().replace('T', ' ').split('.')[0];

    const parseFilesInfo = (fileStr) => {
      if(!fileStr) return { images: [], docs: [] };
      try {
        const parsed = JSON.parse(fileStr);
        const arr = Array.isArray(parsed) ? parsed : [fileStr];
        return { images: arr.filter(url => url.startsWith('data:image') || url.startsWith('http')), docs: arr.filter(url => !url.startsWith('data:image') && !url.startsWith('http')) };
      } catch (e) {
        if(fileStr.startsWith('data:image') || fileStr.startsWith('http')) return { images: [fileStr], docs: [] };
        return { images: [], docs: [fileStr] };
      }
    };

    const errImg = "this.src='https://placehold.co/400x400?text=No+Image'";
    const renderThumbnail = (imgStr) => {
        const { images } = parseFilesInfo(imgStr);
        if(images.length > 0) return <img src={images[0]} className="w-10 h-10 object-cover rounded border shadow-sm cursor-pointer hover:scale-150 transition z-10 relative" onClick={(e)=>{e.stopPropagation(); window.open(images[0])}} onError={(e) => { e.target.src = 'https://placehold.co/40x40?text=IMG'; }} />;
        return <div className="w-10 h-10 bg-gray-100 rounded flex items-center justify-center text-gray-400 text-xs"><i className="fa-solid fa-image"></i></div>;
    };

    // ==========================================
    // 2. MOCK DATA & GAS MOCK
    // ==========================================
    let mockDb = {
      products: [
        { id: "PROD-001-1", name: "เสื้อชาวดอย", category: "เสื้อผ้าพื้นเมือง", color: "กรมท่า", size: "M", cost: 150, price: 320, floorPrice: 250, stock: 12, imgUrl: '["https://images.unsplash.com/photo-1514228742587-6b1558fcca3d?w=500&q=80"]', status: "active", visibility: "online" },
        { id: "PROD-001-2", name: "เสื้อชาวดอย", category: "เสื้อผ้าพื้นเมือง", color: "แดง", size: "L", cost: 150, price: 320, floorPrice: 250, stock: 12, imgUrl: '["https://images.unsplash.com/photo-1514228742587-6b1558fcca3d?w=500&q=80"]', status: "active", visibility: "online" },
        { id: "PROD-002", name: "กระเป๋าสาน", category: "กระเป๋า", color: "น้ำตาล", size: "-", cost: 400, price: 890, floorPrice: 600, stock: 8, imgUrl: '["https://images.unsplash.com/photo-1581428982868-e410dd4bfd52?w=500&q=80"]', status: "active", visibility: "online" },
        { id: "PROD-003", name: "พวงกุญแจช้าง", category: "ของฝาก", color: "ไม้", size: "-", cost: 50, price: 120, floorPrice: 100, stock: 50, imgUrl: '["https://images.unsplash.com/photo-1593005510509-d05b264f1c14?w=500&q=80"]', status: "active", visibility: "offline" }
      ],
      orders: [ 
        { id: "ORD-260417-1111", date: "2026-04-17 10:00:00", customerName: "สมชาย ใจดี", phone: "0812345678", address: "123 กทม.", items: '[{"id":"PROD-001-1","name":"เสื้อชาวดอย","price":320,"qty":1,"color":"กรมท่า","size":"M"}]', total: 320, shippingFee: 40, grandTotal: 360, slipUrl: "mock", trackingNo: "", status: "completed" }
      ],
      sales: [ 
        { id: "SAL-260417-2222", date: "2026-04-20 11:30:00", seller: "emp1", customerPhone: "0899999999", items: '[{"id":"PROD-002","name":"กระเป๋าสาน","price":890,"cost":400,"qty":1}]', total: 840, discount: 50, profit: 440, paymentMethod: "cash", status: "completed" }
      ],
      users: [
        { id: "USR-001", username: 'admin', name: 'แอดมินหลัก', role: 'admin', password: '123', idCard: '1111111111111', address: 'กทม.', gender: 'ชาย', startDate: '2020-01-01', imgUrl: '' },
        { id: "USR-002", username: 'emp1', name: 'สมหญิง ใจดี', role: 'employee', password: '123', idCard: '2222222222222', address: 'เชียงใหม่', gender: 'หญิง', startDate: '2023-05-15', imgUrl: '' }
      ],
      customers: [
        { id: "CUS-001", name: "ลูกค้าทั่วไป", phone: "0000000000", address: "-", points: 0, totalSpent: 0, tier: "Normal" },
        { id: "CUS-002", name: "สมเกียรติ ยอดนักช้อป", phone: "0899999999", address: "เชียงใหม่", points: 150, totalSpent: 15000, tier: "Gold" }
      ]
    };
    
    if (typeof google === 'undefined') {
      window.google = { script: { run: { 
         withSuccessHandler: function(cb) {
           return {
             withFailureHandler: function() { return this; },
             getInitialData: () => setTimeout(() => cb(mockDb), 300),
             loginUser: (u, p) => setTimeout(() => {
                let user = mockDb.users.find(x => x.username === u && x.password === p);
                if(user) cb({ success: true, user }); else cb({ success: false, message: "User/Pass ผิด" });
             }, 500),
             placeOrder: (data) => setTimeout(() => { mockDb.orders.push(data); cb({success: true, id: data.id}); }, 300),
             addSale: (data) => setTimeout(() => { mockDb.sales.push(data); cb({success: true}); }, 300),
             updateOrderStatus: (data) => setTimeout(() => cb({success: true}), 200),
             updateProduct: (data) => setTimeout(() => cb({success: true}), 200),
             addProduct: (data) => setTimeout(() => { mockDb.products.push(data); cb({success: true}); }, 300),
             deleteItem: (type, id) => setTimeout(() => cb({success: true}), 200),
             registerUser: (data) => setTimeout(() => cb({success: true}), 300),
             updateUser: (data) => setTimeout(() => cb({success: true}), 300),
             deleteUser: (username) => setTimeout(() => cb({success: true}), 200),
             addCustomer: (data) => setTimeout(() => { mockDb.customers.push(data); cb({success: true}); }, 300),
             updateCustomer: (data) => setTimeout(() => cb({success: true}), 200),
             voidTransaction: (data) => setTimeout(() => cb({success: true}), 300)
           };
         }
      }} };
    }

    // ==========================================
    // 3. UI PRIMITIVES
    // ==========================================
    const InputField = ({ label, ...props }) => (
      <div className="mb-3 w-full">
        <label className="block text-xs font-bold mb-1 text-gray-600">{label}</label>
        <input className="w-full border p-2.5 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none text-sm bg-gray-50 transition" {...props} />
      </div>
    );

    const NavItem = ({ icon, label, active, onClick }) => (
      <button onClick={onClick} className={`w-full flex items-center px-4 py-3.5 rounded-xl transition font-bold text-sm ${active ? 'bg-orange-500 text-white shadow-md' : 'text-gray-400 hover:bg-slate-800 hover:text-white'}`}>
        <i className={`fa-solid ${icon} w-6 text-center mr-2`}></i> {label}
      </button>
    );

    const Modal = ({ title, onClose, children, icon="fa-box", maxWidth="max-w-2xl" }) => (
      <div className="fixed inset-0 bg-slate-900/70 z-[2000] flex items-center justify-center p-4 fade-in backdrop-blur-sm">
        <div className={`bg-white rounded-3xl w-full ${maxWidth} overflow-hidden shadow-2xl relative z-50 max-h-[95vh] flex flex-col slide-up pointer-events-auto`}>
          <div className="p-5 border-b bg-gray-50 flex justify-between items-center shrink-0 no-print">
             <h3 className="font-black text-lg text-gray-800"><i className={`fa-solid ${icon} text-orange-500 mr-2`}></i>{title}</h3>
             <button type="button" onClick={onClose} className="w-8 h-8 rounded-full bg-gray-200 text-gray-600 hover:bg-red-500 hover:text-white transition flex items-center justify-center"><i className="fa-solid fa-times"></i></button>
          </div>
          <div className="p-6 overflow-y-auto flex-1 hide-scrollbar relative z-10 pointer-events-auto">{children}</div>
        </div>
      </div>
    );

    const StatusBadge = ({ status }) => {
        let conf = { bg: 'bg-gray-100', text: 'text-gray-700', label: status };
        if(status==='pending') conf = { bg: 'bg-yellow-100', text: 'text-yellow-700', label: 'รอดำเนินการ' };
        if(status==='preparing') conf = { bg: 'bg-blue-100', text: 'text-blue-700', label: 'กำลังจัดเตรียม' };
        if(status==='shipped') conf = { bg: 'bg-green-100', text: 'text-green-700', label: 'จัดส่งแล้ว' };
        if(status==='cancelled') conf = { bg: 'bg-red-100', text: 'text-red-700', label: 'ยกเลิก' };
        return <span className={`px-2 py-1 rounded text-[10px] font-bold ${conf.bg} ${conf.text}`}>{conf.label}</span>;
    };

    // ==========================================
    // 4. SHARED MODALS 
    // ==========================================
    const BillDetailModal = ({ tx, onClose, onFullVoid, onPartialVoid }) => {
      const items = JSON.parse(tx.items || '[]');
      const isCancelled = tx.status === 'cancelled';
      const [returnModal, setReturnModal] = useState(null);
      const [returnQty, setReturnQty] = useState(1);

      const handleReturnItem = (idx) => {
        const item = items[idx];
        setReturnModal({ item, idx });
        setReturnQty(1);
      };

      return (
        <>
          <Modal title="รายละเอียดบิล (Receipt)" icon="fa-receipt" onClose={onClose} maxWidth="max-w-md">
            <div id="printable-receipt" className="p-4 bg-white text-gray-800 font-mono text-sm relative">
              {isCancelled && <div className="absolute top-1/4 left-1/2 -translate-x-1/2 border-4 border-red-500 text-red-500 font-black text-4xl px-4 py-2 transform -rotate-12 rounded-lg opacity-40 pointer-events-none z-10">ยกเลิก / VOID</div>}
              
              <div className="text-center border-b border-dashed border-gray-300 pb-4 mb-4">
                <h2 className="text-2xl font-black mb-1">SmartStore</h2>
                <p className="text-xs text-gray-500">ใบเสร็จรับเงิน / Receipt</p>
                <p className="text-xs text-gray-500 mt-2">วันที่: {tx.date}</p>
                <p className="text-xs text-gray-500">รหัสบิล: {tx.id}</p>
              </div>

              <div className="mb-4 space-y-1 text-xs">
                <p>พนักงาน/ลูกค้า: <span className="font-bold">{tx.person || '-'}</span></p>
                <p>ช่องทาง: {tx.source} ({tx.paymentMethod === 'cash' ? 'เงินสด' : tx.paymentMethod === 'qr' ? 'สแกนโอน' : 'ออนไลน์'})</p>
              </div>

              <div className="border-b border-dashed border-gray-300 pb-4 mb-4 relative z-20">
                <table className="w-full text-xs">
                  <thead>
                    <tr className="border-b border-gray-200">
                      <th className="text-left py-1">รายการ</th>
                      <th className="text-center">จำนวน</th>
                      <th className="text-right">ราคา</th>
                      {!isCancelled && <th className="text-center no-print text-red-500"><i className="fa-solid fa-rotate-left"></i></th>}
                    </tr>
                  </thead>
                  <tbody>
                    {items.map((i, idx) => (
                      <tr key={idx} className="border-b border-gray-50 last:border-0 hover:bg-gray-50">
                        <td className="py-2 pr-2">
                          <div className="font-bold line-clamp-2">{i.name}</div>
                          {(i.color && i.color !== '-') && <div className="text-[10px] text-gray-500">สี:{i.color} ไซส์:{i.size || '-'}</div>}
                        </td>
                        <td className="text-center">{i.qty || i.cartQty || 1}</td>
                        <td className="text-right">{formatMoney((i.price + (i.discount||0)) * (i.qty || i.cartQty || 1))}</td>
                        {!isCancelled && (
                          <td className="text-center no-print">
                            <button 
                              type="button"
                              onClick={()=>handleReturnItem(idx)} 
                              className="relative z-50 pointer-events-auto text-[10px] bg-red-50 text-red-500 px-2 py-1 rounded hover:bg-red-100 border border-red-100 transition shadow-sm font-bold"
                            >
                              คืน
                            </button>
                          </td>
                        )}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>

              <div className="space-y-1 text-sm">
                <div className="flex justify-between"><p>ยอดรวม (Subtotal):</p><p>{formatMoney(tx.amount + (tx.discount || 0))}</p></div>
                {(tx.discount > 0) && <div className="flex justify-between text-red-500"><p>ส่วนลดท้ายบิล:</p><p>-{formatMoney(tx.discount)}</p></div>}
                <div className="flex justify-between font-black text-lg mt-2 pt-2 border-t border-gray-200"><p>ยอดสุทธิ (Net):</p><p>{formatMoney(tx.amount)}</p></div>
              </div>
            </div>

            <div className="flex gap-3 mt-6 no-print">
              <button onClick={()=>window.print()} className="flex-1 py-3 bg-gray-100 text-gray-700 rounded-xl font-bold hover:bg-gray-200 transition shadow-sm">
                <i className="fa-solid fa-print mr-2"></i>พิมพ์บิล
              </button>
              {!isCancelled && (
                <button onClick={()=>onFullVoid(tx)} className="flex-1 py-3 bg-red-50 text-red-600 rounded-xl font-bold hover:bg-red-500 hover:text-white transition shadow-sm border border-red-100">
                  <i className="fa-solid fa-ban mr-2"></i>ยกเลิกทั้งบิล
                </button>
              )}
            </div>
          </Modal>

          {/* 🔥 POPUP คืนสินค้า */}
          {returnModal && (
            <div className="fixed inset-0 bg-black/50 z-[3000] flex items-center justify-center">
              <div className="bg-white rounded-2xl p-5 w-80 shadow-xl">
                
                <h3 className="font-bold text-gray-800 mb-3">
                  คืนสินค้า
                </h3>

                <p className="text-sm mb-2">
                  {returnModal.item.name}
                </p>

                <input
                  type="number"
                  min="1"
                  max={returnModal.item.qty || returnModal.item.cartQty || 1}
                  value={returnQty}
                  onChange={(e)=>setReturnQty(e.target.value)}
                  className="w-full border p-2 rounded mb-4"
                />

                <div className="flex gap-2">
                  <button
                    onClick={()=>setReturnModal(null)}
                    className="flex-1 bg-gray-200 py-2 rounded"
                  >
                    ยกเลิก
                  </button>

                  <button
                    onClick={()=>{
                      const qty = Number(returnQty);
                      const maxQty = returnModal.item.qty || returnModal.item.cartQty || 1;

                      if(qty <= 0 || qty > maxQty){
                        alert("จำนวนไม่ถูกต้อง");
                        return;
                      }

                      onPartialVoid(tx, returnModal.item, qty, returnModal.idx);
                      setReturnModal(null);
                    }}
                    className="flex-1 bg-red-500 text-white py-2 rounded"
                  >
                    ยืนยันคืน
                  </button>
                </div>

              </div>
            </div>
          )}
        </>
      );
    };

    const POSVariantModal = ({ productGroup, onClose, onAddToCart }) => {
       const [selectedVarId, setSelectedVarId] = useState(productGroup.items[0].id);
       const [qty, setQty] = useState(1);
       
       const activeVar = productGroup.items.find(i => i.id === selectedVarId);
       
       const handleAdd = () => {
          if(Number(qty) > Number(activeVar.stock)) return alert(`สต็อกไม่พอ! มีเหลือแค่ ${activeVar.stock} ชิ้น`);
          if(Number(qty) < 1) return alert('จำนวนขั้นต่ำคือ 1');
          onAddToCart(activeVar, Number(qty));
       };

       const firstImg = parseFilesInfo(productGroup.imgUrl).images[0] || 'https://placehold.co/400x400?text=No+Image';

       return (
         <div className="fixed inset-0 bg-slate-900/70 z-[3000] flex items-center justify-center p-4 fade-in backdrop-blur-sm">
           <div className="bg-white rounded-3xl w-full max-w-sm overflow-hidden shadow-2xl relative slide-up">
             <div className="p-4 border-b flex justify-between items-center bg-gray-50">
                <h3 className="font-bold text-gray-800">เลือกระบุรายละเอียด</h3>
                <button onClick={onClose} className="text-gray-400 hover:text-red-500"><i className="fa-solid fa-times text-xl"></i></button>
             </div>
             <div className="p-6">
                <div className="flex gap-4 mb-5">
                   <img src={firstImg} className="w-20 h-20 rounded-xl object-cover border shadow-sm" onError={(e) => { e.target.src = 'https://placehold.co/400x400?text=No+Image'; }} />
                   <div>
                      <p className="font-bold text-gray-800 leading-tight">{productGroup.name}</p>
                      <p className="text-lg font-black text-orange-600 mt-1">{formatMoney(activeVar.price)}</p>
                   </div>
                </div>

                <div className="space-y-4">
                   <div>
                      <label className="block text-xs font-bold mb-2 text-gray-600">ตัวเลือก (สี/ไซส์)</label>
                      <select value={selectedVarId} onChange={e=>setSelectedVarId(e.target.value)} className="w-full border-2 border-orange-100 p-3 rounded-xl outline-none focus:border-orange-500 text-sm font-bold bg-white shadow-sm">
                         {productGroup.items.map(v => (
                            <option key={v.id} value={v.id} disabled={Number(v.stock) <= 0}>
                               สี: {v.color} {v.size && v.size !== '-' ? `| ไซส์: ${v.size}` : ''} {Number(v.stock) <= 0 ? '(หมด)' : `(เหลือ ${v.stock} ชิ้น)`}
                            </option>
                         ))}
                      </select>
                   </div>
                   
                   <div className="flex items-center justify-between bg-gray-50 p-3 rounded-xl border border-gray-100">
                      <label className="text-sm font-bold text-gray-700">จำนวนที่ต้องการ</label>
                      <div className="flex items-center border border-gray-300 rounded-xl bg-white overflow-hidden shadow-sm">
                        <button onClick={() => setQty(Math.max(1, qty - 1))} className="px-3 py-1 text-gray-500 hover:bg-gray-100 font-black">-</button>
                        <input type="number" min="1" max={activeVar.stock} value={qty} onChange={e=>setQty(Number(e.target.value))} className="w-12 text-center font-bold outline-none border-x border-gray-100" />
                        <button onClick={() => setQty(Math.min(activeVar.stock, qty + 1))} className="px-3 py-1 text-gray-500 hover:bg-gray-100 font-black">+</button>
                      </div>
                   </div>
                </div>

                <button onClick={handleAdd} disabled={Number(activeVar.stock) <= 0} className="w-full mt-6 py-3.5 bg-orange-500 text-white rounded-xl font-bold hover:bg-orange-600 transition shadow-md disabled:opacity-50">
                   เพิ่มลงรายการขาย
                </button>
             </div>
           </div>
         </div>
       );
    };

    const LoginModal = ({ onClose, onLogin }) => {
      const [u, setU] = useState(''); 
      const [p, setP] = useState('');
      const [roleSelect, setRoleSelect] = useState('admin');
      const [loading, setLoading] = useState(false);

      const handleLogin = (e) => {
        e.preventDefault(); setLoading(true);
        if(typeof google !== 'undefined' && google.script) {
           google.script.run.withSuccessHandler(res => { 
               setLoading(false); 
               if(res && res.success) {
                   if(res.user.role !== roleSelect && res.user.role !== 'admin') {
                       alert('สิทธิ์ของคุณไม่ตรงกับประเภทที่เลือกเข้าสู่ระบบ');
                   } else {
                       onLogin(res.user); 
                   }
               } else alert(res?.message || "Login failed"); 
           }).withFailureHandler((err) => { alert(err.message); setLoading(false); }).loginUser(u, p);
        } else {
           setTimeout(() => {
             setLoading(false);
             if((u==='admin' && roleSelect==='admin') || (u==='emp1' && roleSelect==='employee')) {
                onLogin({ username: u, name: u==='admin' ? 'แอดมินหลัก' : 'พนักงาน', role: u==='admin'?'admin':'employee' }); 
             } else {

                 <button type="button" onClick={()=>setRoleSelect('admin')} className={`flex-1 py-2.5 rounded-lg text-sm font-bold transition-all ${roleSelect === 'admin' ? 'bg-white text-orange-600 shadow-md' : 'text-gray-500 hover:text-gray-700'}`}>
                    <i className="fa-solid fa-crown mr-1"></i> เจ้าของร้าน
                 </button>
                 <button type="button" onClick={()=>setRoleSelect('employee')} className={`flex-1 py-2.5 rounded-lg text-sm font-bold transition-all ${roleSelect === 'employee' ? 'bg-white text-orange-600 shadow-md' : 'text-gray-500 hover:text-gray-700'}`}>
                    <i className="fa-solid fa-user-tie mr-1"></i> พนักงาน

              <form onSubmit={handleLogin} className="px-8 pb-6 space-y-4">
                <div className="relative">
                  <i className="fa-solid fa-user absolute left-4 top-3.5 text-gray-400"></i>
                  <input type="text" placeholder="Username" value={u} onChange={e=>setU(e.target.value)} required className="w-full bg-gray-50 border border-gray-200 text-gray-800 text-sm rounded-xl focus:ring-2 focus:ring-orange-500 outline-none font-medium transition p-3.5 pl-11" />
                </div>
                <div className="relative">
                  <i className="fa-solid fa-lock absolute left-4 top-3.5 text-gray-400"></i>
                  <input type="password" placeholder="Password" value={p} onChange={e=>setP(e.target.value)} required className="w-full bg-gray-50 border border-gray-200 text-gray-800 text-sm rounded-xl focus:ring-2 focus:ring-orange-500 outline-none font-medium transition p-3.5 pl-11" />

    const ProductModal = ({ productGroup, onClose, onSync }) => {
      const isEdit = !!productGroup && productGroup.length > 0;
      const baseProduct = isEdit ? productGroup[0] : {};

      const [f, setF] = useState({ 
         name: baseProduct.name || '', 
         category: baseProduct.category || 'เสื้อผ้าแฟชั่น', 
         cost: baseProduct.cost || '', 
         price: baseProduct.price || '', 
         floorPrice: baseProduct.floorPrice || '', 
         status: baseProduct.status || 'active', 
         visibility: baseProduct.visibility || 'offline', 
         imgUrl: baseProduct.imgUrl || '[]' 
      });
      
      const initialVariantsMap = {};
      if (isEdit) {
          productGroup.forEach(p => {
             const c = (p.color || '-').trim();
             const s = (p.size || '-').trim();
             const key = `${c}_${s}`.toLowerCase();
             if (initialVariantsMap[key]) {
                 initialVariantsMap[key].stock += Number(p.stock || 0);
             } else {
                 initialVariantsMap[key] = { id: p.id, color: c, size: s, stock: Number(p.stock || 0), isDbItem: true };
             }
          });
      }
      
      const [variants, setVariants] = useState(
         isEdit ? Object.values(initialVariantsMap)
                : [{ id: generateId('V'), color: '', size: '', stock: '', isDbItem: false }]
      );
      
      const [images, setImages] = useState([]);
      const [deletedVariants, setDeletedVariants] = useState([]);
      const [loading, setLoading] = useState(false);
      
      const existingImages = parseFilesInfo(f.imgUrl).images;
      
      const handleImageChange = (e) => setImages(Array.from(e.target.files).slice(0, 5));
      const addVariant = () => setVariants([...variants, { id: generateId('V'), color: '', size: '', stock: '', isDbItem: false }]);
      
      const removeVariant = (index) => {
         const v = variants[index];
         if (v.isDbItem) setDeletedVariants([...deletedVariants, v.id]);
         setVariants(variants.filter((_, i) => i !== index));
      };
      
      const updateVariant = (index, field, val) => {
         const newV = [...variants];
         newV[index][field] = val;
         setVariants(newV);
      };

      const save = async (e) => {
        e.preventDefault(); 
        
        if (variants.some(v => !v.color || v.stock === '')) {
           return alert('กรุณาระบุ สี และ จำนวน ของทุกรายการให้ครบถ้วน (ถ้าไม่มีสี/ไซส์ ให้ใส่ -)');
        }

        setLoading(true);

        const mergedVariantsMap = {};
        const newDeletedVariants = [...deletedVariants];

        variants.forEach(v => {
            const c = (v.color || '-').trim();
            const s = (v.size || '-').trim();
            const key = `${c}_${s}`.toLowerCase();

            if (mergedVariantsMap[key]) {
                mergedVariantsMap[key].stock += Number(v.stock);
                if (v.isDbItem && v.id !== mergedVariantsMap[key].id) {
                    newDeletedVariants.push(v.id);
                }
            } else {
                mergedVariantsMap[key] = { ...v, color: c, size: s, stock: Number(v.stock) };
            }
        });

        const mergedVariantsList = Object.values(mergedVariantsMap);

        let allBase64 = []; 
        for (let file of images) allBase64.push(await toBase64(file));
        const finalImgUrl = allBase64.length > 0 ? JSON.stringify(allBase64) : f.imgUrl;

        const baseId = generateId('PROD');
        const newVariantsList = [];

        mergedVariantsList.forEach((v, idx) => {
           const variantId = v.isDbItem ? v.id : (mergedVariantsList.length > 1 ? `${baseId}-${idx+1}` : baseId);
           const data = {
              ...f, id: variantId, imgUrl: finalImgUrl,
              cost: Number(f.cost)||0, price: Number(f.price)||0, floorPrice: Number(f.floorPrice)||0,
              color: v.color, size: v.size, stock: v.stock
           };
           newVariantsList.push(data);
        });

        if (isEdit) {
           const oldIds = productGroup.map(p => p.id);
           const allIdsToRemove = [...new Set([...oldIds, ...newDeletedVariants])];

           if(onSync) onSync({ removeIds: allIdsToRemove, newItems: newVariantsList }, 'products', 'replace_multiple');
           
           if(typeof google !== 'undefined') {
              if (newDeletedVariants.length > 0) google.script.run.withSuccessHandler(()=>{}).deleteItem('PRODUCTS', newDeletedVariants);
              newVariantsList.forEach(data => {
                  if (data.isDbItem) google.script.run.withSuccessHandler(()=>{}).updateProduct(data);
                  else google.script.run.withSuccessHandler(()=>{}).addProduct(data);
              });
           }
        } else {
           if(onSync) onSync(newVariantsList, 'products', 'add_multiple');
           if(typeof google !== 'undefined') {
              newVariantsList.forEach(data => google.script.run.withSuccessHandler(()=>{}).addProduct(data));
           }
        }
        
        setLoading(false);
        onClose();
      };

        <Modal title={isEdit ? "จัดการรายละเอียดสินค้า" : "เพิ่มสินค้าใหม่"} icon="fa-box" onClose={onClose} maxWidth="max-w-3xl">

                          </div>
                       )}
                       <input type="file" multiple accept="image/*" onChange={handleImageChange} className="absolute inset-0 opacity-0 cursor-pointer" />
                    </div>
                    
                    {(images.length > 0 || existingImages.length > 0) && (
                       <div className="flex gap-2 overflow-x-auto pb-2 snap-x hide-scrollbar">
                          {images.length > 0 
                             ? images.map((img, idx) => <img key={idx} src={URL.createObjectURL(img)} className="w-12 h-12 object-cover rounded-lg snap-center shrink-0 border-2 border-white shadow-sm" />)
                             : existingImages.map((img, idx) => <img key={idx} src={img} className="w-12 h-12 object-cover rounded-lg snap-center shrink-0 border-2 border-white shadow-sm" onError={(e) => { e.target.src = 'https://placehold.co/40x40?text=IMG'; }}/>)
                          }
                       </div>
                    )}
                 </div>

                 <div className="w-full md:w-2/3 space-y-4">
                    <InputField label="ชื่อสินค้า" required value={f.name} onChange={e=>setF({...f, name: e.target.value})} />
                    <div className="grid grid-cols-2 gap-4">
                       <div>
                          <label className="block text-xs font-bold mb-1 text-gray-600">หมวดหมู่ (Category)</label>
                          <select value={f.category} onChange={e=>setF({...f, category: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm outline-none bg-gray-50 focus:ring-2 focus:ring-orange-500">
                             {PRODUCT_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                          </select>
                       </div>
                       <InputField label="ราคาทุน (Cost)" type="number" required value={f.cost} onChange={e=>setF({...f, cost: e.target.value})} />
                       <InputField label="ราคาขาย (Price)" type="number" required value={f.price} onChange={e=>setF({...f, price: e.target.value})} />
                       <InputField label="ส่วนลดได้ต่ำสุด (Floor)" type="number" required value={f.floorPrice} onChange={e=>setF({...f, floorPrice: e.target.value})} />
                    </div>
                 </div>
              </div>

              <div className="bg-orange-50/50 p-4 rounded-2xl border border-orange-100 mt-4">
                 <div className="flex justify-between items-center mb-3">
                    <label className="text-sm font-bold text-gray-800"><i className="fa-solid fa-list-ol text-orange-500 mr-2"></i>ระบุ สี / ไซส์ / จำนวน</label>
                    <button type="button" onClick={addVariant} className="text-xs bg-orange-500 text-white px-3 py-1.5 rounded-lg font-bold hover:bg-orange-600 transition shadow-sm"><i className="fa-solid fa-plus mr-1"></i> เพิ่มรายการสี/ไซส์</button>
                 </div>
                 <div className="space-y-2">
                    {variants.map((v, idx) => (
                       <div key={idx} className="flex items-center gap-2 bg-white p-2 rounded-xl border border-orange-100 shadow-sm relative pr-10">
                          <input type="text" placeholder="สี (เช่น แดง, -)" value={v.color} onChange={e=>updateVariant(idx, 'color', e.target.value)} required className="flex-1 border-none bg-gray-50 p-2 rounded-lg text-sm outline-none focus:ring-1 focus:ring-orange-500" />
                          <input type="text" placeholder="ไซส์ (เช่น L, -)" value={v.size} onChange={e=>updateVariant(idx, 'size', e.target.value)} className="w-20 border-none bg-gray-50 p-2 rounded-lg text-sm outline-none focus:ring-1 focus:ring-orange-500" />
                          <input type="number" placeholder="จำนวน" value={v.stock} onChange={e=>updateVariant(idx, 'stock', e.target.value)} required className="w-24 border-none bg-gray-50 p-2 rounded-lg text-sm font-bold outline-none focus:ring-1 focus:ring-orange-500" />
                          {(variants.length > 1) && <button type="button" onClick={()=>removeVariant(idx)} className="absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 text-red-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition"><i className="fa-solid fa-trash"></i></button>}
                       </div>
                    ))}
                 </div>
                 <p className="text-[10px] text-gray-500 mt-2"><i className="fa-solid fa-circle-info mr-1"></i>หากระบุสีและไซส์เหมือนกัน ระบบจะรวมจำนวนให้เป็นรายการเดียวอัตโนมัติ</p>
              </div>

              <div className="grid grid-cols-2 gap-4 border-t pt-4">
                 <div>
                    <label className="block text-xs font-bold mb-1 text-gray-600">จุดประสงค์</label>
                    <select value={f.visibility} onChange={e=>setF({...f, visibility: e.target.value})} className="w-full border border-blue-200 p-2.5 rounded-xl text-sm bg-blue-50 outline-none text-blue-700 font-bold">
                       <option value="offline">เก็บลงสต็อกหน้าร้าน (POS) ก่อน</option>
                       <option value="online">โชว์บนร้านค้าออนไลน์ด้วย</option>
                    </select>
                 </div>
                 <div>
                    <label className="block text-xs font-bold mb-1 text-gray-600">สถานะสินค้า</label>
                    <select value={f.status} onChange={e=>setF({...f, status: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm bg-gray-50 outline-none"><option value="active">เปิดใช้งาน</option><option value="inactive">ปิดใช้งาน</option></select>
                 </div>
              </div>
              <button type="submit" disabled={loading} className="w-full py-4 mt-2 bg-orange-500 text-white font-bold rounded-xl shadow-md hover:bg-orange-600 transition">{loading ? 'กำลังบันทึก...' : 'บันทึกข้อมูลสินค้า'}</button>
           </form>
        </Modal>
      );
    };

    const CustomerFormModal = ({ customer, onClose, onSync }) => {

          <form onSubmit={save} className="space-y-4">

                 <select value={f.tier} onChange={e=>setF({...f, tier: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm outline-none">

      )
    };

    const UserDetailModal = ({ user, onClose, db, onEdit }) => {
      const mySales = useMemo(() => db.sales.filter(s => s.seller === user.username && s.status !== 'cancelled'), [db.sales, user.username]);
      const salesStats = useMemo(() => {
         const now = new Date();
         const todayStr = formatDateStr(now).split(' ')[0];
         const startOfWeek = new Date(now.getFullYear(), now.getMonth(), now.getDate() - now.getDay()).getTime();
         const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
         const startOfYear = new Date(now.getFullYear(), 0, 1).getTime();
         let d = 0, w = 0, m = 0, y = 0, total = 0;
         mySales.forEach(s => {
            if(!s.date) return;
            const amt = Number(s.total || 0);
            const sTime = new Date(s.date.replace(' ', 'T')).getTime();
            total += amt;
            if(s.date.startsWith(todayStr)) d += amt;
            if(sTime >= startOfWeek) w += amt;
            if(sTime >= startOfMonth) m += amt;
            if(sTime >= startOfYear) y += amt;
         });
         return { daily: d, weekly: w, monthly: m, yearly: y, total: total };
      }, [mySales]);

      return (
        <Modal title="ข้อมูลพนักงาน" icon="fa-id-card" onClose={onClose}>
           <div className="flex flex-col items-center mb-6 relative">

             <div><p className="text-[10px] text-gray-400 font-bold uppercase mb-1">เพศ</p><p className="font-bold text-gray-700">{user.gender || '-'}</p></div>
             <div className="col-span-2"><p className="text-[10px] text-gray-400 font-bold uppercase mb-1">ที่อยู่</p><p className="font-bold text-gray-700">{user.address || '-'}</p></div>
             <div><p className="text-[10px] text-gray-400 font-bold uppercase mb-1">วันที่เข้าทำงาน</p><p className="font-bold text-gray-700">{user.startDate || '-'}</p></div>

           <div className="bg-white p-4 rounded-2xl border border-orange-100 shadow-sm relative overflow-hidden">
             <h4 className="font-black text-orange-600 mb-3"><i className="fa-solid fa-chart-line mr-2"></i>สถิติยอดขาย (เฉพาะที่สมบูรณ์)</h4>
             <div className="grid grid-cols-2 md:grid-cols-4 gap-3 relative z-10">
                <div className="bg-orange-50 p-2 rounded-xl text-center border border-orange-100"><p className="text-[10px] font-bold text-gray-500">วันนี้</p><p className="font-black text-orange-600">{formatMoney(salesStats.daily)}</p></div>
                <div className="bg-orange-50 p-2 rounded-xl text-center border border-orange-100"><p className="text-[10px] font-bold text-gray-500">สัปดาห์นี้</p><p className="font-black text-orange-600">{formatMoney(salesStats.weekly)}</p></div>
                <div className="bg-orange-50 p-2 rounded-xl text-center border border-orange-100"><p className="text-[10px] font-bold text-gray-500">เดือนนี้</p><p className="font-black text-orange-600">{formatMoney(salesStats.monthly)}</p></div>
                <div className="bg-orange-50 p-2 rounded-xl text-center border border-orange-100"><p className="text-[10px] font-bold text-gray-500">ปีนี้</p><p className="font-black text-orange-600">{formatMoney(salesStats.yearly)}</p></div>

    // ==========================================
    // 5. PUBLIC & USER VIEWS
    // ==========================================
    const CheckoutForm = ({ cart, total, onComplete, onSync }) => {
      const [f, setF] = useState({ name: '', phone: '', address: '' });
      const [remember, setRemember] = useState(true);
      const [slipBase64, setSlipBase64] = useState('');
      const [loading, setLoading] = useState(false);

      useEffect(() => { const saved = localStorage.getItem('smartStoreCustomer'); if (saved) setF(JSON.parse(saved)); }, []);
      const handleSlip = async (e) => { if(e.target.files[0]) setSlipBase64(await toBase64(e.target.files[0])); };
      
      const handleSubmit = (e) => {
        e.preventDefault();
        if(!slipBase64) return alert('กรุณาแนบสลิปโอนเงินเพื่อยืนยัน');
        if(remember) localStorage.setItem('smartStoreCustomer', JSON.stringify(f));
        setLoading(true);
        const orderData = { id: generateId('ORD'), date: formatDateStr(new Date()), customerName: f.name, phone: f.phone, address: f.address, items: JSON.stringify(cart), total: total - 40, shippingFee: 40, grandTotal: total, slipUrl: slipBase64, status: 'pending' };
        
        cart.forEach(item => {
           if(onSync) onSync({ ...item, stock: Number(item.stock) - Number(item.qty) }, 'products', 'update');
        });
        if(onSync) onSync(orderData, 'orders', 'add');

        if(typeof google !== 'undefined') { 
            google.script.run.withSuccessHandler(() => { 
                setLoading(false); 
                onComplete(orderData); 
            }).placeOrder(orderData); 
        } 
        else { 
            setTimeout(() => { 
                setLoading(false); 
                onComplete(orderData); 
            }, 500); 
        }
      };

      return (
        <form onSubmit={handleSubmit} className="bg-white rounded-3xl shadow-sm border p-6">
          <h3 className="font-bold text-lg mb-4 text-gray-800">1. ข้อมูลจัดส่ง</h3>
          <InputField label="ชื่อ-นามสกุล" required value={f.name} onChange={e=>setF({...f, name: e.target.value})} />
          <InputField label="เบอร์โทรศัพท์ (สำคัญมาก)" type="tel" required value={f.phone} onChange={e=>setF({...f, phone: e.target.value})} />
          <div className="mb-4 w-full"><label className="block text-xs font-bold mb-1 text-gray-600">ที่อยู่จัดส่งแบบเต็ม</label><textarea required className="w-full border p-2.5 rounded-xl bg-gray-50 text-sm outline-none focus:ring-2 focus:ring-orange-500" rows="3" value={f.address} onChange={e=>setF({...f, address: e.target.value})}></textarea></div>
          <label className="flex items-center gap-2 mb-6 cursor-pointer"><input type="checkbox" checked={remember} onChange={e=>setRemember(e.target.checked)} className="w-4 h-4 accent-orange-500"/><span className="text-xs text-gray-600 font-bold">จดจำข้อมูลของฉันสำหรับครั้งถัดไป</span></label>
          <h3 className="font-bold text-lg mb-4 text-gray-800 pt-4 border-t">2. ชำระเงิน</h3>
          <div className="bg-blue-900 rounded-2xl p-6 text-white text-center mb-4">
             <p className="text-xs font-bold text-blue-200 mb-1">สแกน QR Code เพื่อชำระเงิน</p><h4 className="text-3xl font-black mb-4 text-orange-400">{formatMoney(total)}</h4>
             <div className="bg-white p-2 rounded-xl inline-block mb-3"><img src="https://upload.wikimedia.org/wikipedia/commons/d/d0/QR_code_for_mobile_English_Wikipedia.svg" className="w-32 h-32" /></div>
             <p className="text-xs">พร้อมเพย์: 081-xxx-xxxx<br/>ชื่อบัญชีร้านค้า</p>
          </div>
          <div className="mb-6"><label className="block text-xs font-bold mb-2 text-gray-600">อัปโหลดสลิปโอนเงิน <span className="text-red-500">*</span></label><input type="file" accept="image/*" required onChange={handleSlip} className="text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-orange-50 file:text-orange-700 font-bold" /></div>
          <button type="submit" disabled={loading} className="w-full py-4 bg-orange-500 text-white rounded-2xl font-black text-lg hover:bg-orange-600 shadow-md transition disabled:opacity-50">{loading ? 'กำลังส่งข้อมูล...' : 'ยืนยันคำสั่งซื้อ'}</button>
        </form>
      );
    };

    const OrderTracking = ({ db }) => {
      const [phone, setPhone] = useState(''); const [result, setResult] = useState(null); const [searched, setSearched] = useState(false);
      const handleSearch = (e) => { e.preventDefault(); const found = db.orders.find(o => o.phone === phone); setResult(found || null); setSearched(true); };
      const getStatusUI = (status) => {
        if(status === 'pending') return { text: 'รอตรวจสอบยอดเงิน', color: 'text-yellow-600', icon: 'fa-clock' };
        if(status === 'preparing') return { text: 'กำลังจัดเตรียมพัสดุ', color: 'text-blue-600', icon: 'fa-box' };
        if(status === 'shipped') return { text: 'จัดส่งแล้ว', color: 'text-green-600', icon: 'fa-truck-fast' };
        if(status === 'cancelled') return { text: 'ยกเลิกคำสั่งซื้อแล้ว', color: 'text-red-600', icon: 'fa-times-circle' };
        return { text: 'ไม่ทราบสถานะ', color: 'text-gray-500', icon: 'fa-circle-question' };
      };
      return (
        <div>
          <form onSubmit={handleSearch} className="mb-6"><InputField label="เบอร์โทรศัพท์ที่ใช้สั่งซื้อ" type="tel" required placeholder="08XXXXXXXX" value={phone} onChange={e=>setPhone(e.target.value)} /><button type="submit" className="w-full mt-2 py-3 bg-gray-900 text-white rounded-xl font-bold hover:bg-black transition shadow-sm">ตรวจสอบสถานะ</button></form>
          {searched && !result && <div className="text-center p-4 bg-red-50 text-red-500 rounded-xl text-sm font-bold fade-in"><i className="fa-solid fa-circle-exclamation mr-2"></i>ไม่พบคำสั่งซื้อจากเบอร์นี้</div>}
          {searched && result && (
            <div className="bg-gray-50 rounded-2xl p-5 border border-gray-100 fade-in">
              <p className="text-xs text-gray-500 font-mono mb-1">Order ID: {result.id}</p><h4 className="font-bold text-gray-800 mb-4 border-b pb-2">คุณ {result.customerName}</h4>
              <div className="flex items-center gap-4 mb-4"><div className={`w-12 h-12 rounded-full flex items-center justify-center text-xl bg-white shadow-sm ${getStatusUI(result.status).color}`}><i className={`fa-solid ${getStatusUI(result.status).icon}`}></i></div><div><p className="text-xs text-gray-500 font-bold uppercase tracking-wide">สถานะปัจจุบัน</p><p className={`font-black text-lg ${getStatusUI(result.status).color}`}>{getStatusUI(result.status).text}</p></div></div>
              {result.status === 'shipped' && result.trackingNo && (<div className="bg-white p-3 rounded-xl border border-green-100 flex justify-between items-center mt-4"><div><p className="text-[10px] text-gray-500 font-bold uppercase">เลขพัสดุ</p><p className="font-mono font-black text-green-700">{result.trackingNo}</p></div><button onClick={() => {navigator.clipboard.writeText(result.trackingNo); alert('คัดลอกแล้ว');}} className="text-xs bg-gray-100 px-3 py-1.5 rounded-lg font-bold hover:bg-gray-200">คัดลอก</button></div>)}
            </div>
          )}
        </div>
      );
    };

    const StoreFront = ({ db, onSwitchToAdmin, onSync }) => {
      const [cart, setCart] = useState([]);
      const [view, setView] = useState('home');
      const [selectedProductGroup, setSelectedProductGroup] = useState(null);
      const [selectedVariantId, setSelectedVariantId] = useState(null);
      const [detailQty, setDetailQty] = useState(1);
      const [completedOrder, setCompletedOrder] = useState(null);
      const [category, setCategory] = useState('all');

      const visibleProducts = db.products.filter(p => p.status === 'active' && p.visibility === 'online');
      
      const groupedProducts = useMemo(() => {
        const groups = {};
        visibleProducts.filter(p => category === 'all' || p.category === category).forEach(p => {
           const key = p.name.trim();
           if(!groups[key]) groups[key] = { ...p, totalStock: 0, items: [] };
           groups[key].totalStock += (Number(p.stock) || 0);
           groups[key].items.push(p);
        });
        return Object.values(groups);
      }, [visibleProducts, category]);

      useEffect(() => {
         if (selectedProductGroup && selectedProductGroup.items.length > 0) {
            setSelectedVariantId(selectedProductGroup.items[0].id);
         }
      }, [selectedProductGroup]);

      const activeVariant = selectedProductGroup?.items.find(i => i.id === selectedVariantId) || selectedProductGroup?.items[0];

      const handleAddToCartFromDetail = () => {
        if(!activeVariant) return;
        if(Number(activeVariant.stock) < detailQty) return alert('สต็อกไม่พอ!');
        if(detailQty < 1) return alert('จำนวนขั้นต่ำคือ 1');

        setCart(prev => {
          const existing = prev.find(item => item.id === activeVariant.id);
          if (existing) {
            if(Number(existing.qty) + detailQty > Number(activeVariant.stock)) { alert('สต็อกไม่พอ'); return prev; }
            return prev.map(item => item.id === activeVariant.id ? { ...item, qty: Number(item.qty) + detailQty } : item);
          }
          return [...prev, { ...activeVariant, qty: detailQty }];
        });
        setView('home');
        setDetailQty(1);
      };
      
      const removeFromCart = (id) => setCart(prev => prev.filter(item => item.id !== id));
      const cartTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

      return (
        <div className="min-h-screen bg-gray-50 flex flex-col">
          <header className="glass-effect sticky top-0 z-40 border-b border-gray-200 px-4 py-3 flex justify-between items-center shadow-sm">
            <div className="flex items-center gap-2 cursor-pointer" onClick={() => setView('home')}>
              <div className="bg-orange-500 text-white w-8 h-8 rounded-lg flex items-center justify-center font-black"><i className="fa-solid fa-bag-shopping"></i></div>

            <div className="flex items-center gap-4 text-gray-600">

              <button onClick={() => setView('tracking')} className="text-sm font-bold hover:text-orange-500 transition"><i className="fa-solid fa-truck-fast mr-1"></i> ติดตามพัสดุ</button>
              <button onClick={() => setView('cart')} className="relative p-2 hover:bg-orange-50 rounded-full transition text-gray-800">
                <i className="fa-solid fa-cart-shopping text-xl"></i>
                {cart.length > 0 && <span className="absolute top-0 right-0 bg-red-500 text-white text-[10px] font-bold w-4 h-4 flex items-center justify-center rounded-full animate-bounce">{cart.length}</span>}
              </button>
            </div>
          </header>

          <main className="flex-1 max-w-5xl mx-auto w-full p-4 relative pb-20">
            {view === 'home' && (
              <div className="fade-in space-y-6">

                  <button onClick={() => setCategory('all')} className={`px-5 py-2 rounded-full text-sm font-bold whitespace-nowrap transition ${category === 'all' ? 'bg-orange-500 text-white shadow-md' : 'bg-white border text-gray-600 hover:bg-orange-50'}`}>ทั้งหมด</button>
                  {PRODUCT_CATEGORIES.map(cat => (
                    <button key={cat} onClick={() => setCategory(cat)} className={`px-5 py-2 rounded-full text-sm font-bold whitespace-nowrap transition ${category === cat ? 'bg-orange-500 text-white shadow-md' : 'bg-white border text-gray-600 hover:bg-orange-50'}`}>{cat}</button>
                  ))}
                </div>
                <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                  {groupedProducts.map(p => {
                    const firstImg = parseFilesInfo(p.imgUrl).images[0] || 'https://placehold.co/400x400?text=No+Image';
                    return (
                      <div key={p.name} onClick={() => { setSelectedProductGroup(p); setDetailQty(1); setView('detail'); }} className="bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-100 hover:shadow-lg transition cursor-pointer group flex flex-col">

                          {p.totalStock <= 0 && <div className="absolute inset-0 bg-white/60 flex items-center justify-center backdrop-blur-[2px]"><span className="bg-gray-800 text-white font-bold px-3 py-1 rounded-lg">สินค้าหมด</span></div>}
                        </div>
                        <div className="p-3 flex flex-col flex-1">
                          <p className="text-sm font-bold text-gray-800 line-clamp-2 leading-tight mb-1">{p.name}</p>
                          <p className="text-[10px] font-bold text-orange-500 mb-1">{p.category}</p>
                          {p.totalStock > 0 && <p className="text-xs text-gray-400 mb-2">{p.items.length} ตัวเลือก</p>}
                          <div className="mt-auto flex justify-between items-end">
                            <p className="text-orange-600 font-black text-lg">{formatMoney(p.price)}</p>
                            <button className="w-8 h-8 rounded-full bg-orange-50 text-orange-600 group-hover:bg-orange-500 group-hover:text-white transition flex items-center justify-center"><i className="fa-solid fa-basket-shopping"></i></button>
                          </div>
                        </div>
                      </div>
                    )
                  })}
                  {groupedProducts.length === 0 && <div className="col-span-full text-center py-20 text-gray-400 font-bold">ไม่พบสินค้าในหมวดหมู่นี้</div>}
                </div>
              </div>
            )}
            {view === 'detail' && selectedProductGroup && activeVariant && (
              <div className="fade-in bg-white rounded-3xl shadow-sm border p-4 md:p-8 flex flex-col md:flex-row gap-8">
                 <div className="md:w-1/2 w-full">
                    <div className="flex gap-2 overflow-x-auto hide-scrollbar snap-x">
                       {parseFilesInfo(selectedProductGroup.imgUrl).images.map((img, i) => (
                         <img key={i} src={img} className="w-full aspect-square object-cover rounded-2xl snap-center shrink-0" onError={(e) => { e.target.src = 'https://placehold.co/400x400?text=No+Image'; }} />
                       ))}
                    </div>
                 </div>

                    <button onClick={() => setView('home')} className="text-gray-400 mb-4 self-start hover:text-gray-800 font-bold"><i className="fa-solid fa-arrow-left mr-2"></i> กลับไปช้อปต่อ</button>
                    <span className="text-xs font-bold text-orange-500 bg-orange-50 px-3 py-1 rounded-full self-start mb-3">{selectedProductGroup.category}</span>
                    <h2 className="text-2xl md:text-3xl font-black text-gray-800 mb-2">{selectedProductGroup.name}</h2>
                    <p className="text-3xl font-black text-orange-600 mb-4">{formatMoney(activeVariant.price)}</p>
                    
                    <div className="mb-6">
                       <label className="block text-sm font-bold mb-2 text-gray-700">เลือกตัวเลือกสินค้า (สี/ไซส์)</label>
                       <select value={selectedVariantId} onChange={e=>{setSelectedVariantId(e.target.value); setDetailQty(1);}} className="w-full border-2 border-orange-200 p-3 rounded-xl outline-none focus:border-orange-500 text-sm font-bold bg-white">
                          {selectedProductGroup.items.map(v => (
                             <option key={v.id} value={v.id} disabled={Number(v.stock) <= 0}>
                                สี: {v.color} {v.size && v.size !== '-' ? `| ไซส์: ${v.size}` : ''} {Number(v.stock) <= 0 ? '(หมด)' : `(เหลือ ${v.stock} ชิ้น)`}
                             </option>
                          ))}
                       </select>
                    </div>

                    <div className="flex items-center gap-4 mb-6">
                       <label className="text-sm font-bold text-gray-700">จำนวน:</label>
                       <div className="flex items-center border border-gray-300 rounded-xl bg-white overflow-hidden shadow-sm">
                          <button onClick={() => setDetailQty(Math.max(1, detailQty - 1))} className="px-4 py-2 text-gray-500 hover:bg-gray-100 font-black">-</button>
                          <input type="number" min="1" max={activeVariant?.stock || 1} value={detailQty} onChange={e => setDetailQty(Number(e.target.value))} className="w-12 text-center font-bold outline-none border-x border-gray-100" />
                          <button onClick={() => setDetailQty(Math.min(activeVariant?.stock || 1, detailQty + 1))} className="px-4 py-2 text-gray-500 hover:bg-gray-100 font-black">+</button>
                       </div>

                    <div className="bg-gray-50 rounded-xl p-4 mb-6 text-sm text-gray-600">
                      <p className="mb-1"><i className="fa-solid fa-box mr-2"></i> สต็อกคงเหลือ (รายการที่เลือก): <span className="font-bold text-gray-800">{activeVariant.stock} ชิ้น</span></p>

                          <i className="fa-solid fa-cart-plus mr-2"></i> เพิ่มลงตะกร้า

                          <i className="fa-brands fa-line text-2xl mr-2"></i> ซื้อราคาส่ง / ทักแชทต่อรองราคา

                  <div className="text-center py-20 bg-white rounded-3xl shadow-sm border"><i className="fa-solid fa-basket-shopping text-6xl text-gray-200 mb-4"></i><p className="text-gray-500 font-bold">ตะกร้าว่างเปล่า</p><button onClick={()=>setView('home')} className="mt-4 px-6 py-2 bg-orange-50 text-orange-600 rounded-full font-bold">ไปช้อปปิ้งกันเลย</button></div>
